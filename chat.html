const DAILY_FIRE_HOUR_UTC=8;

function _qcDayKey(){
  const d=new Date();
  if(d.getUTCHours()<DAILY_FIRE_HOUR_UTC){
    d.setUTCDate(d.getUTCDate()-1);
  }
  return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
}

function _qcBankIdx(dayKey,bankLen){
  let h=0;
  for(let i=0;i<dayKey.length;i++){h=((h<<5)-h+dayKey.charCodeAt(i))|0;}
  return Math.abs(h)%Math.max(1,bankLen);
}

async function _qcRunDailyFire(){
  if(!me||!me.username)return;
  const srvId=QS_ID;
  const today=_qcDayKey();

  try{
    const stateRef=db.ref('serverState/'+srvId+'/daily');
    const snap=await stateRef.once('value');
    const state=snap.val()||{};
    
    if(state.podKey!==today){
      const idx=_qcBankIdx(today,POTD_BANK.length);
      const item=POTD_BANK[idx];
      const now=Date.now();
      const poll={
        question:'📊 Poll of the Day — '+item.q,
        options:item.opts.map((t,i)=>({id:'o'+i+'_'+Math.random().toString(36).slice(2,6),text:t})),
        multi:false,anonymous:false,closed:false,createdAt:now,isPotd:true,potdDate:today
      };

      const claim=await stateRef.child('podKey').transaction(cur=>{
        if(cur===today)return; 
        return today;
      });
      if(claim.committed&&claim.snapshot.val()===today){
        const wasOld=state.podKey&&state.podKey!==today;
        if(wasOld||!state.podKey){
          await db.ref('messages/'+srvId+'/poll-of-the-day').push({
            username:'PeakBot',uid:'system',displayName:'PeakBot',
            avatarUrl:'',userRole:'system',
            text:'',ts:now,replyTo:null,edited:false,
            type:'poll',poll
          });
        }
      }
    }
    
    if(state.qotdKey!==today){
      const idx=_qcBankIdx(today+'q',QOTD_BANK.length);
      const q=QOTD_BANK[idx];
      const now=Date.now();
      const claim=await stateRef.child('qotdKey').transaction(cur=>{
        if(cur===today)return;
        return today;
      });
      if(claim.committed&&claim.snapshot.val()===today){

        await db.ref('messages/'+srvId+'/question-of-the-day').push({
          username:'PeakBot',uid:'system',displayName:'PeakBot',
          avatarUrl:'',userRole:'system',
          text:'❓ **Question of the Day** — '+q+'\n\n_Reply in the thread below._',
          ts:now,replyTo:null,edited:false,
          isQotd:true,qotdDate:today,threadOpen:true
        });
      }
    }
  }catch(e){console.warn('[PC] daily fire failed',e);}
}

function _qcInstallDailyFire(){
  if(window._qcDailyFireBound)return;
  window._qcDailyFireBound=true;
  _qcRunDailyFire();
  setInterval(_qcRunDailyFire,60*60*1000); 
}

function applySrvData(d){
  srvData.name=d.name||'PeakServer';
  srvData.description=d.description||'';
  srvData.iconUrl=d.iconUrl||'';
  srvData.iconEmoji=d.iconEmoji||'';
  srvData.accent=d.accent||'';
  srvData.categories=d.categories?Object.values(d.categories).filter(Boolean):[];
  srvData.channels=d.channels?Object.values(d.channels).filter(Boolean):[];
  srvData.slowMode=d.slowMode||0;
  srvData.inviteCode=d.inviteCode||'';
  srvData.welcomeChannel=d.welcomeChannel||'general';
  srvData.welcomeMessage=d.welcomeMessage||'';
  srvData.verificationLevel=d.verificationLevel||'none';
  srvData.explicitFilter=d.explicitFilter!==false;
  srvData.rateLimitEnabled=d.rateLimitEnabled!==false;
  srvData.blockDMs=!!d.blockDMs;
  srvData.locked=!!d.locked;
  srvData.blockedWords=Array.isArray(d.blockedWords)?d.blockedWords:[];
  srvData.minAgeMin=d.minAgeMin||0;
  srvData.members=d.members||{};
  
  Object.keys(PC_OWNERS).forEach(u=>{if(srvData.members[u])srvData.members[u].role='pc-owner';});
  srvData.owner=d.owner||'';
  
  srvData.customRoles=Array.isArray(d.customRoles)?d.customRoles:(d.customRoles?Object.values(d.customRoles).filter(Boolean):[]);
  srvData.channels.sort((a,b)=>(a.position||0)-(b.position||0));
  srvData.categories.sort((a,b)=>(a.position||0)-(b.position||0));
  
}

let srvListenerRef=null;
async function loadSrvData(){
  if(srvListener&&srvListenerRef){srvListenerRef.off('value',srvListener);srvListener=null;srvListenerRef=null;}
  const ref=db.ref('servers/'+G.srvId);
  srvListenerRef=ref;
  const snap=await ref.once('value');
  applySrvData(snap.val()||{});
  
  const mem=snap.val()?.members?.[me.username];
  if(mem){me.role=mem.role||'member';me._customRoleIds=Array.isArray(mem.customRoles)?mem.customRoles:[];}

  let srvDeb=null;
  srvListener=ref.on('value',s=>{
    const v=s.val()||{};
    applySrvData(v);
    const mm=v.members?.[me.username];
    if(mm){me.role=mm.role||'member';me._customRoleIds=Array.isArray(mm.customRoles)?mm.customRoles:[];}

    clearTimeout(srvDeb);
    srvDeb=setTimeout(()=>{
      try{
        if(G.view==='server'){
          buildSide();
          
          const sn=document.getElementById('srvHdName');if(sn)sn.textContent=srvData.name||'';
        }
        
        buildRail();
      }catch(e){}
    },60);
  });
}

async function loadMyServers(){
  const snap=await db.ref('servers').once('value');
  const all=snap.val()||{};
  myServers=Object.entries(all)

    .filter(([id,d])=>d&&d.name&&d.members&&d.members[me.username])

    .filter(([id])=>id!=='quantum-server-v2'&&id!=='quantum-server-v1')
    .map(([id,d])=>({id,name:d.name,inv:d.inviteCode,iconUrl:d.iconUrl||'',iconEmoji:d.iconEmoji||''}));

  try{
    const usSnap=await db.ref('userServers/'+me.username).once('value');
    const us=usSnap.val()||{};
    const validIds=new Set(myServers.map(s=>s.id));
    const purge={};
    Object.keys(us).forEach(srvId=>{
      if(srvId==='quantum-server-v2'||srvId==='quantum-server-v1'||!all[srvId]||!validIds.has(srvId)&&srvId!==QS_ID){
        purge['userServers/'+me.username+'/'+srvId]=null;
      }
    });
    if(Object.keys(purge).length){db.ref().update(purge).catch(()=>{});}
  }catch(e){}
}

window._globalBanListeners=window._globalBanListeners||{};
function _ejectFromServer(srvId,reason){
  
  try{db.ref('servers/'+srvId+'/members/'+me.username).remove().catch(()=>{});}catch(e){}
  try{db.ref('userServers/'+me.username+'/'+srvId).remove().catch(()=>{});}catch(e){}
  
  myServers=(myServers||[]).filter(s=>s.id!==srvId);
  toast('🚫 Banned from a server: '+(reason||'No reason given'),'error');
  if(G.srvId===srvId){
    G.srvId='';G.channel='';G.view='dm';
    if(window._banListener){try{window._banListener.ref.off('value',window._banListener.cb);}catch(e){}window._banListener=null;}
    if(window._timeoutListener){try{window._timeoutListener.ref.off('value',window._timeoutListener.cb);}catch(e){}window._timeoutListener=null;}
    try{showDMScreen();}catch(e){}
  }
  try{buildRail();}catch(e){}
  
  const L=window._globalBanListeners[srvId];
  if(L){try{L.ref.off('value',L.cb);}catch(e){}delete window._globalBanListeners[srvId];}
}
function installGlobalBanWatcher(){
  if(!me.username)return;
  
  const usRef=db.ref('userServers/'+me.username);
  
  if(window._userServersWatcher){try{window._userServersWatcher.ref.off('value',window._userServersWatcher.cb);}catch(e){}}
  const cb=usRef.on('value',snap=>{
    const v=snap.val()||{};
    const want=new Set(Object.keys(v));
    
    want.add(QS_ID);
    
    want.forEach(srvId=>{
      if(window._globalBanListeners[srvId])return;
      const ref=db.ref('servers/'+srvId+'/bans/'+me.username);
      const listenerCb=ref.on('value',bs=>{
        if(!bs.exists())return;
        
        const val=bs.val()||{};
        _ejectFromServer(srvId,val.reason);
      });
      window._globalBanListeners[srvId]={ref,cb:listenerCb};
    });
    
    Object.keys(window._globalBanListeners).forEach(srvId=>{
      if(!want.has(srvId)){
        const L=window._globalBanListeners[srvId];
        try{L.ref.off('value',L.cb);}catch(e){}
        delete window._globalBanListeners[srvId];
      }
    });
  });
  window._userServersWatcher={ref:usRef,cb};

  db.ref('servers').once('value').then(s=>{
    const all=s.val()||{};
    const backfill={};
    Object.entries(all).forEach(([srvId,d])=>{
      if(!d||!d.members||!d.members[me.username])return;

      backfill['userServers/'+me.username+'/'+srvId]=true;
      if(window._globalBanListeners[srvId])return;
      const ref=db.ref('servers/'+srvId+'/bans/'+me.username);
      const listenerCb=ref.on('value',bs=>{
        if(!bs.exists())return;
        
        const val=bs.val()||{};
        _ejectFromServer(srvId,val.reason);
      });
      window._globalBanListeners[srvId]={ref,cb:listenerCb};
    });
    
    if(Object.keys(backfill).length){
      try{db.ref().update(backfill).catch(()=>{});}catch(e){}
    }
  }).catch(()=>{});
}

function _dmParts(dm){
  if(!dm)return [];
  const p=dm.participants;
  if(!p)return [];
  if(Array.isArray(p))return p.filter(x=>typeof x==='string'&&x);
  if(typeof p==='object')return Object.values(p).filter(x=>typeof x==='string'&&x);
  return [];
}
function _dmHasMe(dm){return _dmParts(dm).includes(me.username);}
function _dmCanonId(dm){
  if(dm.isGroup)return null;
  const other=_dmParts(dm).find(p=>p!==me.username);
  if(!other)return null;
  return 'dm-'+[me.username,other].slice().sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase())).join('-');
}
function _dmKey(dm){
  if(dm.isGroup)return 'grp:'+_dmParts(dm).map(p=>p.toLowerCase()).sort().join('|');
  const other=_dmParts(dm).find(p=>p!==me.username);
  if(!other)return 'solo:'+dm.id;
  return '1:1:'+[me.username,other].map(s=>s.toLowerCase()).sort().join('|');
}

async function loadDmChannels(){
  
  let ids=[];
  try{
    const idx=await db.ref('userDms/'+me.username).once('value');
    ids=Object.keys(idx.val()||{});
  }catch(e){console.warn('[dm] userDms read failed',e);}

  if(!ids.length){
    try{
      const snap=await db.ref('dmChannels').once('value');
      const all=snap.val()||{};
      Object.entries(all).forEach(([id,d])=>{
        if(d&&_dmHasMe({participants:d.participants}))ids.push(id);
      });
      
      if(ids.length){
        const upd={};
        ids.forEach(id=>{upd['userDms/'+me.username+'/'+id]=true;});
        db.ref().update(upd).catch(()=>{});
      }
    }catch(e){console.warn('[dm] /dmChannels backstop failed',e);}
  }
  
  const fetched=await Promise.all(ids.map(id=>
    db.ref('dmChannels/'+id).once('value')
      .then(s=>s.exists()?{id,...s.val()}:null)
      .catch(()=>null)
  ));
  
  const channels=fetched.filter(c=>c&&_dmHasMe(c));
  
  const seen=new Map();
  const dedup=[];
  const scoreOf=dm=>{
    let s=0;
    const canon=_dmCanonId(dm);
    if(canon&&dm.id===canon)s+=1000;
    if(dm.isGroup)s+=500;
    s-=Math.floor((dm.createdAt||Date.now())/1000);
    return s;
  };
  for(const dm of channels){
    const k=_dmKey(dm);
    if(!seen.has(k)){seen.set(k,dm);dedup.push(dm);continue;}
    const ex=seen.get(k);
    if(scoreOf(dm)>scoreOf(ex)){
      const i=dedup.findIndex(x=>x.id===ex.id);
      if(i>=0)dedup[i]=dm;
      seen.set(k,dm);
    }
  }
  dmChannels=dedup;
  
  const seenU=new Set();
  dedup.forEach(dm=>_dmParts(dm).forEach(p=>{
    if(!p||p===me.username||seenU.has(p))return;
    seenU.add(p);
    const cached=window._userProfiles&&window._userProfiles[p];
    if(!cached||!cached.displayName){
      _fetchProfile(p,()=>{try{renderDmList();buildRail();}catch(e){}});
    }
  }));
  _dmsHydrated=true;
}

function joinServer(id){
  G.srvId=id;G.channel='';
  if(G.view!=='server'){showServerView();}
  loadSrvData().then(()=>{
    buildSide();watchMembers();

    const staff=isStaff();
    const hiddenCatIds=new Set((srvData.categories||[]).filter(c=>c.staffOnly&&!staff).map(c=>c.id));
    const visible=c=>c.type==='text'&&!(c.staffOnly&&!staff)&&!(c.categoryId&&hiddenCatIds.has(c.categoryId));
    
    let chObj=srvData.channels.find(c=>visible(c)&&(c.name||'').toLowerCase()==='general');
    if(!chObj)chObj=srvData.channels.find(visible);
    if(chObj)joinCh(chObj.id);

    if(window._banListener){try{window._banListener.ref.off('value',window._banListener.cb);}catch(e){}window._banListener=null;}
    const banRef=db.ref('servers/'+id+'/bans/'+me.username);
    const banCb=banRef.on('value',bs=>{
      if(!bs.exists())return;

      const v=bs.val()||{};
      
      try{db.ref('servers/'+id+'/members/'+me.username).remove().catch(()=>{});}catch(e){}
      try{db.ref('userServers/'+me.username+'/'+id).remove().catch(()=>{});}catch(e){}
      toast('🚫 You are banned from this server: '+(v.reason||'No reason'),'error');
      
      try{
        G.srvId='';G.channel='';G.view='dm';
        if(window._timeoutListener){try{window._timeoutListener.ref.off('value',window._timeoutListener.cb);}catch(e){}window._timeoutListener=null;}
        if(typeof showDMScreen==='function')showDMScreen();
        if(typeof buildRail==='function')buildRail();
      }catch(e){}
    });
    window._banListener={ref:banRef,cb:banCb};

    if(window._timeoutListener){try{window._timeoutListener.ref.off('value',window._timeoutListener.cb);}catch(e){}window._timeoutListener=null;}
    const toRef=db.ref('servers/'+id+'/timeouts/'+me.username);
    const toCb=toRef.on('value',ts=>{
      const inp=document.getElementById('msgInput');
      const v=ts.val()||null;
      const remMs=v?(v.until||0)-Date.now():0;
      clearTimeout(window._toReenableTimer);
      if(v&&remMs>0){
        const rem=Math.ceil(remMs/1000);
        const human=rem>=86400?Math.ceil(rem/86400)+'d':rem>=3600?Math.ceil(rem/3600)+'h':rem>=60?Math.ceil(rem/60)+'m':rem+'s';
        toast(`\u23f1\ufe0f You're timed out in this server for ${human}${v.reason?' \u2014 '+v.reason:''}`,'error');
        if(inp){

          inp.disabled=true;
          inp.placeholder=`Timed out for ${human}\u2026`;
          try{inp.blur();}catch(e){}

          inp.value='';
        }
        window._toReenableTimer=setTimeout(()=>{
          db.ref('servers/'+id+'/timeouts/'+me.username).remove().catch(()=>{});
          const i2=document.getElementById('msgInput');if(i2){i2.disabled=false;i2.placeholder='Message';}
          toast('Timeout expired','success');
        },remMs+200);
      }else{
        if(inp&&inp.placeholder&&inp.placeholder.startsWith('Timed out')){inp.disabled=false;inp.placeholder='Message';}
      }
    });
    window._timeoutListener={ref:toRef,cb:toCb};
  });
  buildRail();
}

async function _watchSuggestionUnread(){
  if(window._sugUnreadWatcher)return; 
  window._sugUnreadWatcher=true;
  let seen=0;
  try{const s=await db.ref('users/'+me.username+'/lastSeenSuggestion').once('value');seen=s.val()||0;}catch(e){}
  const ref=db.ref('suggestions').orderByChild('ts').startAt(seen+1);
  ref.on('value',snap=>{
    let cnt=0;
    snap.forEach(c=>{const v=c.val();if(v&&v.by!==me.username&&(v.ts||0)>seen)cnt++;});
    const b=document.getElementById('sugBadge');
    if(!b)return;
    if(cnt>0){b.style.display='inline-block';b.textContent=cnt>99?'99+':cnt;}
    else{b.style.display='none';b.textContent='0';}
  });
}

    }
  };
  
  if(_sugListener){try{_sugListener.ref.off('value',_sugListener.cb);}catch(e){}}
  const ref=db.ref('suggestions').limitToLast(80);
  const cb=ref.on('value',snap=>{
    const list=document.getElementById('sugList');if(!list)return;
    const arr=[];snap.forEach(c=>arr.push({key:c.key,...c.val()}));
    arr.sort((a,b)=>(Object.keys(b.votes||{}).length-Object.keys(a.votes||{}).length)||(b.ts-a.ts));
    if(!arr.length){list.innerHTML='<div style="padding:30px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:12px">Be the first to suggest something!</div>';return;}
    list.innerHTML=arr.map(s=>{
      const votes=Object.keys(s.votes||{}).length;
      const voted=(s.votes||{})[me.username];
      const isOwner=s.by===me.username;
      return`<div style="padding:14px;border:1px solid rgba(179, 136, 255,.12);border-radius:10px;background:rgba(10,7,22,.5);display:flex;gap:12px;align-items:flex-start">
        <button class="sug-vote${voted?' on':''}" data-sugv="${eattr(s.key)}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:44px;padding:6px 4px;border:1px solid ${voted?'var(--cyan)':'rgba(179, 136, 255,.18)'};background:${voted?'rgba(179, 136, 255,.12)':'transparent'};color:${voted?'var(--cyan)':'var(--txt)'};border-radius:8px;cursor:pointer;font-family:var(--mono)">
          <i class="fa-solid fa-arrow-up" style="font-size:11px"></i>
          <span style="font-size:13px;font-weight:700">${votes}</span>
        </button>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;line-height:1.45;word-break:break-word">${esc(s.text)}</div>
          <div style="font-size:10.5px;color:var(--muted);font-family:var(--mono);margin-top:6px">by <strong style="color:${hue(s.by)}">${esc(s.by)}</strong> \u00b7 ${fmtTimeFull(s.ts)}</div>
        </div>
        ${isOwner?`<button class="btn-ghost" data-sugdel="${eattr(s.key)}" style="padding:4px 8px;font-size:10px;color:var(--rose)"><i class="fa-solid fa-trash-can"></i></button>`:''}
      </div>`;
    }).join('');
    list.querySelectorAll('[data-sugv]').forEach(b=>b.onclick=async()=>{
      const k=b.dataset.sugv;
      const r=db.ref('suggestions/'+k+'/votes/'+me.username);
      const e2=await r.once('value');e2.exists()?await r.remove():await r.set(true);
    });
    list.querySelectorAll('[data-sugdel]').forEach(b=>b.onclick=async()=>{
      const ok=await uiConfirm('Delete this suggestion?',{title:'Delete Suggestion',okLabel:'Delete',danger:true});
      if(!ok)return;
      try{
        await db.ref('suggestions/'+b.dataset.sugdel).remove();
        const v=await db.ref('suggestions/'+b.dataset.sugdel).once('value');
        if(v.exists())throw new Error('Delete rejected \u2014 check database rules');
        toast('Suggestion deleted','success');
      }catch(e){
        console.error('suggestion delete failed',e);
        toast('Delete failed: '+(e.message||e.code||'unknown'),'error');
      }
    });
  });
  _sugListener={ref,cb};
}
let _sugListener=null;

async function renderChangelogTab(c){
  
  const postersSnap=await db.ref('changelogPosters').once('value');
  const posters=postersSnap.val()||{};
  const canPost=!!posters[me.username];

  c.innerHTML=`<div style="flex:1;min-height:0;padding:24px;overflow-y:auto;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <div style="font-family:var(--grotesk);font-size:22px;font-weight:700"><i class="fa-solid fa-rocket" style="color:var(--cyan)"></i> Updates &amp; Changelog</div>
      
    </div>
    <div style="font-size:12px;color:var(--muted);font-family:var(--mono)">Platform-wide announcements${canPost?' \u2014 you can post.':' \u2014 only authorized users can post.'}</div>
    ${canPost?`<div style="display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid rgba(179, 136, 255,.18);border-radius:10px;background:rgba(179, 136, 255,.04)">
      <input id="cgTitle" placeholder="Title (e.g. v1.2 \u2014 New reactions UI)" class="modal-inp" maxlength="80"/>
      <textarea id="cgBody" placeholder="What changed? Markdown-ish supported (**bold**, *italic*, \`code\`)" rows="3" class="modal-inp" style="resize:vertical;min-height:74px"></textarea>
      <div style="display:flex;gap:8px"><button class="btn-sub" id="cgPost"><i class="fa-solid fa-paper-plane"></i> Post Update</button></div>
    </div>`:''}
    <div id="cgList" style="display:block;margin-top:8px;flex-shrink:0"><div style="color:var(--muted);font-family:var(--mono);font-size:12px">Loading\u2026</div></div>
  </div>`;
  if(canPost){
    document.getElementById('cgPost').onclick=async()=>{
      const btn=document.getElementById('cgPost');
      const ti=document.getElementById('cgTitle').value.trim();
      const bo=document.getElementById('cgBody').value.trim();
      if(!ti||!bo){toast('Add a title and body','error');return;}
      if(btn.disabled)return;
      btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Posting\u2026';
      try{
        const now=Date.now();
        const ref=await db.ref('changelog').push({title:ti,body:bo,by:me.username,ts:now});
        // Confirm the write actually persisted (catches silent rule failures)
        const ver=await db.ref('changelog/'+ref.key).once('value');
        if(!ver.exists())throw new Error('Write rejected — check database rules for /changelog');
        // MIRROR to the #changelog channel inside PeakServer so the same
        // update shows up in the server feed. We reuse the changelog entry's
        // push-key as the message key so delete-sync can find it later.
        try{
          await db.ref('messages/'+QS_ID+'/changelog/'+ref.key).set({
            username:'PeakBot',uid:'system',displayName:'PeakBot',
            avatarUrl:'',userRole:'system',
            text:`**${ti}**\n\n${bo}\n\n— posted by @${me.username}`,
            ts:now,replyTo:null,edited:false,pinned:false,
            changelogId:ref.key,
            isChangelogMirror:true
          });
        }catch(mirrorErr){console.warn('changelog mirror to QS failed',mirrorErr);}
        document.getElementById('cgTitle').value='';document.getElementById('cgBody').value='';
        toast('Update posted','success');
      }catch(e){
        console.error('changelog post failed',e);
        toast('Post failed: '+(e.message||e.code||'unknown'),'error');
      }finally{
        btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-paper-plane"></i> Post Update';
      }
    };
  }

  if(_cgListener){try{_cgListener.ref.off('value',_cgListener.cb);}catch(e){}}
  // Pull EVERY changelog entry \u2014 no limit. The user explicitly asked to see
  // every update they've ever posted. limitToLast(40) was masking older ones.
  // Read once (snapshot) + listen for additions; works even if the dataset
  // is large because the records are tiny (~200 bytes each).
  const ref=db.ref('changelog');
  const cb=ref.on('value',snap=>{
    const list=document.getElementById('cgList');if(!list)return;
    const arr=[];snap.forEach(c=>{const v=c.val();if(v)arr.push({key:c.key,...v});});
    // Sort newest-first; entries without ts go to the bottom
    arr.sort((a,b)=>(b.ts||0)-(a.ts||0));
    console.log('[changelog] rendering',arr.length,'entries');
    if(!arr.length){list.innerHTML='<div style="padding:30px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:12px">No updates yet.</div>';return;}
    // Count badge so the user can see how many entries are in DB vs visible
    const header=`<div style="font-size:11px;color:var(--muted);font-family:var(--mono);margin-bottom:10px"><i class="fa-solid fa-list-ol" style="color:var(--cyan)"></i> ${arr.length} update${arr.length===1?'':'s'} total</div>`;
    list.innerHTML=header+arr.map(u=>{
      const isOwner=u.by===me.username;
      const title=u.title||'(untitled)';
      const body=u.body||'';
      const by=u.by||'unknown';
      const tsStr=u.ts?fmtTimeFull(u.ts):'(no timestamp)';
      return`<div style="padding:16px;border:1px solid rgba(179, 136, 255,.14);border-radius:10px;background:rgba(10,7,22,.55);position:relative;margin-bottom:12px;display:block;flex-shrink:0">
        <div style="font-family:var(--grotesk);font-size:16px;font-weight:700;margin-bottom:6px">${esc(title)}</div>
        <div style="font-size:12.5px;line-height:1.5;color:var(--txt);white-space:pre-wrap;word-wrap:break-word">${fmtText(body)}</div>
        <div style="font-size:10.5px;color:var(--muted);font-family:var(--mono);margin-top:10px">posted by <strong style="color:${hue(by)}">${esc(by)}</strong> \u00b7 ${tsStr}</div>
        ${isOwner?`<button class="btn-ghost" data-cgdel="${eattr(u.key)}" style="position:absolute;top:8px;right:8px;padding:4px 8px;font-size:10px;color:var(--rose)"><i class="fa-solid fa-trash-can"></i></button>`:''}
      </div>`;
    }).join('');
    list.querySelectorAll('[data-cgdel]').forEach(b=>b.onclick=async()=>{
      const ok=await uiConfirm('Delete this update? This cannot be undone.',{title:'Delete Update',okLabel:'Delete',danger:true});
      if(!ok)return;
      try{
        await db.ref('changelog/'+b.dataset.cgdel).remove();
        // Verify removal
        const v=await db.ref('changelog/'+b.dataset.cgdel).once('value');
        if(v.exists())throw new Error('Delete rejected — check database rules');
        // Tear down the mirrored message in #changelog (same key as the
        // changelog entry, set by the post handler above).
        try{await db.ref('messages/'+QS_ID+'/changelog/'+b.dataset.cgdel).remove();}catch(e){console.warn('changelog mirror delete failed',e);}
        toast('Update deleted','success');
      }catch(e){
        console.error('changelog delete failed',e);
        toast('Delete failed: '+(e.message||e.code||'unknown'),'error');
      }
    });
  });
  _cgListener={ref,cb};
}

window._userProfiles=window._userProfiles||{};
function _cacheProfile(u,data){
  if(!u)return;
  const p=window._userProfiles[u]||{};
  if(data.displayName!==undefined)p.displayName=data.displayName||u;
  if(data.avatarUrl!==undefined)p.avatarUrl=data.avatarUrl||'';
  if(data.customStatus!==undefined)p.customStatus=data.customStatus||'';
  if(data.status!==undefined)p.presenceStatus=data.status||'offline';
  if(data.nameStyle!==undefined)p.nameStyle=data.nameStyle||'solid';
  if(data.nameGradientFrom!==undefined)p.nameGradientFrom=data.nameGradientFrom||'';
  if(data.nameGradientTo!==undefined)p.nameGradientTo=data.nameGradientTo||'';
  if(data.profileAccent!==undefined)p.profileAccent=data.profileAccent||'';
  if(data.profileBannerImg!==undefined)p.profileBannerImg=data.profileBannerImg||'';
  window._userProfiles[u]=p;
  
  window._userAvCache=window._userAvCache||{};
  if(p.avatarUrl)window._userAvCache[u]=p.avatarUrl;
}
function _fetchProfile(u,cb){
  if(!u)return;

  Promise.all([
    db.ref('users/'+u).once('value').catch(()=>null),
    db.ref('presence/'+u).once('value').catch(()=>null)
  ]).then(([uSnap,pSnap])=>{
    const v=(uSnap&&uSnap.val())||{};
    const p=(pSnap&&pSnap.val())||{};
    _cacheProfile(u,{
      displayName:v.displayName||u,
      avatarUrl:v.avatarUrl||'',
      customStatus:v.customStatus||'',
      status:p.status||'offline',
      nameStyle:v.nameStyle||'solid',
      nameGradientFrom:v.nameGradientFrom||'',
      nameGradientTo:v.nameGradientTo||'',
      profileAccent:v.profileAccent||''
    });
    cb&&cb();
  }).catch(()=>{cb&&cb();});

  window._presenceLive=window._presenceLive||{};
  if(!window._presenceLive[u]){
    window._presenceLive[u]=true;
    try{
      db.ref('presence/'+u).on('value',ps=>{
        const v=(ps&&ps.val())||{};
        const cur=window._userProfiles[u]||{};
        cur.presenceStatus=v.status||'offline';
        window._userProfiles[u]=cur;
        
        try{if(typeof renderDmList==='function'&&G.view==='dm')renderDmList();}catch(e){}
        
        try{
          if(G.view==='dm'&&G.dmChannel){
            const dm=dmChannels.find(d=>d.id===G.dmChannel);
            const others=dm?_dmParts(dm).filter(p=>p!==me.username):[];
            if(others[0]===u){
              const sub=document.getElementById('dmHeaderSub');
              if(sub){
                const st=cur.presenceStatus;
                const cs=cur.customStatus||'';
                sub.innerHTML=cs
                  ? `<span class="tb-dot" data-status="${esc(st)}"></span>${esc(cs)}`
                  : `<span class="tb-dot" data-status="${esc(st)}"></span>${esc(stLabel(st))}`;
              }
            }
          }
        }catch(e){}
      });
    }catch(e){}
  }
}

function renderDmList(){
  const el=document.getElementById('dmListBody');
  if(!el)return;
  el.innerHTML='';
  const q=(_dmSearchQ||'').toLowerCase();

  const dms=dmChannels.slice().filter(dm=>{
    if(!q)return true;
    const others=_dmParts(dm).filter(p=>p!==me.username);
    const lbl=dm.isGroup?(dm.name||others.join(', ')):(others[0]||'');
    const dn=((window._userProfiles||{})[lbl]||{}).displayName||'';
    return lbl.toLowerCase().includes(q)||dn.toLowerCase().includes(q);
  }).sort((a,b)=>{

    const aUn=_unreadReady?dmHasUnread(a):false;
    const bUn=_unreadReady?dmHasUnread(b):false;
    if(aUn!==bUn)return aUn?-1:1;
    const ua=_unreadReady?dmUnreadDisplayCount(a):0;
    const ub=_unreadReady?dmUnreadDisplayCount(b):0;
    if(ua!==ub)return ub-ua;
    return (b.lastMsgTs||b.createdAt||0)-(a.lastMsgTs||a.createdAt||0);
  });
  
  if(!dms.length){
    if(!_dmsHydrated&&!q){
      el.innerHTML=Array.from({length:4}).map(()=>`<div style="display:flex;gap:10px;align-items:center;padding:8px 10px;margin-bottom:3px;opacity:.55"><div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(90deg,rgba(179, 136, 255,.07),rgba(255,255,255,.04),rgba(179, 136, 255,.07));background-size:200% 100%;animation:dmSkelShimmer 1.4s linear infinite;flex-shrink:0"></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:10px;border-radius:4px;width:60%;background:linear-gradient(90deg,rgba(179, 136, 255,.07),rgba(255,255,255,.04),rgba(179, 136, 255,.07));background-size:200% 100%;animation:dmSkelShimmer 1.4s linear infinite"></div><div style="height:8px;border-radius:4px;width:40%;background:linear-gradient(90deg,rgba(179, 136, 255,.07),rgba(255,255,255,.04),rgba(179, 136, 255,.07));background-size:200% 100%;animation:dmSkelShimmer 1.4s linear infinite"></div></div></div>`).join('')+'<style>@keyframes dmSkelShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}</style>';
      setTimeout(()=>{if(_dmsHydrated)renderDmList();},400);
      return;
    }
    el.innerHTML=`<div style="text-align:center;padding:30px 10px;color:var(--muted);font-family:var(--mono);font-size:11px">${q?'No matches':'No DMs yet. Use <strong style="color:var(--cyan)">New DM</strong> to start one.'}</div>`;
    return;
  }
  
  const dh=document.createElement('div');
  dh.style.cssText='font-size:9px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:2px;margin:6px 4px';
  dh.textContent='Direct Messages — '+dms.length;
  el.appendChild(dh);
  
  dms.forEach(dm=>{
    try{
      const ps=_dmParts(dm);
      const others=ps.filter(p=>p!==me.username);
      const otherUser=others[0]||'Unknown';
      const prof=(window._userProfiles||{})[otherUser]||{};
      const displayName=dm.isGroup
        ?(dm.name||others.slice(0,3).map(u=>(window._userProfiles?.[u]||{}).displayName||u).join(', ')+(others.length>3?' +'+(others.length-3):''))
        :(prof.displayName||otherUser);
      const status=prof.customStatus||'';
      const lastObj=_dmLastMsgs[dm.id];
      const preview=(typeof lastObj==='object'&&lastObj?lastObj.text:lastObj)||'';
      const lastBy=(typeof lastObj==='object'&&lastObj?lastObj.username:'')||'';

      const un=_unreadReady?dmUnreadDisplayCount(dm):0;
      const hasPing=_unreadReady?(dmHasPing(dm)?1:0):0;
      const row=document.createElement('div');
      row.className='ch-row'+(G.dmChannel===dm.id?' on':'')+(un?' dm-unread':'')+(hasPing?' dm-pinged':'');
      row.style.cssText='margin-bottom:3px;align-items:center;padding:8px 10px;position:relative';
      const avIcon=dm.isGroup
        ?`<div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--purple));display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px"><i class="fa-solid fa-user-group"></i></div>`
        :avHtml(otherUser,prof.avatarUrl||'',34);
      const badge=un?`<div class="dm-av-dot ${hasPing?'is-ping':'is-unread'}">${un>99?'99+':un}</div>`:'';
      const lastByLabel=lastBy?(lastBy===me.username?'You':((window._userProfiles?.[lastBy]||{}).displayName||lastBy)):'';
      const previewLine=preview
        ? `<div class="ch-sub" style="font-size:11px;color:${un?'#fff':'var(--muted)'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:${un?'700':'400'}">${lastByLabel?`<span style="color:${un?'#fff':'var(--cyan)'}">${esc(lastByLabel)}:</span> `:''}${esc(String(preview).slice(0,60))}</div>`
        : (status?`<div class="ch-sub" style="font-size:11px;color:var(--muted);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">💬 ${esc(status.slice(0,50))}</div>`
          :(dm.isGroup?`<div class="ch-sub" style="font-size:10px;color:var(--muted);font-family:var(--mono)">${ps.length} members</div>`:''));
      row.innerHTML=`<div class="dm-av-wrap" style="width:34px;height:34px;flex-shrink:0;position:relative">${avIcon}${badge}</div>
        <div style="flex:1;overflow:hidden;min-width:0">
          <div class="ch-nm" style="font-weight:${un?'800':'600'};display:flex;align-items:center;gap:4px;${un?'color:#fff':''}">${dm.isGroup?'<i class="fa-solid fa-user-group" style="font-size:9px;color:var(--muted)"></i> ':''}${esc(displayName)}</div>
          ${previewLine}
        </div>`;
      row.oncontextmenu=e=>{
        e.preventDefault();
        const items=[{label:'Open',icon:'fa-comment',fn:()=>openDM(dm.id)}];
        if(un)items.push({label:'Mark as Read',icon:'fa-check',fn:()=>markDmRead(dm.id,Date.now())});
        if(!dm.isGroup)items.push({label:'View Profile',icon:'fa-user',fn:()=>showProfile(otherUser)});
        if(dm.isGroup)items.push({label:'Leave Group',icon:'fa-right-from-bracket',danger:true,fn:async()=>{
          const remaining=ps.filter(p=>p!==me.username);
          if(!remaining.length){await db.ref('dmChannels/'+dm.id).remove();await db.ref('dmMessages/'+dm.id).remove();}
          else await db.ref('dmChannels/'+dm.id+'/participants').set(remaining);
          // Drop the index entry too
          await db.ref('userDms/'+me.username+'/'+dm.id).remove().catch(()=>{});
          toast('Left group','info');
        }});
        items.push({label:dm.isGroup?'Hide':'Close DM',icon:'fa-xmark',danger:true,fn:async()=>{
          // Remove only my index entry — keep the channel for the other side.
          await db.ref('userDms/'+me.username+'/'+dm.id).remove().catch(()=>{});
          dmChannels=dmChannels.filter(d=>d.id!==dm.id);
          renderDmList();
          if(G.dmChannel===dm.id){G.dmChannel='';renderDmHome('home');}
        }});
        showCtxItems(e.clientX,e.clientY,items);
      };
      row.onclick=()=>openDM(dm.id);
      el.appendChild(row);
      // Lazy profile fetch — guard against re-fetch storms
      if(!dm.isGroup&&otherUser&&otherUser!=='Unknown'){
        const cached=window._userProfiles&&window._userProfiles[otherUser];
        if(!cached||!cached.displayName){
          // Sentinel object so we don't re-fire the fetch on every render
          if(!cached)window._userProfiles[otherUser]={};
          _fetchProfile(otherUser,()=>{try{renderDmList();}catch(e){}});
        }
      }
      
      if(_dmLastMsgs[dm.id]===undefined){
        _dmLastMsgs[dm.id]=null;
        db.ref('dmMessages/'+dm.id).limitToLast(1).once('value').then(s=>{
          s.forEach(c=>{const v=c.val()||{};_dmLastMsgs[dm.id]={text:v.text||(v.attachmentUrl?'📎 Attachment':''),username:v.username||'',ts:v.ts||0};});
          try{renderDmList();}catch(e){}
        }).catch(()=>{});
      }
    }catch(err){
      
      console.warn('[dm] row render failed for',dm&&dm.id,err);
    }
  });
}

// Drill-in modal for one suggestion — shows full details and the chat
// thread between the suggester and the owner. Owner can approve/reject.
async function showSuggestionDetail(sugId){
  const isOwner=me.username===OWNER;
  let s={};
  try{const r=await db.ref('userSuggestions/'+sugId).once('value');s={id:sugId,...(r.val()||{})};}catch(e){}
  if(!s.by){toast('Suggestion not found','error');return;}
  // Permission: only the suggester and the owner can see/chat
  if(!isOwner&&s.by!==me.username){toast('Not your suggestion','error');return;}
  const _back=()=>{closeModal();showSuggestionsList();};
  const statusLabel={pending:'⏳ Pending review',approved:'✅ Approved',rejected:'❌ Rejected'}[s.status||'pending'];
  const statusColor={pending:'#fbbf24',approved:'#23d160',rejected:'#ef4444'}[s.status||'pending'];
  openModal({wide:true,html:`
    <div class="modal-title"><i class="fa-solid fa-user-plus" style="color:var(--cyan)"></i> Suggestion: ${esc(s.candidateName||'')}</div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:4px">
      <div style="width:28px;height:28px">${avHtml(s.by,s.byAvatar||'',28)}</div>
      <div style="font-size:12px"><strong>${esc(s.byDisplay||s.by)}</strong> <span style="color:var(--muted);font-family:var(--mono);font-size:10px">submitted ${fmtTimeFull(s.ts||0)}</span></div>
      <div style="margin-left:auto;color:${statusColor};font-weight:700;font-size:12px">${statusLabel}</div>
    </div>
    ${(s.candidateContact||s.reason)?`<div style="margin-top:14px;padding:12px;background:rgba(0,0,0,.3);border:1px solid rgba(179, 136, 255,.12);border-radius:10px">
      ${s.candidateContact?`<div style="font-size:10px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px">Contact</div>
      <div style="font-size:13px;color:#cdd0e0">${esc(s.candidateContact)}</div>`:''}
      ${s.reason?`<div style="font-size:10px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:1.5px;margin:${s.candidateContact?'10px':'0'} 0 4px">Note</div>
      <div style="font-size:13px;color:#cdd0e0;white-space:pre-wrap;line-height:1.5">${fmtText(s.reason)}</div>`:''}
    </div>`:''}
    ${isOwner&&s.status==='pending'?`<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn-sub" data-sugaction="approved" style="padding:8px 16px;font-size:12px;background:#23d160;color:#04030a"><i class="fa-solid fa-check"></i> Approve</button>
      <button class="btn-danger" data-sugaction="rejected" style="padding:8px 16px;font-size:12px"><i class="fa-solid fa-xmark"></i> Reject</button>
    </div>`:''}
    <label class="modal-label" style="margin-top:18px">Discussion</label>
    <div id="sugChatBox" style="display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;padding:8px;background:rgba(0,0,0,.25);border-radius:8px;border:1px solid rgba(255,255,255,.05);min-height:100px"></div>
    <div style="display:flex;gap:6px;margin-top:8px">
      <input class="modal-inp" id="sugChatInp" placeholder="Message ${isOwner?esc(s.byDisplay||s.by):'the owner'}..." maxlength="500" style="margin:0;flex:1"/>
      <button class="btn-sub" id="sugChatSend" style="padding:8px 14px;font-size:11px"><i class="fa-solid fa-paper-plane"></i></button>
    </div>`,
    footer:[{label:'Back',cls:'btn-ghost',fn:_back}]
  });
  // Wire approve/reject (owner only)
  document.querySelectorAll('[data-sugaction]').forEach(b=>b.onclick=async()=>{
    const action=b.dataset.sugaction;
    try{
      await db.ref('userSuggestions/'+sugId).update({status:action,decidedBy:me.username,decidedAt:Date.now()});
      // Notify the suggester
      try{await db.ref('notifications/'+s.by).push({type:'user-suggestion-update',sugId,status:action,ts:Date.now(),text:`Your suggestion for ${s.candidateName} was ${action}.`});}catch(e){}
      // Post a system message in the discussion thread
      try{await db.ref('userSuggestions/'+sugId+'/messages').push({by:'__system',text:`Status changed to ${action} by ${me.displayName||me.username}`,ts:Date.now()});}catch(e){}
      toast('Marked '+action,'success');
      closeModal();showSuggestionDetail(sugId);
    }catch(e){toast('Update failed: '+(e.message||'unknown'),'error');}
  });
  // Chat: render + live listen
  const chatBox=document.getElementById('sugChatBox');
  const renderChat=msgs=>{
    if(!chatBox)return;
    const arr=Object.entries(msgs||{}).map(([k,v])=>({k,...v})).sort((a,b)=>(a.ts||0)-(b.ts||0));
    if(!arr.length){chatBox.innerHTML='<div style="padding:14px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:11px">No messages yet — say hi.</div>';return;}
    chatBox.innerHTML=arr.map(m=>{
      if(m.by==='__system'){
        return `<div style="text-align:center;color:var(--muted);font-family:var(--mono);font-size:10px;padding:4px 0">— ${esc(m.text)} —</div>`;
      }
      const mine=m.by===me.username;
      const dn=mine?(me.displayName||me.username):(m.by===OWNER?'Owner':(s.byDisplay||s.by));
      return `<div style="display:flex;${mine?'justify-content:flex-end':''}">
        <div style="max-width:75%;padding:6px 10px;background:${mine?'rgba(179, 136, 255,.12)':'rgba(255,255,255,.05)'};border-radius:10px;${mine?'border-top-right-radius:2px':'border-top-left-radius:2px'}">
          <div style="font-size:10px;color:var(--muted);font-family:var(--mono);margin-bottom:2px">${esc(dn)} · ${fmtTime(m.ts||0)}</div>
          <div style="font-size:12.5px;color:#fff;white-space:pre-wrap;line-height:1.4">${fmtText(m.text||'')}</div>
        </div>
      </div>`;
    }).join('');
    chatBox.scrollTop=chatBox.scrollHeight;
  };
  const msgsRef=db.ref('userSuggestions/'+sugId+'/messages');
  try{const ms=await msgsRef.once('value');renderChat(ms.val());}catch(e){}
  const cb=msgsRef.on('value',sn=>renderChat(sn.val()));
  // Tear down listener when modal closes (via the global modalBg observer
  // — track manually since we don't have a "modal-close" event)
  window._sugChatTeardown=()=>{try{msgsRef.off('value',cb);}catch(e){}};
  // Send handler
  const sendChat=async()=>{
    const inp=document.getElementById('sugChatInp');
    const txt=(inp.value||'').trim().slice(0,500);
    if(!txt)return;
    inp.value='';
    try{
      await msgsRef.push({by:me.username,text:txt,ts:Date.now()});
      // Notify the OTHER party
      const target=me.username===s.by?OWNER:s.by;
      if(target&&target!==me.username){
        try{await db.ref('notifications/'+target).push({type:'user-suggestion-msg',sugId,from:me.username,fromDisplay:me.displayName||me.username,ts:Date.now(),text:`New message about ${s.candidateName}: ${txt.slice(0,80)}`});}catch(e){}
      }
    }catch(e){toast('Send failed: '+(e.message||'unknown'),'error');inp.value=txt;}
  };
  document.getElementById('sugChatSend').onclick=sendChat;
  document.getElementById('sugChatInp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}});
}

// Live-update the suggestion badge in the DM topbar.
// For the owner: pending count.
// For others: number of their own suggestions with status != pending OR
//             with messages from someone else they haven't seen.
function _installSuggestionBadgeWatcher(){
  if(window._sugBadgeBound)return;
  window._sugBadgeBound=true;
  const ref=db.ref('userSuggestions');
  ref.on('value',snap=>{
    const v=snap.val()||{};
    const badge=document.getElementById('sugMineBadge');
    if(!badge)return;
    let count=0;
    if(me.username===OWNER){
      Object.values(v).forEach(s=>{if((s.status||'pending')==='pending')count++;});
    }else{
      Object.values(v).forEach(s=>{
        if(s.by!==me.username)return;
        if(s.status&&s.status!=='pending')count++;
        // Count owner messages as activity
        if(s.messages){
          const ms=Object.values(s.messages);
          if(ms.some(m=>m.by&&m.by!==me.username&&m.by!=='__system'))count++;
        }
      });
    }
    if(count>0){badge.style.display='inline-block';badge.textContent=count>99?'99+':String(count);}
    else{badge.style.display='none';badge.textContent='0';}
  });
}

function showNewDM(){
  const picked=new Set();
  const render=()=>{

    if(pill)pill.innerHTML=[...picked].map(u=>`<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:rgba(179, 136, 255,.12);border:1px solid rgba(179, 136, 255,.3);border-radius:999px;font-size:11px;font-family:var(--mono);margin:2px">${esc(u)} <button data-rm="${eattr(u)}" style="border:none;background:none;color:var(--rose);cursor:pointer;font-size:10px">✕</button></span>`).join('');

  };
  const friendsList=(me.friends||[]).slice().sort();
  openModal({wide:true,html:`<div class="modal-title">New Message</div><div class="modal-sub" id="ndmHint">Pick one or more people for a DM — add multiple for a group.</div>

      <span style="font-size:10px;color:var(--muted);font-family:var(--mono)">Press Enter to add. Multiple people = group DM.</span>
    </div>
    ${friendsList.length?`<label class="modal-label">Your Friends</label><div id="ndmFriends" style="display:flex;flex-wrap:wrap;gap:6px;max-height:160px;overflow-y:auto">${friendsList.map(f=>`<button class="btn-ghost" data-frpick="${eattr(f)}" style="padding:4px 12px;font-size:11px;display:inline-flex;align-items:center;gap:6px"><div style="width:20px;height:20px">${avHtml(f,'',20)}</div>${esc(f)}</button>`).join('')}</div>`:''}
    `,
    footer:[
      {label:'Create DM',cls:'btn-sub',fn:async()=>{
        if(!picked.size){toast('Pick at least one person','error');return;}
        const users=[...picked];
        // Validate every user exists before any write
        for(const u of users){
          const s=await db.ref('users/'+u).once('value');
          if(!s.exists()){toast(u+' not found','error');return;}
        }
        let dmId;
        const updates={};
        if(users.length===1){

          dmId='dm-'+[me.username,users[0]].slice().sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase())).join('-');
          const sn=await db.ref('dmChannels/'+dmId).once('value');
          if(!sn.exists()){updates['dmChannels/'+dmId]={participants:[me.username,users[0]],createdAt:Date.now(),lastMsgTs:Date.now()};}
          
          updates['userDms/'+me.username+'/'+dmId]=true;
          updates['userDms/'+users[0]+'/'+dmId]=true;
        }else{
          dmId='gdm-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
          const name=users.slice(0,3).join(', ')+(users.length>3?' +'+(users.length-3):'');
          updates['dmChannels/'+dmId]={participants:[me.username,...users],createdAt:Date.now(),lastMsgTs:Date.now(),isGroup:true,name,owner:me.username};
          updates['userDms/'+me.username+'/'+dmId]=true;
          users.forEach(u=>{updates['userDms/'+u+'/'+dmId]=true;});
        }
        try{
          await db.ref().update(updates);
        }catch(e){
          console.error('[dm] create failed',e);
          toast('Could not create DM: '+(e.message||e.code||'error'),'error');
          return;
        }
        closeModal();
        await loadDmChannels();

        if(G.view!=='dm'||!document.getElementById('dmListBody')){
          showDMScreen();
        }else{
          renderDmList();
        }
        try{_bindDmListener(dmId);}catch(e){}
        openDM(dmId);
      }},

    inp?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add();}});
    document.querySelectorAll('[data-frpick]').forEach(b=>b.onclick=()=>{picked.add(b.dataset.frpick);render();});
    render();
  },80);
}

async function openDM(dmId){

  let dm=dmChannels.find(d=>d.id===dmId);

    try{
      const s=await db.ref('dmChannels/'+dmId).once('value');
      if(s.exists()){
        dm={id:dmId,...s.val()};
        dmChannels=dmChannels.filter(d=>d.id!==dmId);
        dmChannels.push(dm);

      try{listeners[k].ref.off(listeners[k].event,listeners[k].cb);}catch(e){}
      delete listeners[k];
    }
  }
  content.innerHTML=`
    <div class="topbar">
      <div style="width:32px;height:32px">${headAv}</div>
      <div style="display:flex;flex-direction:column;min-width:0;flex:1">
        <span class="tb-name">${esc(headName)}</span>
        <span class="tb-sub" id="dmHeaderSub">${isGroup?`${allParts.length} members`:'\u2022 \u2022 \u2022'}</span>
      </div>
      <div class="tb-actions">
        ${isGroup?'<button class="tb-btn" id="dmMembersBtn" title="Members"><i class="fa-solid fa-users"></i></button><button class="tb-btn" id="dmAddBtn" title="Add People"><i class="fa-solid fa-user-plus"></i></button>':'<button class="tb-btn" id="dmProfileBtn" title="Profile"><i class="fa-solid fa-user"></i></button>'}
      </div>
    </div>
    <div class="msgs" id="dmMsgs"></div>
    <div class="reply-strip" id="replyStrip">
      <div class="rs-line">
        <span style="color:var(--muted)">Replying to</span>
        <span class="rs-name" id="rsName"></span>
        <span class="rs-txt" id="rsTxt"></span>
      </div>
      <button class="rs-close" id="replyCloseBtn"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="input-zone">
      <div id="filePreview"></div>
      <div class="input-box">
        <button class="inp-side" id="dmAttachBtn" title="Attach"><i class="fa-solid fa-circle-plus"></i></button>
        <input type="file" id="dmFileInput" style="display:none" accept="image/*,video/*,audio/*,.pdf,.txt,.zip"/>
        <textarea class="msg-input" id="dmInput" rows="1" placeholder="${esc(placeholder)}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
        <div class="inp-actions">
          <button class="inp-btn" id="dmGifBtn" title="GIF" style="font-family:var(--mono);font-size:11px;font-weight:700">GIF</button>
          <button class="inp-btn" id="dmEmojiBtn"><i class="fa-regular fa-face-smile"></i></button>
          <div class="emoji-panel" id="emojiPanel">
            <input class="ep-search" id="epSearch" placeholder="Search emoji…"/>
            <div class="ep-cat">All Emojis</div>
            <div class="ep-grid" id="epGrid"></div>
          </div>
        </div>
      </div>
    </div>`;
  if(isGroup){
    document.getElementById('dmMembersBtn').onclick=()=>showGroupMembers(dm);
    document.getElementById('dmAddBtn').onclick=()=>showGroupAdd(dm);
  }else{
    document.getElementById('dmProfileBtn').onclick=()=>showProfile(others[0]);
    
    const other=others[0];
    if(other){
      _fetchProfile(other,()=>{
        if(G.dmChannel!==dmId)return;
        const p=window._userProfiles[other]||{};
        const sub=document.getElementById('dmHeaderSub');
        if(sub){
          const st=p.presenceStatus||'offline';
          const cs=p.customStatus||'';
          sub.innerHTML=cs
            ? `<span class="tb-dot" data-status="${esc(st)}"></span>${esc(cs)}`
            : `<span class="tb-dot" data-status="${esc(st)}"></span>${esc(stLabel(st))}`;
        }
        const tn=document.querySelector('#dmContent .tb-name');
        if(tn&&p.displayName)tn.textContent=p.displayName;
        
        const tbar=document.querySelector('#dmContent .topbar');
        const avSlot=tbar?tbar.querySelector(':scope > div:first-child'):null;
        if(avSlot)avSlot.innerHTML=avHtml(other,p.avatarUrl||'',32);
        
        try{renderDmList();}catch(e){}
      });
    }
  }
  const dmInp=document.getElementById('dmInput');
  dmInp.addEventListener('input',()=>{grow(dmInp);updateMentionBox(dmInp);});
  dmInp.addEventListener('keydown',e=>{
    if(_mentionState.open){
      if(e.key==='ArrowDown'){e.preventDefault();_mentionState.idx=(_mentionState.idx+1)%_mentionState.items.length;_renderMentionBox();return;}
      if(e.key==='ArrowUp'){e.preventDefault();_mentionState.idx=(_mentionState.idx-1+_mentionState.items.length)%_mentionState.items.length;_renderMentionBox();return;}
      if(e.key==='Tab'||e.key==='Enter'){e.preventDefault();_applyMentionPick(dmInp);return;}
      if(e.key==='Escape'){e.preventDefault();_closeMentionBox();return;}
    }
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendDM();}
  });
  dmInp.addEventListener('click',()=>updateMentionBox(dmInp));
  dmInp.addEventListener('blur',()=>setTimeout(_closeMentionBox,180));
  dmInp.addEventListener('paste',handlePasteImage);
  dmInp.addEventListener('contextmenu',e=>showFormatCtx(e,dmInp));
  document.getElementById('dmEmojiBtn').onclick=()=>document.getElementById('emojiPanel').classList.toggle('on');
  document.getElementById('dmAttachBtn')?.addEventListener('click',()=>document.getElementById('dmFileInput')?.click());
  document.getElementById('dmFileInput')?.addEventListener('change',e=>handleFile(e.target));
  document.getElementById('dmGifBtn')?.addEventListener('click',()=>showGifPicker('dm'));

  document.getElementById('replyCloseBtn')?.addEventListener('click',cancelReply);
  
  G.reply=null;
  document.getElementById('replyStrip')?.classList.remove('on');
  buildEmojiGrid(ALL_EMOJIS,'dmInput');
  renderDmList();

  window._dmMsgs=new Map();
  window._dmActiveId=dmId;
  const _renderDmFeed=()=>{
    if(window._dmActiveId!==dmId)return;
    const feed=document.getElementById('dmMsgs');if(!feed)return;
    feed.innerHTML='';
    _dmLastMsg={uid:'',ts:0};
    const arr=Array.from(window._dmMsgs.values()).sort((a,b)=>(a.ts||0)-(b.ts||0));
    arr.forEach(m=>pushDmMsg(m));
    feed.scrollTop=feed.scrollHeight;
  };

  try{
    const seed=await db.ref('dmMessages/'+dmId).limitToLast(500).once('value');
    if(window._dmActiveId!==dmId)return; 
    seed.forEach(c=>{window._dmMsgs.set(c.key,{key:c.key,...c.val()});});
    _renderDmFeed();
  }catch(e){console.warn('[dm] seed fetch failed',e);}

  const liveRef=db.ref('dmMessages/'+dmId);
  const addedCb=liveRef.on('child_added',s=>{

    if(window._dmMsgs.has(s.key))return;
    const m={key:s.key,...s.val()};
    window._dmMsgs.set(s.key,m);
    if(window._dmActiveId!==dmId)return;
    pushDmMsg(m);
    const feed=document.getElementById('dmMsgs');
    if(feed)feed.scrollTop=feed.scrollHeight;
    if(m.username&&m.username!==me.username){
      markDmRead(dmId,m.ts||Date.now());
    }
  });
  listeners['dm_view_'+dmId]={ref:liveRef,event:'child_added',cb:addedCb};
  const changedCb=liveRef.on('child_changed',s=>{
    if(window._dmActiveId!==dmId)return;
    const m={key:s.key,...s.val()};
    window._dmMsgs.set(s.key,m);
    _patchDmMsgRow(m);
  });
  listeners['dm_view_changed_'+dmId]={ref:liveRef,event:'child_changed',cb:changedCb};
  const removedCb=liveRef.on('child_removed',s=>{

    window._dmMsgs.delete(s.key);
    document.getElementById('dm-m-'+s.key)?.remove();
  });
  listeners['dm_view_removed_'+dmId]={ref:liveRef,event:'child_removed',cb:removedCb};

  if(window._dmReconcileTimer){clearInterval(window._dmReconcileTimer);}
  window._dmReconcileTimer=setInterval(async()=>{
    if(window._dmActiveId!==dmId){clearInterval(window._dmReconcileTimer);return;}
    try{

      const snap=await db.ref('dmMessages/'+dmId).limitToLast(100).once('value');
      const missing=[];
      snap.forEach(c=>{
        const key=c.key;
        const inMap=window._dmMsgs.has(key);
        const inDom=!!document.getElementById('dm-m-'+key);

        if(!inMap||!inDom){missing.push({key,...c.val(),_needsRender:!inDom});}
      });
      if(missing.length){
        console.log('[dm] reconcile: rescuing',missing.length,'dropped messages');
        missing.sort((a,b)=>(a.ts||0)-(b.ts||0));
        missing.forEach(m=>{
          if(window._dmMsgs.has(m.key)&&document.getElementById('dm-m-'+m.key))return;
          window._dmMsgs.set(m.key,m);
          pushDmMsg(m);
        });
        const feed=document.getElementById('dmMsgs');
        if(feed)feed.scrollTop=feed.scrollHeight;
      }
    }catch(e){console.warn('[dm] reconcile failed',e);}
  },8000);
}

function _patchDmMsgRow(m){
  const row=document.getElementById('dm-m-'+m.key);if(!row)return;
  const body=row.querySelector('.msg-body');if(!body)return;
  const reactions=m.reactions?Object.entries(m.reactions).map(([emojiKey,users])=>{
    const cnt=Object.keys(users||{}).length;if(!cnt)return'';
    let emoji=emojiKey;try{emoji=decodeURIComponent(emojiKey);}catch(e){}
    const reacted=users[me.username];
    const who=Object.keys(users).join(', ');
    return`<button class="rxn-pill${reacted?' on':''}" data-rxnkey="${eattr(m.key)}" data-rxnemoji="${eattr(emoji)}" title="${esc(who)}"><span class="rxn-emoji">${esc(emoji)}</span><span class="rxn-count">${cnt}</span></button>`;
  }).join(''):'';
  const existing=body.querySelector('.rxn-row');
  if(existing){if(reactions){existing.innerHTML=reactions;}else{existing.remove();}}
  else if(reactions){
    const div=document.createElement('div');
    div.className='rxn-row';
    div.innerHTML=reactions;
    body.appendChild(div);
  }
  
  const txt=body.querySelector('.msg-txt');
  if(txt)txt.innerHTML=fmtText(m.text)+(m.edited?'<span class="msg-edited">(edited)</span>':'');
}

function showGroupMembers(dm){
  const parts=_dmParts(dm);
  openModal({html:`<div class="modal-title">${esc(dm.name||'Group')}</div><div class="modal-sub">${parts.length} members</div>
    <div style="display:flex;flex-direction:column;gap:4px;max-height:360px;overflow-y:auto">
      ${parts.map(p=>`<div class="ch-row" data-gmp="${eattr(p)}" style="padding:8px"><div style="width:30px;height:30px">${avHtml(p,'',30)}</div><div style="flex:1;font-weight:600">${esc(p)}</div>${p===dm.owner?'<span class="role-pill" style="background:rgba(251,191,36,.16);color:#fbbf24;border:1px solid rgba(251,191,36,.3)">Owner</span>':''}${(me.username===dm.owner&&p!==me.username)?`<button class="btn-ghost" data-gmkick="${eattr(p)}" style="padding:4px 10px;font-size:10px">Kick</button>`:''}</div>`).join('')}
    </div>`,
    footer:[{label:'Close',cls:'btn-ghost',fn:closeModal}]
  });
  setTimeout(()=>{
    document.querySelectorAll('[data-gmp]').forEach(r=>r.onclick=e=>{if(e.target.closest('[data-gmkick]'))return;showProfile(r.dataset.gmp);});
    document.querySelectorAll('[data-gmkick]').forEach(b=>b.onclick=async e=>{
      e.stopPropagation();
      const u=b.dataset.gmkick;
      const remaining=_dmParts(dm).filter(p=>p!==u);
      await db.ref('dmChannels/'+dm.id+'/participants').set(remaining);
      // Also remove their userDms index so their rail updates
      await db.ref('userDms/'+u+'/'+dm.id).remove().catch(()=>{});
      toast('Removed '+u,'info');closeModal();await loadDmChannels();renderDmList();
    });
  },80);
}

function showGroupAdd(dm){
  const existing=_dmParts(dm);
  const friendsList=(me.friends||[]).filter(f=>!existing.includes(f));
  openModal({html:`<div class="modal-title">Add People to ${esc(dm.name||'Group')}</div><div class="modal-sub">Pick friends to add.</div>
    ${friendsList.length?`<div style="display:flex;flex-direction:column;gap:4px;max-height:300px;overflow-y:auto">${friendsList.map(f=>`<div class="ch-row" data-gadd="${eattr(f)}" style="padding:8px;cursor:pointer"><div style="width:30px;height:30px">${avHtml(f,'',30)}</div><div style="flex:1;font-weight:600">${esc(f)}</div><i class="fa-solid fa-plus" style="color:var(--cyan)"></i></div>`).join('')}</div>`:'<div style="padding:24px;text-align:center;color:var(--muted)">No friends to add.</div>'}
    <label class="modal-label">Or add by username</label><input class="modal-inp" id="gaddUser" placeholder="username"/>`,
    footer:[{label:'Add by Username',cls:'btn-sub',fn:async()=>{
      const u=document.getElementById('gaddUser').value.trim();if(!u)return;
      const s=await db.ref('users/'+u).once('value');
      if(!s.exists()){toast('User not found','error');return;}
      const parts=[..._dmParts(dm),u];
      await db.ref().update({
        ['dmChannels/'+dm.id+'/participants']:parts,
        ['userDms/'+u+'/'+dm.id]:true
      });
      toast('Added '+u,'success');closeModal();await loadDmChannels();openDM(dm.id);
    }},{label:'Cancel',cls:'btn-ghost',fn:closeModal}]

      await db.ref('dmChannels/'+dm.id+'/participants').set(parts);
      toast('Added '+u,'success');closeModal();await loadDmChannels();openDM(dm.id);
    });
  },80);
}

let _dmLastMsg={uid:'',ts:0};
function pushDmMsg(m){
  const feed=document.getElementById('dmMsgs');if(!feed)return;
  if(m.key&&document.getElementById('dm-m-'+m.key))return;
  const sameAuthor=(m.username||m.uid)===_dmLastMsg.uid&&(m.ts-_dmLastMsg.ts)<420000&&!m.forwarded&&!m.replyTo;
  const row=document.createElement('div');
  row.className='msg-row'+(sameAuthor?'':' head')+' fade-in';
  row.id='dm-m-'+m.key;
  // DMs don't have a server context, so roleColorFor falls back to hue().
  // Still using the helper so future cross-server color logic is one-stop.
  const col=roleColorFor(m.username||'?');
  const mine=m.username===me.username;
  // Always prefer the LIVE profile (cached) over the snapshot baked into the message.
  // That way if a user updates their avatar/display name, old DMs reflect it.
  const _liveProf=(window._userProfiles&&window._userProfiles[m.username])||{};
  const _liveAv=mine?(me.avatarUrl||''):(_liveProf.avatarUrl||m.avatarUrl||'');
  const _liveDN=mine?(me.displayName||me.username):(_liveProf.displayName||m.displayName||m.username);
  // Lazy-load profile so subsequent renders pick up the avatar
  if(!mine&&!window._userProfiles[m.username])_fetchProfile(m.username);
  const fwdHtml=m.forwarded?`<div style="font-size:10px;color:var(--muted);font-family:var(--mono);margin-bottom:4px;display:flex;align-items:center;gap:6px"><i class="fa-solid fa-share" style="color:var(--purple)"></i>Forwarded from <strong style="color:${hue(m.forwarded.from||'?')}">${esc(m.forwarded.from||'?')}</strong></div>`:'';
  // Reply preview — render a quoted line above the body when replyTo is set.
  const replyHtml=m.replyTo?`<div class="msg-reply-quote" data-jump="${eattr(m.replyTo.msgId||'')}" style="font-size:11px;color:var(--muted);margin-bottom:4px;display:flex;align-items:center;gap:6px;cursor:pointer;border-left:2px solid ${hue(m.replyTo.username||'?')};padding:2px 8px;border-radius:0 6px 6px 0;background:rgba(255,255,255,.03)"><i class="fa-solid fa-reply" style="font-size:9px;color:${hue(m.replyTo.username||'?')}"></i><strong style="color:${hue(m.replyTo.username||'?')}">${esc(m.replyTo.username||'?')}</strong><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:340px">${esc((m.replyTo.text||'').slice(0,80))}</span></div>`:'';

  const _safeAtt=_safeHref(m.attachmentUrl);
  const attachHtml=m.attachmentUrl?`<div class="msg-attach">${m.attachmentType==='image'?`<img src="${esc(_safeImgUrl(m.attachmentUrl)||'')}" data-imgview="${eattr(_safeImgUrl(m.attachmentUrl)||'')}" alt="img" style="cursor:zoom-in"/>`:`<a class="file-attach" href="${esc(_safeAtt)}" target="_blank" rel="noopener noreferrer" download="${esc(m.attachmentName||'file')}"><i class="fa-solid fa-file"></i>${esc(m.attachmentName||'File')}</a>`}</div>`:'';
  const reactions=m.reactions?Object.entries(m.reactions).map(([emojiKey,users])=>{
    const cnt=Object.keys(users||{}).length;if(!cnt)return'';
    let emoji=emojiKey;try{emoji=decodeURIComponent(emojiKey);}catch(e){}
    const reacted=users[me.username];
    return`<button class="rxn-pill${reacted?' on':''}" data-rxnkey="${eattr(m.key)}" data-rxnemoji="${eattr(emoji)}" title="${esc(Object.keys(users).join(', '))}"><span class="rxn-emoji">${esc(emoji)}</span><span class="rxn-count">${cnt}</span></button>`;
  }).join(''):'';
  const actHtml=`<div class="msg-actions">
    <button class="act-btn" data-dmact="reply" data-key="${eattr(m.key)}" data-user="${eattr(m.username)}" data-txt="${eattr((m.text||'').slice(0,80))}" title="Reply"><i class="fa-solid fa-reply"></i></button>
    <button class="act-btn" data-dmact="react" data-key="${eattr(m.key)}" title="React"><i class="fa-regular fa-face-smile"></i></button>
    ${mine?`<button class="act-btn del" data-dmact="delete" data-key="${eattr(m.key)}" title="Delete"><i class="fa-solid fa-trash-can"></i></button>`:''}
  </div>`;
  if(sameAuthor){
    row.innerHTML=`<div class="msg-av-col" style="justify-content:center"><span class="hover-ts">${fmtTime(m.ts)}</span></div>
      <div class="msg-body">${fwdHtml}${replyHtml}<div class="msg-txt">${fmtText(m.text)}${m.edited?'<span class="edited-tag"> (edited)</span>':''}</div>${attachHtml}${reactions?`<div class="rxn-row">${reactions}</div>`:''}</div>${actHtml}`;
  }else{
    row.innerHTML=`<div class="msg-av-col"><div class="msg-av" data-profile="${eattr(m.username)}">${avHtml(m.username,_liveAv,36)}</div></div>
      <div class="msg-body">${fwdHtml}${replyHtml}<div class="msg-meta"><span class="msg-author" style="color:${col}" data-profile="${eattr(m.username)}">${styledName(m.username,_liveDN,col)}</span><span class="msg-ts">${fmtTimeFull(m.ts)}</span></div>
      <div class="msg-txt">${fmtText(m.text)}${m.edited?'<span class="edited-tag"> (edited)</span>':''}</div>${attachHtml}${reactions?`<div class="rxn-row">${reactions}</div>`:''}</div>${actHtml}`;
  }
  row.addEventListener('click',e=>{
    const t=e.target.closest('[data-dmact]');
    if(t){
      const a=t.dataset.dmact;
      if(a==='reply')setReply(t.dataset.key,t.dataset.user,t.dataset.txt);
      if(a==='react')showReactPickerDm(t.dataset.key);
      if(a==='delete'){if(confirm('Delete this message?'))db.ref('dmMessages/'+G.dmChannel+'/'+t.dataset.key).remove();}
      return;
    }
    const rb=e.target.closest('[data-rxnkey][data-rxnemoji]');
    if(rb){toggleReactionDm(rb.dataset.rxnkey,rb.dataset.rxnemoji);return;}
    // Click on quoted reply → scroll to that message if it's still in the feed
    const jq=e.target.closest('[data-jump]');
    if(jq){
      const target=document.getElementById('dm-m-'+jq.dataset.jump);
      if(target){target.scrollIntoView({behavior:'smooth',block:'center'});target.classList.add('msg-flash');setTimeout(()=>target.classList.remove('msg-flash'),1400);}
      return;
    }
    const p=e.target.closest('[data-profile]');
    if(p)showProfile(p.dataset.profile);
  });

  row.addEventListener('contextmenu',e=>{
    e.preventDefault();
    const items=[
      {label:'Reply',icon:'fa-reply',fn:()=>setReply(m.key,m.username,(m.text||'').slice(0,80))},
      {label:'React',icon:'fa-face-smile-beam',fn:()=>showReactPickerDm(m.key)},
      {label:'Copy Text',icon:'fa-copy',fn:()=>{try{navigator.clipboard.writeText(m.text||'');toast('Copied','success');}catch(_){}}},
      {label:'Forward',icon:'fa-share',fn:()=>showForwardPicker({...m,key:m.key,_dm:true})},
      {label:'View Profile',icon:'fa-user',fn:()=>showProfile(m.username)}
    ];
    if(mine){
      items.push({label:'Edit',icon:'fa-pen',fn:()=>editDmMsg(m.key,m.text||'')});
      items.push({sep:true});
      items.push({label:'Delete',icon:'fa-trash-can',danger:true,fn:()=>{if(confirm('Delete this message?'))db.ref('dmMessages/'+G.dmChannel+'/'+m.key).remove();}});
    }
    showCtxItems(e.clientX,e.clientY,items);
  });
  feed.appendChild(row);
  _dmLastMsg={uid:m.username||m.uid,ts:m.ts};
}

function editDmMsg(key,curText){
  const row=document.getElementById('dm-m-'+key);if(!row)return;
  const body=row.querySelector('.msg-txt');if(!body)return;
  const original=body.innerHTML;
  body.innerHTML=`<textarea class="msg-edit-area" style="width:100%;min-height:60px;background:rgba(0,0,0,.3);border:1px solid rgba(179, 136, 255,.25);color:#fff;padding:6px 8px;border-radius:6px;font-family:inherit;font-size:13px;resize:vertical">${esc(curText)}</textarea>
    <div style="display:flex;gap:6px;margin-top:6px">
      <button class="btn-sub" data-edit-save style="padding:4px 12px;font-size:11px">Save</button>
      <button class="btn-ghost" data-edit-cancel style="padding:4px 12px;font-size:11px">Cancel</button>
    </div>`;
  const ta=body.querySelector('textarea');ta.focus();
  body.querySelector('[data-edit-cancel]').onclick=()=>{body.innerHTML=original;};
  body.querySelector('[data-edit-save]').onclick=async()=>{
    const v=ta.value.trim();
    if(!v){toast('Empty message','error');return;}
    if(v===curText){body.innerHTML=original;return;}
    await db.ref('dmMessages/'+G.dmChannel+'/'+key).update({text:automod(v),edited:true});
    toast('Edited','success');
  };
  ta.addEventListener('keydown',e=>{
    if(e.key==='Escape'){e.preventDefault();body.innerHTML=original;}
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();body.querySelector('[data-edit-save]').click();}
  });
}

function showReactPickerDm(key){
  const picks=['👍','❤️','😂','🔥','✅','🎉','💀','🫡','⭐','🤯'];
  document.getElementById('rpicker-dm-'+key)?.remove();
  const el=document.createElement('div');el.id='rpicker-dm-'+key;
  el.style.cssText='position:absolute;right:14px;top:-45px;background:rgba(10,7,22,.97);border:1px solid rgba(179, 136, 255,.2);border-radius:var(--r12);padding:6px;display:flex;gap:4px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.5)';
  picks.forEach(e=>{
    const b=document.createElement('button');
    b.style.cssText='border:none;background:none;font-size:18px;cursor:pointer;padding:2px;border-radius:4px';
    b.textContent=e;
    b.onmouseenter=()=>b.style.background='rgba(179, 136, 255,.1)';
    b.onmouseleave=()=>b.style.background='';
    b.onclick=()=>{toggleReactionDm(key,e);el.remove();};
    el.appendChild(b);
  });
  const row=document.getElementById('dm-m-'+key);
  if(row){row.style.position='relative';row.appendChild(el);}
  setTimeout(()=>el.remove(),5000);
}

function toggleReactionDm(key,emoji){
  if(!G.dmChannel)return;
  const ref=db.ref('dmMessages/'+G.dmChannel+'/'+key+'/reactions/'+encodeURIComponent(emoji)+'/'+me.username);
  ref.once('value',s=>{s.exists()?ref.remove():ref.set(true);});
}

async function sendDM(){
  const inp=document.getElementById('dmInput');
  if(!inp)return;
  const txt=inp.value.trim();
  if((!txt&&!pendingFile)||!G.dmChannel)return;
  if(txt&&_automodShouldBlock(txt))return;
  const now=Date.now();
  const payload={username:me.username,uid:me.uid,displayName:me.displayName,avatarUrl:me.avatarUrl||'',text:txt?automod(txt):'',ts:now,edited:false};

  if(G.reply){payload.replyTo={msgId:G.reply.msgId,username:G.reply.username,text:G.reply.text};}
  if(pendingFile){
    try{
      if(pendingFile._isGif&&pendingFile._gifUrl){
        payload.attachmentUrl=pendingFile._gifUrl;
        payload.attachmentName='gif';
        payload.attachmentType='image';
      }else{
        const isImg=pendingFile.type&&pendingFile.type.startsWith('image/');
        let uploaded=false;
        
        if(pendingFile.size>300*1024){
          try{
            const ref=storage.ref('dm-attachments/'+G.dmChannel+'/'+now+'_'+pendingFile.name);
            await ref.put(pendingFile);
            payload.attachmentUrl=await ref.getDownloadURL();
            payload.attachmentName=pendingFile.name;
            payload.attachmentType=isImg?'image':'file';
            uploaded=true;
          }catch(stErr){console.warn('[PC] DM Storage upload failed, falling back to data URL:',stErr.code||stErr.message);}
        }
        if(!uploaded){
          if(isImg){
            let durl;
            if(pendingFile.size>900*1024){
              durl=await _shrinkImage(pendingFile,800,0.82);
              if(durl.length>800000)durl=await _shrinkImage(pendingFile,560,0.72);
              if(durl.length>500000)durl=await _shrinkImage(pendingFile,400,0.6);
            }else{
              durl=await _fileToDataURL(pendingFile);
            }
            payload.attachmentUrl=durl;
            payload.attachmentName=pendingFile.name||'image';
            payload.attachmentType='image';
          }else{
            if(pendingFile.size>5*1024*1024){toast('File too large (max 5MB inline). Configure Firebase Storage for bigger files.','error');return;}
            const durl=await _fileToDataURL(pendingFile);
            payload.attachmentUrl=durl;
            payload.attachmentName=pendingFile.name||'file';
            payload.attachmentType='file';
            payload.attachmentMime=pendingFile.type||'application/octet-stream';
          }
        }
      }
    }catch(e){toast('Upload failed: '+(e.message||e),'error');return;}
    pendingFile=null;
    const fp=document.getElementById('filePreview');if(fp)fp.innerHTML='';
  }
  await db.ref('dmMessages/'+G.dmChannel).push(payload);

  cancelReply();
  
  try{db.ref('dmChannels/'+G.dmChannel).update({lastMsgTs:now,lastMsgFrom:me.username,lastMsgPreview:(txt||'[attachment]').slice(0,80)});}catch(e){}

  try{
    const dm=dmChannels.find(d=>d.id===G.dmChannel);
    if(dm){
      const others=_dmParts(dm).filter(p=>p!==me.username);
      
      const pingedSet=new Set();
      const lower=(txt||'').toLowerCase();
      const wantsEveryone=/@everyone\b/i.test(txt||'');
      const wantsHere=/@here\b/i.test(txt||'');
      const re=/@([a-z0-9_\-]+)/gi;
      let mm;while((mm=re.exec(txt||''))){
        const n=mm[1].toLowerCase();
        if(n==='everyone'||n==='here')continue;
        
        for(const o of others){
          if(o.toLowerCase()===n){pingedSet.add(o);continue;}
          const dn=((window._userProfiles||{})[o]||{}).displayName||'';
          if(dn&&dn.toLowerCase()===n)pingedSet.add(o);
        }
      }
      for(const o of others){
        const isPinged=wantsEveryone||wantsHere||pingedSet.has(o);
        db.ref('notifications/'+o).push({
          type:isPinged?'dm-mention':'dm',
          from:me.username,
          fromAvatar:me.avatarUrl||'',
          fromDisplay:me.displayName||me.username,
          dmId:G.dmChannel,
          dmName:dm.isGroup?(dm.name||'Group'):'',
          isGroup:!!dm.isGroup,
          text:(txt||'[attachment]').slice(0,200),
          ts:now,
          pingType:wantsEveryone?'everyone':wantsHere?'here':(isPinged?'user':'')
        });
      }
    }
  }catch(e){}
  inp.value='';inp.style.height='';
}

function bindMainEvents(){
  document.getElementById('searchToggleBtn')?.addEventListener('click',toggleSearch);
  document.getElementById('searchCloseBtn')?.addEventListener('click',toggleSearch);
  document.getElementById('searchInp')?.addEventListener('input',e=>doSearch(e.target.value));

  document.getElementById('membersToggleBtn')?.addEventListener('click',toggleMembers);
  document.getElementById('helpBtn')?.addEventListener('click',showHelp);
  document.getElementById('suggestUserSrvBtn')?.addEventListener('click',showSuggestUser);
  document.getElementById('replyCloseBtn')?.addEventListener('click',cancelReply);
  document.getElementById('attachBtn')?.addEventListener('click',()=>document.getElementById('fileInput')?.click());
  document.getElementById('fileInput')?.addEventListener('change',e=>handleFile(e.target));
  document.getElementById('emojiToggleBtn')?.addEventListener('click',()=>document.getElementById('emojiPanel')?.classList.toggle('on'));
  const _mi=document.getElementById('msgInput');
  if(_mi){
    _mi.addEventListener('input',e=>{grow(e.target);pingTyping();updateMentionBox(_mi);});
    _mi.addEventListener('keydown',e=>{
      
      if(_mentionState.open){
        if(e.key==='ArrowDown'){e.preventDefault();_mentionState.idx=(_mentionState.idx+1)%_mentionState.items.length;_renderMentionBox();return;}
        if(e.key==='ArrowUp'){e.preventDefault();_mentionState.idx=(_mentionState.idx-1+_mentionState.items.length)%_mentionState.items.length;_renderMentionBox();return;}
        if(e.key==='Tab'||e.key==='Enter'){e.preventDefault();_applyMentionPick(_mi);return;}
        if(e.key==='Escape'){e.preventDefault();_closeMentionBox();return;}
      }
      if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}
      if(e.key==='Escape')cancelReply();
    });
    _mi.addEventListener('click',()=>updateMentionBox(_mi));
    _mi.addEventListener('blur',()=>setTimeout(_closeMentionBox,180));
    _mi.addEventListener('paste',handlePasteImage);
    _mi.addEventListener('contextmenu',e=>showFormatCtx(e,_mi));
  }
  
  const _gifBtn=document.getElementById('gifToggleBtn');
  if(_gifBtn)_gifBtn.addEventListener('click',()=>showGifPicker('server'));
  
  const _pollBtn=document.getElementById('pollToggleBtn');
  if(_pollBtn)_pollBtn.addEventListener('click',()=>showCreatePollModal());
}

function showFormatCtx(e,inp){
  e.preventDefault();
  const sel=inp.value.slice(inp.selectionStart,inp.selectionEnd);
  const items=[
    {label:'Bold',icon:'fa-bold',fn:()=>_wrapSel(inp,'**','**')},
    {label:'Italic',icon:'fa-italic',fn:()=>_wrapSel(inp,'*','*')},
    {label:'Underline',icon:'fa-underline',fn:()=>_wrapSel(inp,'__','__')},
    {label:'Strikethrough',icon:'fa-strikethrough',fn:()=>_wrapSel(inp,'~~','~~')},
    {label:'Inline code',icon:'fa-code',fn:()=>_wrapSel(inp,'`','`')},
    {label:'Code block',icon:'fa-laptop-code',fn:()=>_wrapSel(inp,'```\n','\n```')},
    {label:'Spoiler',icon:'fa-eye-slash',fn:()=>_wrapSel(inp,'||','||')},
    {label:'Quote',icon:'fa-quote-left',fn:()=>_wrapSel(inp,'> ','')},
  ];
  if(sel){
    items.unshift({label:'Copy',icon:'fa-copy',fn:()=>{try{navigator.clipboard.writeText(sel);toast('Copied','success');}catch(e){}}});
  }
  showCtxItems(e.clientX,e.clientY,items);
}
function _wrapSel(inp,pre,post){
  const s=inp.selectionStart,e=inp.selectionEnd;
  const v=inp.value;
  const sel=v.slice(s,e);
  inp.value=v.slice(0,s)+pre+sel+post+v.slice(e);
  const np=s+pre.length+sel.length+post.length;
  try{inp.setSelectionRange(s+pre.length,np-post.length);}catch(_){}
  inp.focus();
  grow(inp);
}

function handlePasteImage(e){
  try{
    const items=(e.clipboardData||window.clipboardData)?.items||[];
    for(const it of items){
      if(it.kind==='file'&&it.type.startsWith('image/')){
        const blob=it.getAsFile();
        if(!blob)continue;
        e.preventDefault();
        const ext=(blob.type.split('/')[1]||'png').replace('jpeg','jpg');
        const file=new File([blob],'pasted-'+Date.now()+'.'+ext,{type:blob.type});
        if(file.size>10*1024*1024){toast('Pasted image too large (max 10MB)','error');return;}
        pendingFile=file;
        const fp=document.getElementById('filePreview');
        if(fp){
          const url=URL.createObjectURL(file);
          fp.innerHTML=`<div class="file-prev"><img src="${url}" style="width:42px;height:42px;object-fit:cover;border-radius:6px"/><span>${esc(file.name)} (${(file.size/1024).toFixed(1)}KB)</span><button id="clearFileBtn"><i class="fa-solid fa-xmark"></i></button></div>`;
          document.getElementById('clearFileBtn')?.addEventListener('click',()=>{pendingFile=null;fp.innerHTML='';URL.revokeObjectURL(url);});
        }
        toast('Image pasted — press Enter to send','info');
        return;
      }
    }
  }catch(err){console.warn('paste handler',err);}
}

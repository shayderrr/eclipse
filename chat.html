function _pollTally(poll){
  const votes=(poll&&poll.votes)||{};
  const counts={};let total=0;
  const myPicks=new Set();
  (poll.options||[]).forEach(o=>counts[o.id]=0);
  Object.entries(votes).forEach(([voter,v])=>{
    if(typeof v==='string'){
      if(counts[v]!==undefined)counts[v]++;
      total++;
      if(voter===me.username)myPicks.add(v);
    }else if(v&&typeof v==='object'){
      Object.keys(v).forEach(oid=>{
        if(v[oid]&&counts[oid]!==undefined){counts[oid]++;total++;}
        if(voter===me.username&&v[oid])myPicks.add(oid);
      });
    }
  });
  return {counts,total,myPicks};
}

function _renderPollWidget(m){
  const p=m.poll||{};
  const opts=p.options||[];
  const {counts,total,myPicks}=_pollTally(p);
  const closed=!!p.closed;
  const canManage=m.username===me.username||hasPerm('manageMessages');
  
  let maxCnt=0;for(const k in counts)if(counts[k]>maxCnt)maxCnt=counts[k];
  const rows=opts.map(o=>{
    const c=counts[o.id]||0;
    const pct=total?Math.round((c/total)*1000)/10:0;
    const mine=myPicks.has(o.id);
    const winning=total>0&&c===maxCnt&&c>0;
    return `<button class="poll-opt" data-poll-msg="${eattr(m.key)}" data-poll-opt="${eattr(o.id)}" ${closed?'disabled':''} style="position:relative;display:block;width:100%;text-align:left;border:1px solid ${mine?'rgba(179, 136, 255,.55)':'rgba(179, 136, 255,.18)'};background:${mine?'rgba(179, 136, 255,.08)':'rgba(10,7,22,.6)'};border-radius:8px;padding:9px 12px;margin-bottom:6px;cursor:${closed?'default':'pointer'};color:#fff;font-family:var(--mono);font-size:12.5px;overflow:hidden">
      <div style="position:absolute;left:0;top:0;bottom:0;width:${pct}%;background:linear-gradient(90deg,${winning?'rgba(156, 77, 204,.18)':'rgba(179, 136, 255,.13)'},transparent);transition:width .3s ease;pointer-events:none"></div>
      <div style="position:relative;display:flex;align-items:center;gap:8px">
        <span style="flex:1;font-family:var(--grotesk);font-weight:${mine?'700':'500'}">${mine?'<i class="fa-solid fa-check" style="color:var(--cyan);margin-right:6px;font-size:10px"></i>':''}${esc(o.text)}</span>
        <span style="font-size:11px;color:var(--muted);white-space:nowrap">${c} · ${pct}%</span>
      </div>
    </button>`;
  }).join('');
  const meta=`<div style="font-size:10.5px;color:var(--muted);font-family:var(--mono);margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <span><i class="fa-solid fa-square-poll-vertical" style="color:var(--cyan)"></i> ${total} vote${total===1?'':'s'}</span>
    ${p.multi?'<span style="color:var(--purple)">· multi-select</span>':''}
    ${p.anonymous?'<span style="color:var(--muted)">· anonymous</span>':''}
    ${closed?'<span style="color:var(--rose)">· CLOSED</span>':''}
    ${canManage&&!closed?`<button class="btn-ghost poll-close" data-poll-msg="${eattr(m.key)}" style="margin-left:auto;padding:3px 8px;font-size:10px;color:var(--rose)"><i class="fa-solid fa-lock"></i> Close</button>`:''}
    ${canManage&&closed?`<button class="btn-ghost poll-reopen" data-poll-msg="${eattr(m.key)}" style="margin-left:auto;padding:3px 8px;font-size:10px;color:var(--cyan)"><i class="fa-solid fa-lock-open"></i> Reopen</button>`:''}
  </div>`;
  return `<div class="poll-card" data-poll-card="${eattr(m.key)}" style="border:1px solid rgba(179, 136, 255,.22);border-radius:10px;padding:12px;background:rgba(8,4,18,.55);max-width:520px">
    <div style="font-family:var(--grotesk);font-size:15px;font-weight:800;margin-bottom:10px;line-height:1.3">${esc(p.question||'')}</div>
    ${rows}
    ${meta}
  </div>`;
}

async function togglePollVote(msgKey,optId){
  if(!G.srvId||!G.channel||!msgKey||!optId)return;
  const ref=db.ref('messages/'+G.srvId+'/'+G.channel+'/'+msgKey);
  try{
    const snap=await ref.once('value');
    const m=snap.val()||{};
    if(!m.poll||m.poll.closed)return;
    const opts=(m.poll.options||[]).map(o=>o.id);
    if(!opts.includes(optId))return;
    const cur=(m.poll.votes||{})[me.username];
    if(m.poll.multi){
      const next=(cur&&typeof cur==='object')?{...cur}:{};
      if(next[optId])delete next[optId];else next[optId]=true;
      if(Object.keys(next).length===0){
        await ref.child('poll/votes/'+me.username).remove();
      }else{
        await ref.child('poll/votes/'+me.username).set(next);
      }
    }else{
      
      if(cur===optId||(cur&&typeof cur==='object'&&cur[optId])){
        await ref.child('poll/votes/'+me.username).remove();
      }else{
        await ref.child('poll/votes/'+me.username).set(optId);
      }
    }
  }catch(e){
    console.error('vote failed',e);
    toast('Vote failed: '+(e.message||e.code||'error'),'error');
  }
}

async function _setPollClosed(msgKey,closed){
  if(!G.srvId||!G.channel||!msgKey)return;
  const ref=db.ref('messages/'+G.srvId+'/'+G.channel+'/'+msgKey);
  try{
    const snap=await ref.once('value');

    if(!m.poll)return;

}

async function purgePlatformUser(username){
  if(me.username!==OWNER){toast('Owner only','error');return;}
  if(!username){toast('No username','error');return;}
  if(username===OWNER){toast("Can't delete the owner",'error');return;}
  const ok=await uiConfirm(`Permanently delete @${username}? This wipes profile, memberships, DMs, and every reference. Cannot be undone.`,{title:'Delete User',okLabel:'Delete',danger:true});
  if(!ok)return;
  toast('Purging '+username+'…','info');
  const updates={};
  try{
    
    const usr=await db.ref('users/'+username).once('value');
    const usrVal=usr.val()||{};
    updates['users/'+username]=null;
    updates['usernames/'+username.toLowerCase()]=null;
    if(usrVal.uid)updates['uidIndex/'+usrVal.uid]=null;
    if(usrVal.email){
      const ek=String(usrVal.email).replace(/\./g,'_').toLowerCase();
      updates['emailIndex/'+ek]=null;
    }
    
    updates['userServers/'+username]=null;
    updates['userDms/'+username]=null;
    updates['notifications/'+username]=null;
    updates['lastRead/'+username]=null;
    updates['friendRequests/'+username]=null;
    updates['friends/'+username]=null;
    updates['presence/'+username]=null;
    updates['automod/'+username]=null;
    updates['applications/'+username]=null;
    updates['serverApplications/'+username]=null;
    
    const allSrv=await db.ref('servers').once('value');
    allSrv.forEach(srv=>{
      const sid=srv.key;
      const mem=srv.child('members/'+username);
      if(mem.exists())updates['servers/'+sid+'/members/'+username]=null;
      const ban=srv.child('bans/'+username);
      if(ban.exists())updates['servers/'+sid+'/bans/'+username]=null;
      const to=srv.child('timeouts/'+username);
      if(to.exists())updates['servers/'+sid+'/timeouts/'+username]=null;
      const st=srv.child('strikes/'+username);
      if(st.exists())updates['servers/'+sid+'/strikes/'+username]=null;
    });

    const allDm=await db.ref('dmChannels').once('value');
    const dmCleanup=[];
    allDm.forEach(dm=>{
      const id=dm.key;
      const d=dm.val()||{};
      const parts=Array.isArray(d.participants)?d.participants:[];
      if(!parts.includes(username))return;
      if(parts.length<=2||!d.isGroup){
        
        updates['dmChannels/'+id]=null;
        updates['dmMessages/'+id]=null;
        
        parts.forEach(p=>{if(p)updates['userDms/'+p+'/'+id]=null;});
      }else{
        
        const next=parts.filter(p=>p!==username);
        updates['dmChannels/'+id+'/participants']=next;
      }
    });

    let bulkOk=false;
    try{
      await db.ref().update(updates);
      bulkOk=true;
    }catch(bulkErr){
      console.warn('purge bulk update failed, falling back to per-path:',bulkErr&&bulkErr.message);
      const paths=Object.keys(updates);
      let okCount=0,failCount=0;
      for(const p of paths){
        try{
          await db.ref(p).set(updates[p]);
          okCount++;
        }catch(e){
          failCount++;
          console.warn('purge path failed:',p,e&&e.message);
        }
      }
      if(okCount>0){
        toast(`Partial purge: ${okCount} cleared, ${failCount} blocked by rules`,failCount?'error':'success');
      }else{
        toast('Purge failed — check Firebase rules','error');
        return;
      }
    }

    try{
      const verify=await db.ref('servers').once('value');
      const leftovers={};
      verify.forEach(srv=>{
        if(srv.child('members/'+username).exists()){
          leftovers['servers/'+srv.key+'/members/'+username]=null;
          leftovers['userServers/'+username+'/'+srv.key]=null;
        }
      });
      const leftoverCount=Object.keys(leftovers).length;
      if(leftoverCount){
        console.warn('[purge] verify pass found',leftoverCount/2,'ghost memberships, cleaning...');
        try{await db.ref().update(leftovers);}
        catch(e){
          
          for(const p of Object.keys(leftovers)){
            try{await db.ref(p).set(null);}catch(_){}
          }
        }
      }
    }catch(e){console.warn('[purge] verify pass failed',e&&e.message);}

    try{_purgeUserFromLocalCaches(username,G.srvId);}catch(e){}
    
    try{
      if(typeof dmChannels!=='undefined'&&Array.isArray(dmChannels)){
        for(let i=dmChannels.length-1;i>=0;i--){
          const parts=dmChannels[i]&&dmChannels[i].participants;
          if(Array.isArray(parts)&&parts.includes(username)&&parts.length<=2){dmChannels.splice(i,1);}
        }
        if(typeof renderDmList==='function')renderDmList();
        if(typeof renderDmNotif==='function')renderDmNotif();
      }
    }catch(e){}
    if(bulkOk)toast('Purged @'+username,'success');
  }catch(e){
    console.error('purge failed',e);
    toast('Purge failed: '+(e.message||e.code||'error'),'error');
  }
}

async function kickMember(username){
  if(isPCOwner(username)){toast("Can't kick a PC-Owner",'error');return;}
  if(!hasPerm('kickMembers')){toast('No permission','error');return;}
  
  if(username===me.username){toast("Can't kick yourself",'error');return;}
  const srvIdAtKick=G.srvId;
  try{
    const t=await db.ref('servers/'+srvIdAtKick+'/members/'+username).once('value');
    if(!t.exists()){
      // Already gone server-side but UI may still show them (stale cache).
      // Sweep them out of every local cache and re-render so the row vanishes.
      _purgeUserFromLocalCaches(username,srvIdAtKick);
      toast(username+' was already removed','info');closeModal();
      return;
    }
    const tRole=t.val().role||'member';
    if((ROLES[tRole]||ROLES.member).level>=(ROLES[me.role]||ROLES.member).level){toast("Can't kick equal/higher role",'error');return;}
    await db.ref().update({
      ['servers/'+srvIdAtKick+'/members/'+username]:null,
      ['userServers/'+username+'/'+srvIdAtKick]:null
    });
    // OPTIMISTIC LOCAL SWEEP — don't wait for the .on('value') listener to
    // fire (sometimes it doesn't, sometimes it races, sometimes the user
    // already left the page). Strip them out of every local store so the
    // UI updates immediately.
    _purgeUserFromLocalCaches(username,srvIdAtKick);
    db.ref('notifications/'+username).push({type:'kick',server:srvData.name,by:me.username,ts:Date.now(),text:'You were kicked from '+srvData.name}).catch(()=>{});
    logAudit('member_kick',{target:username}).catch(()=>{});
    toast(username+' kicked','success');closeModal();
  }catch(e){
    console.error('kickMember failed',e);
    toast('Kick failed: '+(e.message||e.code||'unknown'),'error');
  }
}

// Shared local-cache scrubber used after kick/ban/purge. Strips a username
// out of every in-memory store the UI reads from, then re-renders the
// affected panels. This is the safety net for the "I kicked them but

function _purgeUserFromLocalCaches(username,srvId){
  if(!username)return;
  try{
    if(srvId&&srvData&&srvData.id===srvId&&srvData.members){delete srvData.members[username];}
    if(_memCache&&_memCache.members){delete _memCache.members[username];}
    if(window._userProfiles)delete window._userProfiles[username];
    if(window._userAvCache)delete window._userAvCache[username];
    if(window._avDecCache)delete window._avDecCache[username];
    if(window._avAccentCache)delete window._avAccentCache[username];
  }catch(e){}
  try{_renderMemPane();}catch(e){}
  try{const inp=document.getElementById('ssMemSearch');if(inp&&typeof loadMemList==='function')loadMemList(inp.value||'');}catch(e){}
  try{if(typeof loadApplicationsList==='function'&&document.getElementById('appsListRoot'))loadApplicationsList();}catch(e){}
  try{if(typeof buildRail==='function')buildRail();}catch(e){}
}

async function banMember(username,reason){
  if(isPCOwner(username)){toast("Can't ban a PC-Owner",'error');return;}
  if(!hasPerm('banMembers')){toast('No permission','error');return;}
    if(false){
    toast('You cannot ban the server owner','error');return;
  }
  if(username===me.username){toast("Can't ban yourself",'error');return;}
  try{

    const t=await db.ref('servers/'+G.srvId+'/members/'+username).once('value');
    const memberExists=t.exists();
    if(memberExists){
      const tRole=t.val()?.role||'member';
      if((ROLES[tRole]||ROLES.member).level>=(ROLES[me.role]||ROLES.member).level){toast("Can't ban equal/higher role",'error');return;}
    }

    const updates={};
    updates['servers/'+G.srvId+'/bans/'+username]={reason:reason||'No reason',by:me.username,ts:Date.now()};
    updates['servers/'+G.srvId+'/members/'+username]=null;
    updates['userServers/'+username+'/'+G.srvId]=null;
    await db.ref().update(updates);
    
    _purgeUserFromLocalCaches(username,G.srvId);

    db.ref('notifications/'+username).push({type:'ban',server:srvData.name,by:me.username,reason,ts:Date.now(),text:'You were banned from '+srvData.name+': '+(reason||'No reason')}).catch(()=>{});

  }catch(e){
    console.error('banMember failed',e);
    toast('Ban failed: '+(e.message||e.code||'unknown'),'error');
  }
}

async function timeoutMember(username,duration,reason){
  if(!hasPerm('timeoutMembers')){toast('No permission','error');return;}
  
  if(username===me.username){toast("Can't timeout yourself",'error');return;}
  try{
    
    const t=await db.ref('servers/'+G.srvId+'/members/'+username).once('value');
    const tRole=t.val()?.role||'member';
    if((ROLES[tRole]||ROLES.member).level>=(ROLES[me.role]||ROLES.member).level){toast("Can't timeout equal/higher role",'error');return;}
    const until=Date.now()+(duration*1000);
    await db.ref('servers/'+G.srvId+'/timeouts/'+username).set({until,by:me.username,reason:reason||'',ts:Date.now()});
    db.ref('notifications/'+username).push({type:'timeout',server:srvData.name,by:me.username,reason,ts:Date.now(),text:'You were timed out in '+srvData.name+' for '+duration+'s'}).catch(()=>{});
    logAudit('member_timeout',{target:username,duration,reason:reason||''}).catch(()=>{});
    toast(username+' timed out for '+duration+'s','success');closeModal();
  }catch(e){
    console.error('timeoutMember failed',e);
    toast('Timeout failed: '+(e.message||e.code||'unknown'),'error');
  }
}

let _memWatchRef=null,_memWatchCb=null;
let _memWatchPresRef=null,_memWatchPresCb=null,_memWatchUsersRef=null,_memWatchUsersCb=null,_memWatchSrv='';
let _memCache={members:{},pres:{},users:{}};
function _renderMemPane(){
  const {pres,users}=_memCache;
  let {members}=_memCache;

  if(!members||!Object.keys(members).length){
    const stub={};
    if(me&&me.username)stub[me.username]={role:me.role||'member',joinedAt:Date.now()};
    
    members=stub;
    _memCache.members=stub;
    
    try{
      if(me&&me.username){
        db.ref('servers/'+G.srvId+'/members/'+me.username).set({role:me.role||'member',joinedAt:Date.now()}).catch(()=>{});
      }
      if(G.srvId===QS_ID){
      }
    }catch(e){}
  }

  const rolesOrdered=_allRolesOrdered();
  const sections=[];
  const sectionByKey={};
  const ensureSection=role=>{
    const k=role.id;
    if(sectionByKey[k])return sectionByKey[k];
    const s={role,members:[]};
    sectionByKey[k]=s;sections.push(s);
    return s;
  };
  rolesOrdered.forEach(role=>{if(role.hoist&&role.isBuiltIn)ensureSection(role);});
  const byRole={offline:[]};

  const ghostsToClean=[];
  Object.keys(members).forEach(u=>{
        
    const sacred=u===me.username;

    const cacheReady=users&&Object.keys(users).length>0;
    if(!sacred&&cacheReady&&!users[u]){
      ghostsToClean.push(u);
      return; 
    }
    const st=pres[u]?.status||'offline';
    const ud=users[u]||{};
    const baseRole=members[u].role||'member';
    const info={name:u,status:st,role:baseRole,displayName:ud.displayName||u,avatarUrl:ud.avatarUrl||''};
    if(st==='offline'||st==='invisible'){byRole.offline.push(info);return;}
    
    const userCustomIds=new Set(members[u].customRoles||[]);
    let pickedRole=null;
    for(const role of rolesOrdered){
      if(!role.hoist)continue;
      if(role.isBuiltIn){if(role.builtInKey===baseRole){pickedRole=role;break;}}
      else if(userCustomIds.has(role.id)){pickedRole=role;break;}
    }
    if(!pickedRole)pickedRole=rolesOrdered.find(r=>r.isBuiltIn&&r.builtInKey==='member')||rolesOrdered[rolesOrdered.length-1];
    ensureSection(pickedRole).members.push(info);
  });

  if(ghostsToClean.length&&hasPerm('manageServer')){
    const updates={};
    ghostsToClean.forEach(u=>{
      updates['servers/'+G.srvId+'/members/'+u]=null;
      updates['userServers/'+u+'/'+G.srvId]=null;
    });
    db.ref().update(updates).then(()=>{
      console.log('[ghost-clean] removed',ghostsToClean.length,'ghost members:',ghostsToClean.join(', '));
      ghostsToClean.forEach(u=>{if(_memCache.members)delete _memCache.members[u];});
    }).catch(e=>console.warn('[ghost-clean] failed',e&&e.message));
  }
  const mem=document.getElementById('members');if(!mem)return;
  let h='';
  sections.forEach(s=>{
    if(!s.members.length)return;
    const rd=s.role;
    h+=`<div class="mem-hd" style="color:${rd.color}">${esc(rd.name)} — ${s.members.length}</div>`;
    s.members.forEach(u=>{
      const nmCol=roleColorFor(u.name);
      h+=`<div class="mem-row" data-memname="${eattr(u.name)}">
        <div class="mem-av"><div class="mem-av-inner">${avHtml(u.name,u.avatarUrl,30)}</div><div class="mem-dot" data-status="${esc(u.status||'offline')}"></div></div>
        <div style="flex:1;overflow:hidden"><div class="mem-name" style="color:${nmCol}">${esc(u.displayName)}${u.name===me.username?' <span style="font-size:9px;color:var(--muted);font-family:var(--mono)">(you)</span>':''}</div><div style="font-size:10px;color:var(--muted);font-family:var(--mono)">${stLabel(u.status)}</div></div>
      </div>`;
    });
  });
  if(byRole.offline.length){
    h+=`<div class="mem-hd" style="margin-top:12px">Offline — ${byRole.offline.length}</div>`;
    byRole.offline.forEach(u=>{
      
      const nmCol=roleColorFor(u.name);
      h+=`<div class="mem-row offline" data-memname="${eattr(u.name)}">
        <div class="mem-av"><div class="mem-av-inner">${avHtml(u.name,u.avatarUrl,30)}</div><div class="mem-dot" data-status="offline"></div></div>
        <div class="mem-name" style="color:${nmCol}">${esc(u.displayName||u.name)}</div>
      </div>`;
    });
  }
  mem.innerHTML=h||`<div style="padding:20px;color:var(--muted);font-family:var(--mono);font-size:11px;text-align:center">No members</div>`;
  mem.querySelectorAll('.mem-row[data-memname]').forEach(row=>{
    const uname=row.dataset.memname;
    row.onclick=()=>showProfile(uname);
    row.addEventListener('contextmenu',e=>{e.preventDefault();showMemberCtx(e,uname);});
  });
}

function startPresence(){
  if(window._presenceInited)return;
  window._presenceInited=true;
  const presRef=db.ref('presence/'+me.username);
  const connRef=db.ref('.info/connected');

  const ALLOWED_PRESENCE=new Set(['online','idle','dnd','invisible']);
  const setOnline=()=>{
    let desired=me.status;
    if(!ALLOWED_PRESENCE.has(desired))desired='online';
    me.status=desired; 
    presRef.set({status:desired,ts:Date.now()}).catch(()=>{});
  };

  connRef.on('value',snap=>{
    if(!snap.val())return;
    presRef.onDisconnect().set({status:'offline',ts:firebase.database.ServerValue.TIMESTAMP}).then(setOnline);
  });

  if(window._presenceHeartbeat)clearInterval(window._presenceHeartbeat);
  window._presenceHeartbeat=setInterval(()=>{
    if(document.hidden)return; 
    presRef.update({ts:Date.now()}).catch(()=>{});
  },20000);
  
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden)setOnline();
  });
  
  window.addEventListener('online',setOnline);
  
  setOnline();
}

function setStatus(s){

  if(s==='offline')s='invisible';
  const VALID=new Set(['online','idle','dnd','invisible']);
  if(!VALID.has(s))s='online';
  me.status=s;

  db.ref('presence/'+me.username).update({status:s});
  db.ref('users/'+me.username+'/statusPref').set(s).catch(()=>{});
  refreshMe();
  document.getElementById('statusPopup')?.classList.remove('on');
  toast('Status: '+stLabel(s),'info');
}

function refreshMe(){
  const col=hue(me.username);

  const slots=[
    {av:'meAv',dot:'meDot',nm:'meName',tg:'meTag'},
    {av:'dmMeAv',dot:'dmMeDot',nm:'dmMeName',tg:'dmMeTag'}
  ];
  slots.forEach(s=>{
    const av=document.getElementById(s.av);
    if(av){
      av.innerHTML=avHtml(me.username,me.avatarUrl,32);
      if(!me.avatarUrl)av.style.background='transparent';
    }
    const dot=document.getElementById(s.dot);
    if(dot){const st=me.status||'online';dot.dataset.status=st;dot.style.background='';}
    const nm=document.getElementById(s.nm);if(nm)nm.textContent=me.displayName||me.username;
    const tg=document.getElementById(s.tg);if(tg)tg.textContent='@'+me.username;
  });
}

function _extractAvatarPalette(url){
  return new Promise((resolve,reject)=>{
    if(!url)return reject(new Error('no avatar set'));
    const img=new Image();
    
    img.crossOrigin='anonymous';
    img.onload=()=>{
      try{
        
        const SIZE=96;
        const c=document.createElement('canvas');c.width=SIZE;c.height=SIZE;
        const ctx=c.getContext('2d');
        ctx.drawImage(img,0,0,SIZE,SIZE);
        const data=ctx.getImageData(0,0,SIZE,SIZE).data;
        const buckets={};
        
        const STEP=32;
        for(let i=0;i<data.length;i+=4){
          const a=data[i+3];if(a<200)continue;
          const r=data[i],g=data[i+1],b=data[i+2];
          
          const max=Math.max(r,g,b),min=Math.min(r,g,b);
          if(max<35)continue;
          if(min>235&&max-min<20)continue;
          
          const sat=max===0?0:(max-min)/max;
          if(sat<0.18)continue;
          const br=(max+min)/2;
          const key=Math.floor(r/STEP)+'|'+Math.floor(g/STEP)+'|'+Math.floor(b/STEP);
          if(!buckets[key])buckets[key]={r:0,g:0,b:0,n:0,score:0};
          const w=1+sat*1.5+(br>120?0.4:0);
          buckets[key].r+=r*w;
          buckets[key].g+=g*w;
          buckets[key].b+=b*w;
          buckets[key].n+=w;
          buckets[key].score+=w;
        }
        const arr=Object.values(buckets).map(b=>{
          const r=Math.round(b.r/b.n),g=Math.round(b.g/b.n),bl=Math.round(b.b/b.n);
          return {r,g,b:bl,score:b.score,hex:'#'+[r,g,bl].map(x=>x.toString(16).padStart(2,'0')).join('')};
        }).sort((a,b)=>b.score-a.score);

        const out=[];
        for(const c of arr){
          const dupe=out.find(o=>Math.abs(o.r-c.r)<28&&Math.abs(o.g-c.g)<28&&Math.abs(o.b-c.b)<28);
          if(dupe)continue;
          out.push(c);
          if(out.length>=5)break;
        }
        if(!out.length)return reject(new Error('no usable colors'));
        resolve(out.map(c=>c.hex));
      }catch(e){reject(e);}
    };
    img.onerror=()=>reject(new Error('image load failed (CORS?)'));
    img.src=url;
  });
}

function _wirePaletteSuggester(){
  const btn=document.getElementById('paletteSuggestBtn');
  if(!btn)return;
  let palette=[];
  let chosen=null;
  const swBox=document.getElementById('paletteSwatches');
  const applyRow=document.getElementById('paletteApplyRow');
  const setField=(idCol,idTxt,val)=>{
    const c=document.getElementById(idCol),t=document.getElementById(idTxt);
    if(c){c.value=val;try{c.dispatchEvent(new Event('input'));}catch(e){}}
    if(t){t.value=val;try{t.dispatchEvent(new Event('input'));}catch(e){}}
  };
  const renderSwatches=()=>{
    if(!swBox)return;
    if(!palette.length){swBox.innerHTML='<div style="font-size:11px;color:var(--muted);font-family:var(--mono)">No usable colors found in your avatar.</div>';swBox.style.display='flex';return;}
    swBox.style.display='flex';
    swBox.innerHTML=palette.map((c,i)=>`<button type="button" data-pal-i="${i}" title="${esc(c)}" style="cursor:pointer;width:42px;height:42px;border-radius:8px;background:${c};border:2px solid ${chosen===c?'#fff':'rgba(255,255,255,.15)'};box-shadow:0 0 12px ${c}66;position:relative;font-family:var(--mono);font-size:9px;color:#000;font-weight:800">${chosen===c?'<i class="fa-solid fa-check" style="color:#fff;text-shadow:0 0 4px #000"></i>':''}</button>`).join('');
    swBox.querySelectorAll('[data-pal-i]').forEach(b=>b.onclick=()=>{
      chosen=palette[parseInt(b.dataset.palI,10)];
      renderSwatches();
    });
    if(applyRow)applyRow.style.display='flex';
  };
  btn.onclick=async()=>{
    if(!me.avatarUrl){toast('Upload an avatar first','info');return;}
    btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Reading…';
    try{
      palette=await _extractAvatarPalette(me.avatarUrl);
      chosen=palette[0];
      renderSwatches();
      toast(palette.length+' colors extracted','success');
    }catch(e){
      console.warn('palette extract failed',e);
      toast('Could not read avatar colors: '+(e.message||'error'),'error');
      if(swBox){swBox.style.display='flex';swBox.innerHTML='<div style="font-size:11px;color:var(--rose);font-family:var(--mono)">Failed: '+esc(e.message||'unknown')+'</div>';}
    }finally{
      btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-palette"></i> Suggest Colors';
    }
  };

  document.querySelectorAll('[data-paletteapply]').forEach(b=>b.onclick=()=>{
    if(!palette.length){toast('Click Suggest Colors first','info');return;}
    const target=b.dataset.paletteapply;
    if(target==='all'){
      const a=palette[0]||'#00f2ff';
      const ban=palette[1]||a;
      const ring=palette[2]||palette[0]||a;
      const card=palette[3]||'#0d0a22';
      setField('setAccentCol','setAccentColText',a);
      setField('setBannerCol','setBannerColText',ban);
      setField('setRingCol','setRingColText',ring);
      setField('setCardBg','setCardBgText',card);
      toast('Theme applied — preview updated','success');
      return;
    }
    const v=chosen||palette[0];
    if(target==='accent')setField('setAccentCol','setAccentColText',v);
    else if(target==='banner')setField('setBannerCol','setBannerColText',v);
    else if(target==='ring')setField('setRingCol','setRingColText',v);
    else if(target==='card')setField('setCardBg','setCardBgText',v);
  });
}

function _shrinkImage(file,maxSize=256,quality=0.82){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      const s=Math.min(maxSize/img.width,maxSize/img.height,1);
      const w=Math.round(img.width*s),h=Math.round(img.height*s);
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      try{resolve(c.toDataURL('image/jpeg',quality));}catch(e){reject(e);}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Could not load image'));};
    img.src=url;
  });
}

function _fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onload=()=>resolve(fr.result);
    fr.onerror=()=>reject(new Error('FileReader failed'));
    fr.readAsDataURL(file);
  });
}

async function uploadAvatar(input){
  const file=input.files[0];if(!file)return;
  if(file.size>10*1024*1024){toast('Max 10MB','error');input.value='';return;}
  if(!file.type.startsWith('image/')){toast('Must be an image','error');input.value='';return;}
  toast('Uploading avatar…','info');
  let url='';
  
  try{
    url=await _shrinkImage(file,256,0.82);
    if(url.length>700000){url=await _shrinkImage(file,180,0.72);}
    if(url.length>500000){url=await _shrinkImage(file,128,0.65);}
  }catch(e){
    console.error('shrink failed',e);
    toast('Could not process image: '+(e.message||e),'error');
    input.value='';return;
  }

  (async()=>{
    try{
      const ext=(file.name.split('.').pop()||'png').toLowerCase().replace(/[^a-z0-9]/g,'');
      const ref=storage.ref('avatars/'+me.username+'_'+Date.now()+'.'+(ext||'png'));
      await ref.put(file);
      const bigUrl=await ref.getDownloadURL();
      
      me.avatarUrl=bigUrl;
      await db.ref('users/'+me.username).update({avatarUrl:bigUrl});
      refreshMe();
      const prev=document.getElementById('avPreview');
      if(prev)prev.innerHTML=`<img src="${esc(bigUrl)}" style="width:100%;height:100%;object-fit:cover"/>`;
    }catch(e){console.warn('Storage upload skipped:',e.code||e.message);}
  })();
  
  try{
    me.avatarUrl=url;
    const updates={avatarUrl:url};

    if(!me.profileAccent){
      try{
        const palette=await _extractAvatarPalette(url);
        if(palette&&palette.length){

          const pool=palette.slice(0,Math.min(3,palette.length));
          const picked=pool[Math.floor(Math.random()*pool.length)];
          updates.profileAccent=picked;

const _BKP_PATHS=['users','usernames','uidIndex','emailIndex','servers','userServers','messages','dmChannels','dmMessages','userDms','notifications','lastRead','presence','typing','audit','strikes','automod','changelog','changelogPosters','applications','serverApplications','suggestions','userSuggestions','channelBoards','threads','countingLeaderboard','serverState','invites','serverInvites','reactionPanels'];

async function _bkpFetchSnapshot(){
  const out={meta:{ts:Date.now(),version:APP_VERSION_TAG||'unknown',by:me.username}};
  let totalKeys=0;
  for(const p of _BKP_PATHS){
    try{
      const s=await db.ref(p).once('value');
      if(s.exists()){
        const v=s.val();
        out[p]=v;
        if(v&&typeof v==='object')totalKeys+=Object.keys(v).length;
      }
    }catch(e){console.warn('[bkp] fetch failed for',p,e&&e.message);}
  }
  out.meta.totalTopLevelKeys=totalKeys;
  return out;
}

async function bkpDownload(){
  if(me.username!==OWNER){toast('Owner only','error');return;}
  toast('Building snapshot…','info');
  try{
    const snap=await _bkpFetchSnapshot();
    const json=JSON.stringify(snap,null,2);
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const stamp=new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
    a.href=url;a.download=`peakchat-backup-${stamp}.json`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast(`Downloaded backup (${(json.length/1024).toFixed(1)}KB, ${snap.meta.totalTopLevelKeys} records)`,'success');
  }catch(e){console.error('bkpDownload',e);toast('Backup failed: '+(e.message||'error'),'error');}
}

async function bkpAutoLocalTick(){
  if(me.username!==OWNER)return;
  if(localStorage.getItem('qc_bkp_auto')!=='1')return;
  try{
    const snap=await _bkpFetchSnapshot();
    const json=JSON.stringify(snap);
    
    const idx=parseInt(localStorage.getItem('qc_bkp_idx')||'0')%3;
    localStorage.setItem('qc_bkp_slot'+idx,json);
    localStorage.setItem('qc_bkp_slot'+idx+'_ts',String(Date.now()));
    localStorage.setItem('qc_bkp_idx',String(idx+1));
    console.log('[bkp] auto-saved slot',idx,'-',(json.length/1024).toFixed(1),'KB');
  }catch(e){console.warn('[bkp] auto-save failed',e&&e.message);}
}

function _bkpListLocal(){
  const slots=[];
  for(let i=0;i<3;i++){
    const raw=localStorage.getItem('qc_bkp_slot'+i);
    const ts=parseInt(localStorage.getItem('qc_bkp_slot'+i+'_ts')||'0');
    if(raw&&ts){slots.push({i,ts,size:raw.length});}
  }
  slots.sort((a,b)=>b.ts-a.ts);
  return slots;
}

async function bkpRestoreFromJson(json,sourceLabel){
  if(me.username!==OWNER){toast('Owner only','error');return;}
  let parsed=null;
  try{parsed=typeof json==='string'?JSON.parse(json):json;}
  catch(e){toast('Invalid JSON: '+e.message,'error');return;}
  if(!parsed||typeof parsed!=='object'){toast('Snapshot is empty','error');return;}
  
  if(!parsed.meta||!parsed.users){
    const proceed=await uiConfirm('This file doesn\'t look like a PC snapshot (missing meta/users). Restore anyway?',{title:'Suspicious snapshot',okLabel:'Restore',danger:true});
    if(!proceed)return;
  }
  const stamp=parsed.meta?new Date(parsed.meta.ts).toLocaleString():'(unknown)';
  const confirmTxt=`Restore from ${sourceLabel} (saved ${stamp})?\n\nThis will OVERWRITE every record currently in your Firebase DB. Cannot be undone.`;
  const ok=await uiConfirm(confirmTxt,{title:'Confirm Restore',okLabel:'Restore Now',danger:true});
  if(!ok)return;
  toast('Restoring… don\'t close this tab','info');
  
  let okCount=0,failCount=0;
  for(const p of _BKP_PATHS){
    if(parsed[p]===undefined)continue;
    try{
      await db.ref(p).set(parsed[p]);
      okCount++;
    }catch(e){failCount++;console.warn('[bkp] restore failed for',p,e&&e.message);}
  }
  toast(`Restore done: ${okCount} paths restored${failCount?', '+failCount+' failed':''}`,failCount?'error':'success');
  
  setTimeout(()=>location.reload(),1500);
}

async function bkpShowRestoreLocalPicker(){
  const slots=_bkpListLocal();
  if(!slots.length){toast('No local snapshots yet','info');return;}
  const rows=slots.map(s=>`<div class="ch-row" data-bkp-pick="${s.i}" style="padding:10px;cursor:pointer">
    <div style="flex:1"><div style="font-weight:700;font-family:var(--grotesk)">Slot ${s.i+1} · ${(s.size/1024).toFixed(1)} KB</div><div style="font-size:11px;color:var(--muted);font-family:var(--mono)">${new Date(s.ts).toLocaleString()}</div></div>
    <i class="fa-solid fa-chevron-right" style="color:var(--muted)"></i></div>`).join('');
  openModal({html:`<div class="modal-title">Pick a Local Snapshot</div><div class="modal-sub">Most recent first.</div>${rows}`,footer:[{label:'Cancel',cls:'btn-ghost',fn:closeModal}]});
  setTimeout(()=>{
    document.querySelectorAll('[data-bkp-pick]').forEach(r=>r.onclick=()=>{
      const idx=parseInt(r.dataset.bkpPick);
      const raw=localStorage.getItem('qc_bkp_slot'+idx);
      closeModal();
      if(raw)bkpRestoreFromJson(raw,'localStorage slot '+(idx+1));
    });
  },80);
}

let _tutStep=0;
function startTutorial(firstTime){
  _tutStep=0;
  _showTutStep(firstTime);
}
function _showTutStep(firstTime){
  const step=TUTORIAL_STEPS[_tutStep];
  if(!step){_endTutorial(firstTime);return;}
  
  document.getElementById('tutOverlay')?.remove();
  
  const overlay=document.createElement('div');
  overlay.id='tutOverlay';
  overlay.className='tut-overlay';
  const cutoutStyle=_computeTutCutout(step.target);

  const showSkip=!firstTime;
  overlay.innerHTML=`
    <div class="tut-dim" style="${cutoutStyle.clipPath?'clip-path:'+cutoutStyle.clipPath+';':''}"></div>
    ${step.target?`<div class="tut-ring" style="left:${cutoutStyle.x}px;top:${cutoutStyle.y}px;width:${cutoutStyle.w}px;height:${cutoutStyle.h}px"></div>`:''}
    <div class="tut-card" style="${cutoutStyle.cardPos}">
      <div class="tut-step">Step ${_tutStep+1} / ${TUTORIAL_STEPS.length}${firstTime?' · required':''}</div>
      <div class="tut-title"><i class="fa-solid ${step.icon}" style="color:var(--cyan);margin-right:8px"></i>${esc(step.title)}</div>
      <div class="tut-body">${step.body}</div>
      <div class="tut-dots">${TUTORIAL_STEPS.map((_,i)=>`<span class="tut-dot${i===_tutStep?' on':''}"></span>`).join('')}</div>
      <div class="tut-btns">
        ${_tutStep>0?'<button class="btn-ghost" id="tutPrev">Back</button>':''}
        ${showSkip?'<button class="btn-ghost" id="tutSkip">Skip</button>':''}
        <button class="btn-sub" id="tutNext">${_tutStep===TUTORIAL_STEPS.length-1?'Finish':'Next'} <i class="fa-solid fa-arrow-right" style="margin-left:4px"></i></button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('tutNext').onclick=()=>{_tutStep++;_showTutStep(firstTime);};
  document.getElementById('tutPrev')?.addEventListener('click',()=>{_tutStep=Math.max(0,_tutStep-1);_showTutStep(firstTime);});
  if(showSkip)document.getElementById('tutSkip').onclick=()=>{_endTutorial(firstTime);};
}
function _computeTutCutout(selector){
  const res={x:0,y:0,w:0,h:0,clipPath:'',cardPos:'top:50%;left:50%;transform:translate(-50%,-50%)'};
  if(!selector)return res;
  const el=document.querySelector(selector);
  if(!el)return res;
  const r=el.getBoundingClientRect();
  res.x=r.left-6;res.y=r.top-6;res.w=r.width+12;res.h=r.height+12;
  // Card position: place next to the target
  const vw=window.innerWidth,vh=window.innerHeight;
  const spaceRight=vw-r.right,spaceLeft=r.left,spaceBelow=vh-r.bottom,spaceAbove=r.top;
  if(spaceRight>400){res.cardPos=`top:${Math.max(20,Math.min(vh-280,r.top))}px;left:${r.right+20}px`;}
  else if(spaceLeft>400){res.cardPos=`top:${Math.max(20,Math.min(vh-280,r.top))}px;right:${vw-r.left+20}px`;}
  else if(spaceBelow>260){res.cardPos=`top:${r.bottom+20}px;left:${Math.max(20,Math.min(vw-380,r.left))}px`;}
  else if(spaceAbove>260){res.cardPos=`bottom:${vh-r.top+20}px;left:${Math.max(20,Math.min(vw-380,r.left))}px`;}
  return res;
}

}

          const dm=c.val()||{};const ps=dm.participants||[];
          if(ps.includes(u)){
            const rem=ps.filter(x=>x!==u);
            if(!rem.length){
              dmJobs.push(db.ref('dmChannels/'+c.key).remove());
              dmJobs.push(db.ref('dmMessages/'+c.key).remove());
            }else{
              dmJobs.push(db.ref('dmChannels/'+c.key+'/participants').set(rem));
            }
          }
        });
        await Promise.all(dmJobs);
        
        const srvSnap=await db.ref('servers').once('value');
        const srvJobs=[];
        srvSnap.forEach(c=>{
          const sv=c.val()||{};
          if(sv.members&&sv.members[u])srvJobs.push(db.ref('servers/'+c.key+'/members/'+u).remove());
          if(sv.owner===u&&c.key!==QS_ID){
            
            const others=Object.keys(sv.members||{}).filter(k=>k!==u);
            if(others.length){
              srvJobs.push(db.ref('servers/'+c.key+'/owner').set(others[0]));
              srvJobs.push(db.ref('servers/'+c.key+'/members/'+others[0]+'/role').set('owner'));
            }else{
              srvJobs.push(db.ref('servers/'+c.key).remove());
              srvJobs.push(db.ref('messages/'+c.key).remove());
            }
          }
        });
        await Promise.all(srvJobs);
        
        const userSnap=await db.ref('users').once('value');
        const frJobs=[];
        userSnap.forEach(c=>{
          const usr=c.val()||{};
          if(Array.isArray(usr.friends)&&usr.friends.includes(u)){
            frJobs.push(db.ref('users/'+c.key+'/friends').set(usr.friends.filter(f=>f!==u)));
          }
        });
        await Promise.all(frJobs);
        
        await db.ref('users/'+u).remove();
        await db.ref('usernames/'+u.toLowerCase()).remove();
        await db.ref('notifications/'+u).remove();
        await db.ref('presence/'+u).remove();
        await db.ref('lastRead/'+u).remove();
        await db.ref('typing/'+u).remove();
        
        try{await auth.currentUser.delete();}
        catch(e){
          if(e.code==='auth/requires-recent-login'){
            toast('Please re-login then try again to finalize account deletion','error');
          }else{
            console.warn('auth delete failed:',e);
          }
        }
        toast('Account deleted','success');
        closeModal();
        setTimeout(()=>doLogout(),500);
      }catch(e){
        toast('Delete failed: '+(e.message||e.code||e),'error');
      }
    }},{label:'Cancel',cls:'btn-ghost',fn:closeModal}]
  });
}

  document.querySelectorAll('.stab[data-stab]').forEach(b=>b.addEventListener('click',()=>{

    b.classList.add('on');document.getElementById(b.dataset.stab)?.classList.add('on');
  }));
  document.getElementById('copyInvBtn')?.addEventListener('click',()=>copyToClipboard(srvData.inviteCode||'','Copied!','Invite: '+(srvData.inviteCode||'')));
  document.getElementById('regenInvBtn')?.addEventListener('click',async()=>{
    if(!(await uiConfirm('Regenerate invite code? Old code will stop working.',{title:'Regenerate Invite'})))return;
    const nc=genInvite();
    const oldCode=srvData.inviteCode;
    // Atomic: rotate the server's code, drop the stale row in /serverInvites,
    // and write the fresh one — keeps the global index in sync so old codes
    // can never resolve to a server.
    const updates={};
    updates['servers/'+G.srvId+'/inviteCode']=nc;
    if(oldCode)updates['serverInvites/'+oldCode]=null;
    updates['serverInvites/'+nc]={srvId:G.srvId,name:srvData.name,owner:srvData.owner||me.username,createdAt:Date.now(),iconUrl:srvData.iconUrl||'',iconEmoji:srvData.iconEmoji||''};
    await db.ref().update(updates);
    srvData.inviteCode=nc;
    const el=document.getElementById('srvInvInp');if(el)el.value=nc;
    await logAudit('invite_regen',{newCode:nc});
    toast('New code: '+nc,'success');

  // Access tab: render existing application questions + add-row button
  (function setupAccessTab(){
    const list=document.getElementById('srvAppQList');
    if(!list)return;
    const existing=Array.isArray(srvData.appQuestions)?srvData.appQuestions:[];
    const addRow=(val='')=>{
      if(list.children.length>=5){toast('Max 5 questions','info');return;}
      const row=document.createElement('div');
      row.style.cssText='display:flex;gap:6px;align-items:center';
      row.innerHTML=`<input class="modal-inp srv-app-q" placeholder="e.g. Why do you want to join?" maxlength="160" style="flex:1;margin:0" value="${eattr(val)}"/><button type="button" class="btn-ghost srv-q-rm" style="padding:6px 10px;font-size:11px;color:var(--rose)"><i class="fa-solid fa-xmark"></i></button>`;
      row.querySelector('.srv-q-rm').onclick=()=>row.remove();
      list.appendChild(row);
    };
    if(existing.length)existing.forEach(q=>addRow(q));
    else addRow();
    document.getElementById('srvAddQBtn')?.addEventListener('click',()=>addRow(''));
  })();
  document.getElementById('ssAddChBtn')?.addEventListener('click',()=>{closeModal();showCreateCh();});
  document.getElementById('ssAddCatBtn')?.addEventListener('click',()=>{closeModal();showCreateCat();});
  document.getElementById('transferOwnBtn')?.addEventListener('click',showTransferOwn);
  document.getElementById('purgeBtn')?.addEventListener('click',confirmPurge);
  document.getElementById('deleteSrvBtn')?.addEventListener('click',confirmDeleteSrv);
  document.querySelectorAll('[data-accent]').forEach(s=>s.addEventListener('click',()=>{
    document.querySelectorAll('[data-accent]').forEach(x=>x.classList.remove('on'));
    s.classList.add('on');
  }));
  // Server icon emoji/url picker
  const srvPrev=document.getElementById('srvIconPreview');
  const srvUrlInp=document.getElementById('srvIconUrl');
  function refreshSrvIconPrev(){
    if(!srvPrev)return;
    const em=srvPrev.dataset.emoji||'';
    const u=srvUrlInp?.value.trim()||'';
    if(em){srvPrev.textContent=em;}
    else if(u){srvPrev.innerHTML=`<img src="${esc(u)}" style="width:52px;height:52px;object-fit:cover"/>`;}
    else{srvPrev.textContent='⚡';}
  }
  document.getElementById('srvPickEmojiBtn')?.addEventListener('click',()=>{
    pickEmoji().then(em=>{if(em){srvPrev.dataset.emoji=em;if(srvUrlInp)srvUrlInp.value='';refreshSrvIconPrev();}});
  });
  document.getElementById('srvClearIconBtn')?.addEventListener('click',()=>{
    if(srvPrev)srvPrev.dataset.emoji='';
    if(srvUrlInp)srvUrlInp.value='';
    refreshSrvIconPrev();
  });
  srvUrlInp?.addEventListener('input',refreshSrvIconPrev);
  document.getElementById('ssMemSearch')?.addEventListener('input',e=>loadMemList(e.target.value));
  document.getElementById('ssAddRoleBtn')?.addEventListener('click',()=>showRoleEditor(null));
  loadBanList();loadSsChList();loadSsCatList();loadMemList('');loadAuditList();loadRolesList();
  loadAutomodCfg();loadStrikesList();loadServerApplicationsList();
}

      document.querySelectorAll('.settings-panel').forEach(x=>x.classList.remove('on'));
      const btn=document.querySelector(`.stab[data-stab="${tabId}"]`);
      const panel=document.getElementById(tabId);
      if(btn)btn.classList.add('on');

    }catch(e){}

}

// ─── CUSTOM PINGABLE ROLES ───
// ─── UNIFIED ROLES SYSTEM ──────────────────────────────────────────────
// Built-in (owner/admin/officer/moderator/member) and custom roles live in
// one list, ordered by `level` (high to low). Hierarchy = the highest role
// you have determines your color and which permissions apply.

// Resolve the highest-priority color for a username inside the current
// server. Combines the member's base role with their assigned custom roles
// and returns the color of the highest-level one. Falls back to the
// hue() pseudo-random color when there's no role data (DMs / unknown users).
// Render a styled name span. Honors per-user `nameStyle` preference:
//   - 'solid'        → plain text in baseColor (default; same as before)
//   - 'gradient'     → linear-gradient from nameGradientFrom → nameGradientTo
//   - 'holographic'  → animated rainbow shimmer (uses .name-holo CSS class)
// Profile prefs live on /users/<u>/{nameStyle,nameGradientFrom,nameGradientTo}.
function styledName(username,displayName,baseColor){
  const dn=displayName||username||'?';
  const escDn=esc(dn);
  if(!username)return escDn;
  // Read live cache first, then fall back to me.* for self
  const prof=(window._userProfiles&&window._userProfiles[username])||{};
  const isMe=username===me.username;
  const style=(isMe?me.nameStyle:prof.nameStyle)||'solid';
  if(style==='solid'||style==='')return escDn;
  if(style==='holographic'){
    return `<span class="name-holo">${escDn}</span>`;
  }
  if(style==='gradient'){
    const from=(isMe?me.nameGradientFrom:prof.nameGradientFrom)||baseColor||(isMe?me.profileAccent:prof.profileAccent)||hue(username);
    const to=(isMe?me.nameGradientTo:prof.nameGradientTo)||'#ff4fd8';
    return `<span class="name-gradient" style="background:linear-gradient(90deg,${esc(from)},${esc(to)})">${escDn}</span>`;
  }
  return escDn;
}

function roleColorFor(username){
  if(!username)return '#9ca3af';
  // Outside a server context — no role data, use deterministic hue
  if(!G.srvId||!srvData||!srvData.members)return hue(username);
  const m=srvData.members[username];
  if(!m)return hue(username);
  let best=null;
  // Built-in role
  const baseKey=m.role||'member';
  const base=ROLES[baseKey];
  if(base){
    const baseCol=(srvData.builtinColors&&srvData.builtinColors[baseKey])||base.color;
    best={level:base.level||0,color:baseCol};
  }
  // Custom roles — pick the highest-level one with a defined color
  const customs=srvData.customRoles||[];
  (m.customRoles||[]).forEach(rid=>{
    const r=customs.find(x=>x.id===rid);
    if(!r)return;
    const lvl=typeof r.level==='number'?r.level:30;
    if(!best||lvl>best.level)best={level:lvl,color:r.color||'#00f2ff'};
  });
  return (best&&best.color)||hue(username);
}

function _allRolesOrdered(){
  const built=Object.entries(ROLES).map(([key,r])=>({
    id:'__'+key,builtInKey:key,isBuiltIn:true,
    name:r.name,
    color:(srvData.builtinColors&&srvData.builtinColors[key])||r.color,
    // Per-server level override (set via drag-reorder)
    level:(srvData.builtinLevels&&typeof srvData.builtinLevels[key]==='number')?srvData.builtinLevels[key]:r.level,
    perms:{...r.perms},mentionable:false,hoist:true
  }));
  const custom=(srvData.customRoles||[]).map((r,i)=>({
    id:r.id,isBuiltIn:false,
    name:r.name,color:r.color||'#00f2ff',
    level:typeof r.level==='number'?r.level:(40-i),
    perms:r.perms||{},mentionable:r.mentionable!==false,
    hoist:!!r.hoist
  }));
  return [...built,...custom].sort((a,b)=>(b.level||0)-(a.level||0));
}

        <div style="width:14px;height:14px;border-radius:50%;background:${col};box-shadow:0 0 8px ${col};flex-shrink:0"></div>
        <div class="role-body" style="flex:1;min-width:0;cursor:pointer">
          <div style="font-weight:700;color:${col};text-shadow:0 0 6px ${col}66;display:flex;align-items:center">${esc(r.name)}${tag}${hoistTag}</div>
          <div style="font-size:10px;color:var(--muted);font-family:var(--mono)">level ${r.level} · ${cnt} member${cnt===1?'':'s'}${r.mentionable?' · mentionable':''}</div>
        </div>
        <div style="display:flex;gap:2px">
          <button class="role-up btn-ghost" data-role-up="${eattr(r.id)}" ${canUp?'':'disabled'} style="padding:6px 8px;font-size:10px;opacity:${canUp?1:0.3}" title="Move up"><i class="fa-solid fa-chevron-up"></i></button>
          <button class="role-dn btn-ghost" data-role-dn="${eattr(r.id)}" ${canDn?'':'disabled'} style="padding:6px 8px;font-size:10px;opacity:${canDn?1:0.3}" title="Move down"><i class="fa-solid fa-chevron-down"></i></button>
        </div>
        <i class="fa-solid fa-chevron-right" style="color:var(--muted);font-size:11px"></i>
      </div>`;
    }).join('')}</div>`;
  // Row-body click opens the editor (the body now has its own cursor:pointer)
  el.querySelectorAll('.role-body').forEach(body=>{
    body.onclick=()=>{
      const row=body.closest('[data-role-id]');
      if(!row)return;
      const id=row.dataset.roleId;
      const r=all.find(x=>x.id===id);if(r)showRoleEditor(r);
    };
  });
  // Up/Down arrow buttons — explicit, always works (the drag was fragile)
  el.querySelectorAll('[data-role-up]').forEach(btn=>{
    btn.onclick=async e=>{
      e.stopPropagation();
      const id=btn.dataset.roleUp;
      const idx=all.findIndex(r=>r.id===id);
      if(idx<=0)return;
      await _swapRoleLevels(all,id,all[idx-1].id);
    };
  });
  el.querySelectorAll('[data-role-dn]').forEach(btn=>{
    btn.onclick=async e=>{
      e.stopPropagation();
      const id=btn.dataset.roleDn;
      const idx=all.findIndex(r=>r.id===id);
      if(idx<0||idx>=all.length-1)return;
      await _swapRoleLevels(all,id,all[idx+1].id);
    };
  });
  // ── Drag-to-reorder ── drop role A onto B → swap their levels.
  // Drag is initiated from anywhere on the row but the cursor only shows
  // "grab" over the grip handle so it's clear that's the intended target.
  let dragId=null;
  el.querySelectorAll('.role-drag-row').forEach(row=>{
    row.addEventListener('dragstart',e=>{
      dragId=row.dataset.roleId;
      row.style.opacity='.45';
      try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId);}catch(_){}
    });
    row.addEventListener('dragend',()=>{row.style.opacity='';dragId=null;});
    row.addEventListener('dragover',e=>{
      e.preventDefault();
      try{e.dataTransfer.dropEffect='move';}catch(_){}
      if(dragId&&row.dataset.roleId!==dragId)row.style.background='rgba(179, 136, 255,.12)';
    });
    row.addEventListener('dragleave',()=>{row.style.background='';});
    row.addEventListener('drop',async e=>{
      e.preventDefault();
      row.style.background='';
      let fromId=dragId;
      try{if(!fromId)fromId=e.dataTransfer.getData('text/plain');}catch(_){}
      const toId=row.dataset.roleId;
      if(!fromId||!toId||fromId===toId)return;
      await _swapRoleLevels(all,fromId,toId);
    });
  });
}

// Swap two roles' hierarchy levels. Built-ins use /servers/<id>/builtinLevels/<key>
// override; custom roles get their level field updated in the customRoles array.
async function _swapRoleLevels(allRoles,fromId,toId){
  const a=allRoles.find(r=>r.id===fromId);
  const b=allRoles.find(r=>r.id===toId);
  if(!a||!b)return;
  const updates={};
  let pendingCustom=null;
  const setLevel=(role,newLvl)=>{
    if(role.isBuiltIn){
      updates['servers/'+G.srvId+'/builtinLevels/'+role.builtInKey]=newLvl;
    }else{
      const arr=pendingCustom||[...(srvData.customRoles||[])];
      const i=arr.findIndex(x=>x.id===role.id);
      if(i>=0){arr[i]={...arr[i],level:newLvl};pendingCustom=arr;}
    }
  };
  setLevel(a,b.level);
  setLevel(b,a.level);
  if(pendingCustom){updates['servers/'+G.srvId+'/customRoles']=pendingCustom;}
  try{
    await db.ref().update(updates);
    srvData.builtinLevels=srvData.builtinLevels||{};
    if(a.isBuiltIn)srvData.builtinLevels[a.builtInKey]=b.level;
    if(b.isBuiltIn)srvData.builtinLevels[b.builtInKey]=a.level;
    if(pendingCustom)srvData.customRoles=pendingCustom;
    loadRolesList();
    toast('Hierarchy updated','success');
  }catch(e){console.error('reorder roles',e);toast('Reorder failed: '+(e.message||'unknown'),'error');}
}

    if(r)showCustomRoleEditor(r);
  });
  el.querySelectorAll('[data-del-crole]').forEach(b=>b.onclick=async()=>{

    await db.ref('servers/'+G.srvId+'/customRoles').set(roles);
    // Strip from all members
    const memSnap=await db.ref('servers/'+G.srvId+'/members').once('value');
    const updates={};
    memSnap.forEach(c=>{
      const cur=(c.val().customRoles||[]).filter(x=>x!==rid);
      updates['servers/'+G.srvId+'/members/'+c.key+'/customRoles']=cur;
    });
    if(Object.keys(updates).length)await db.ref().update(updates);
    // Resolve the deleted role's display name from the pre-removal snapshot
    const snap=window.__lastRoleSnapshot||[];
    const gone=snap.find(x=>x.id===rid);
    srvData.customRoles=roles;
    await logAudit('role_delete',{target:'@'+(gone?.name||rid)});
    toast('Role deleted','success');
    loadCustomRolesList();loadMemList(document.getElementById('ssMemSearch')?.value||'');
  });
  
  window.__lastRoleSnapshot=[...(srvData.customRoles||[])];
}

async function _saveBuiltinColor(roleKey,color){
  if(me.username!==OWNER&&me.role!=='owner'){toast('Owner only','error');return false;}
  try{
    await db.ref('servers/'+G.srvId+'/builtinColors/'+roleKey).set(color);
    srvData.builtinColors=srvData.builtinColors||{};
    srvData.builtinColors[roleKey]=color;
    return true;
  }catch(e){
    console.error('_saveBuiltinColor',e);
    toast('Color save failed: '+(e.message||e.code||'error'),'error');
    return false;
  }
}

function showMemberRolePicker(username,q){
  const mem=(srvData.members||{})[username]||{};
  const customRoles=srvData.customRoles||[];
  const assigned=new Set(mem.customRoles||[]);
  const curRole=mem.role||'member';
  const myLvl=(ROLES[me.role]||ROLES.member).level;
  const iAmOwner=me.role==='owner';
  const tLvl=isPCOwner(username)?999:(ROLES[curRole]||ROLES.member).level;
  const isMe=username===me.username;

  const canEditBase=!isMe&&(iAmOwner?curRole!=='owner':tLvl<myLvl);
  const baseOpts=Object.keys(ROLES).filter(r=>{
    if(r==='owner')return false;
    return iAmOwner?true:(ROLES[r].level<myLvl);
  });
  openModal({wide:true,html:`<div class="modal-title">Roles — ${esc((window._userProfiles?.[username]||{}).displayName||username)}</div>
    <div class="modal-sub">Set their rank and toggle any custom roles. Permissions and color come from their highest role.</div>

    <div style="margin-top:14px;padding:12px;background:rgba(0,0,0,.3);border:1px solid rgba(179, 136, 255,.1);border-radius:10px">
      <div style="font-family:var(--grotesk);font-size:13px;font-weight:700;margin-bottom:8px">Base Rank</div>
      ${canEditBase?`<div style="display:flex;flex-wrap:wrap;gap:6px">${baseOpts.map(r=>{
        const rd=ROLES[r];
        const on=r===curRole;
        return `<button type="button" class="btn-ghost" data-base-role="${r}" style="padding:6px 12px;font-size:11px;border:1px solid ${on?rd.color:'rgba(179, 136, 255,.2)'};background:${on?rd.color+'22':'transparent'};color:${on?rd.color:'var(--text)'}">${esc(rd.name)}</button>`;
      }).join('')}</div>`:`<div style="font-size:12px;color:var(--muted);font-family:var(--mono)">${isMe?'You can\'t change your own rank.':(curRole==='owner'?'Server owner — locked.':'Out of reach — they outrank you.')}</div>`}
    </div>

    <div style="margin-top:14px;padding:12px;background:rgba(0,0,0,.3);border:1px solid rgba(179, 136, 255,.1);border-radius:10px">
      <div style="font-family:var(--grotesk);font-size:13px;font-weight:700;margin-bottom:8px">Custom Roles ${customRoles.length?'':'<span style="color:var(--muted);font-size:11px;font-weight:400">— none defined yet</span>'}</div>
      ${customRoles.length?`<div id="memRolePickerList" style="display:flex;flex-direction:column;gap:6px">${customRoles.map(r=>`
        <label class="perm-row" style="cursor:pointer;margin:0">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:14px;height:14px;border-radius:50%;background:${r.color};box-shadow:0 0 8px ${r.color}"></div>
            <div><div class="perm-lbl" style="color:${r.color}">${esc(r.name)}</div><div class="perm-desc">${r.mentionable!==false?'Mentionable':'Not mentionable'}</div></div>
          </div>
          <label class="toggle"><input type="checkbox" data-crole-toggle="${esc(r.id)}" ${assigned.has(r.id)?'checked':''}/><span class="toggle-slider"></span></label>
        </label>
      `).join('')}</div>`:`<div style="font-size:11px;color:var(--muted);font-family:var(--mono)">Create one in the Roles tab.</div>`}
    </div>`,
    footer:[
      {label:'Save',cls:'btn-sub',fn:async()=>{
        const updates={};
        
        if(canEditBase&&window._pendingBaseRole&&window._pendingBaseRole!==curRole){
          updates['servers/'+G.srvId+'/members/'+username+'/role']=window._pendingBaseRole;
        }
        
        const newList=[];
        document.querySelectorAll('[data-crole-toggle]').forEach(cb=>{if(cb.checked)newList.push(cb.dataset.croleToggle);});
        const oldList=mem.customRoles||[];
        const changed=newList.length!==oldList.length||newList.some(x=>!oldList.includes(x));
        if(changed)updates['servers/'+G.srvId+'/members/'+username+'/customRoles']=newList;
        if(!Object.keys(updates).length){closeModal();return;}
        try{
          await db.ref().update(updates);
          if(srvData.members&&srvData.members[username]){
            if(window._pendingBaseRole)srvData.members[username].role=window._pendingBaseRole;
            srvData.members[username].customRoles=newList;
          }
          if(window._pendingBaseRole&&window._pendingBaseRole!==curRole){
            await logAudit('role_change',{target:username,role:window._pendingBaseRole});
          }
          toast('Roles updated','success');
          window._pendingBaseRole=null;
          closeModal();
          loadMemList(q||'');
          loadRolesList();
        }catch(e){console.error('role update failed',e);toast('Save failed: '+(e.message||'unknown'),'error');}
      }},
      {label:'Cancel',cls:'btn-ghost',fn:()=>{window._pendingBaseRole=null;closeModal();}}
    ]
  });
  
  window._pendingBaseRole=curRole;
  document.querySelectorAll('[data-base-role]').forEach(b=>b.onclick=()=>{
    window._pendingBaseRole=b.dataset.baseRole;
    document.querySelectorAll('[data-base-role]').forEach(x=>{
      const rk=x.dataset.baseRole;
      const rd=ROLES[rk];
      const on=rk===window._pendingBaseRole;
      x.style.border='1px solid '+(on?rd.color:'rgba(179, 136, 255,.2)');
      x.style.background=on?rd.color+'22':'transparent';
      x.style.color=on?rd.color:'var(--text)';
    });
  });
}

async function saveSrvSettings(){
  // Re-entry guard so double-click on Save doesn't fire twice
  if(window._srvSaveInFlight)return;
  window._srvSaveInFlight=true;
  try{
    const patch={};
    // Only write fields that ACTUALLY changed — the old code wrote every
    // input value unconditionally, which (a) bloated the audit log, and
    // (b) silently overwrote good data with empty strings when an input
    // was somehow missing. This is the actual "can't save changes" fix.
    const name=document.getElementById('srvNameInp')?.value.trim();
    if(name&&name!==srvData.name)patch.name=name;
    const desc=document.getElementById('srvDescInp')?.value.trim();
    if(desc!==undefined&&desc!==(srvData.description||''))patch.description=desc;
    const slow=parseInt(document.getElementById('srvSlowInp')?.value)||0;
    if(slow!==(srvData.slowMode||0))patch.slowMode=slow;
    const wc=document.getElementById('srvWelcomeCh')?.value;
    if(wc&&wc!==srvData.welcomeChannel)patch.welcomeChannel=wc;
    const wm=document.getElementById('srvWelcomeMsg')?.value.trim();
    if(wm!==undefined&&wm!==(srvData.welcomeMessage||''))patch.welcomeMessage=wm;
    const vf=document.getElementById('srvVerif')?.value;
    if(vf&&vf!==srvData.verificationLevel)patch.verificationLevel=vf;
    const ic=document.getElementById('srvIconUrl')?.value.trim();
    if(ic!==undefined&&ic!==(srvData.iconUrl||''))patch.iconUrl=ic;
    const iconEmoji=document.getElementById('srvIconPreview')?.dataset.emoji||'';
    if(iconEmoji!==(srvData.iconEmoji||''))patch.iconEmoji=iconEmoji;
    const acc=document.querySelector('[data-accent].on');
    if(acc&&acc.dataset.accent!==srvData.accent)patch.accent=acc.dataset.accent;
    const am=document.getElementById('modAutomod');
    if(am&&am.checked!==(srvData.explicitFilter!==false))patch.explicitFilter=am.checked;
    const rt=document.getElementById('modRate');
    if(rt&&rt.checked!==(srvData.rateLimitEnabled!==false))patch.rateLimitEnabled=rt.checked;
    const bd=document.getElementById('modBlockDM');
    if(bd&&bd.checked!==!!srvData.blockDMs)patch.blockDMs=bd.checked;
    const lk=document.getElementById('modLock');
    if(lk&&lk.checked!==!!srvData.locked)patch.locked=lk.checked;
    const bw=document.getElementById('modBlocked')?.value.trim();
    const newBlocked=bw?bw.split(',').map(s=>s.trim()).filter(Boolean):[];
    const oldBlocked=Array.isArray(srvData.blockedWords)?srvData.blockedWords:[];
    if(newBlocked.length!==oldBlocked.length||newBlocked.some((w,i)=>w!==oldBlocked[i]))patch.blockedWords=newBlocked;
    const mna=parseInt(document.getElementById('modMinAge')?.value)||0;
    if(mna!==(srvData.minAgeMin||0))patch.minAgeMin=mna;
    // Access tab: application toggle + custom questions
    const ra=document.getElementById('srvReqApp');
    if(ra&&ra.checked!==!!srvData.requireApplication)patch.requireApplication=ra.checked;
    const qInputs=Array.from(document.querySelectorAll('.srv-app-q'));
    if(qInputs.length){
      const newQs=qInputs.map(i=>(i.value||'').trim()).filter(Boolean).slice(0,5);
      const oldQs=Array.isArray(srvData.appQuestions)?srvData.appQuestions:[];
      if(newQs.length!==oldQs.length||newQs.some((q,i)=>q!==oldQs[i]))patch.appQuestions=newQs;
    }
    if(!Object.keys(patch).length){toast('Nothing to save','info');closeModal();return;}
    try{
      await db.ref('servers/'+G.srvId).update(patch);
      Object.assign(srvData,patch);
      try{await logAudit('settings_change',{fields:Object.keys(patch).join(',')});}catch(e){}
      toast('Settings saved','success');
      closeModal();
    }catch(e){
      console.error('saveSrvSettings failed',e);
      toast('Save failed: '+(e.message||e.code||'unknown'),'error');
    }
  }finally{window._srvSaveInFlight=false;}
}

function loadRoleMgr(){
  const el=document.getElementById('roleManagerEl');if(!el)return;
  db.ref('servers/'+G.srvId+'/members').once('value',snap=>{
    const members=snap.val()||{};
    const myLvl=(ROLES[me.role]||ROLES.member).level;
    const iAmOwner=me.role==='owner';
    let h='';
    Object.entries(members).forEach(([u,data])=>{
      const role=data.role||'member';const rd=ROLES[role]||ROLES.member;
      const tLvl=rd.level;
      // Can I change this user's role?
      // - Owner can change anyone except the server owner key (OWNER constant) if configured
      // - Otherwise: only if target's level is strictly less than mine
      const isMe=u===me.username;
      const canEdit=(iAmOwner?role!=='owner':(tLvl<myLvl))&&!isMe;
      const roleOpts=Object.keys(ROLES).filter(r=>{
        if(r==='owner')return iAmOwner;
        return (ROLES[r].level<myLvl)||(iAmOwner);
      });
      h+=`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(179, 136, 255,.06)">
        <span style="flex:1;font-size:12px;font-family:var(--grotesk)">${esc(u)}${isMe?' <span style="color:var(--muted);font-size:10px;font-family:var(--mono)">(you)</span>':''}</span>
        <span class="role-pill" style="background:${rd.color}22;color:${rd.color};border:1px solid ${rd.color}44">${rd.name}</span>
        ${canEdit?`<select data-roleuser="${eattr(u)}" style="background:rgba(0,0,0,.4);border:1px solid rgba(179, 136, 255,.2);color:var(--text);border-radius:var(--r6);padding:4px 8px;font-size:11px;cursor:pointer">
          ${roleOpts.map(r=>`<option value="${r}" ${r===role?'selected':''}>${ROLES[r].name}</option>`).join('')}
        </select>
        <button class="btn-ghost" data-demote="${eattr(u)}" title="Demote to Member" style="font-size:10px;padding:4px 8px">Demote</button>`:`<span style="font-size:10px;color:var(--muted);font-family:var(--mono)">${isMe?'self':(tLvl>=myLvl?'Out of reach':'Locked')}</span>`}
      </div>`;
    });
    el.innerHTML=h||'<span style="font-size:12px;color:var(--muted)">No members</span>';
    el.querySelectorAll('select[data-roleuser]').forEach(sel=>sel.addEventListener('change',()=>setMemberRole(sel.dataset.roleuser,sel.value)));
    el.querySelectorAll('button[data-demote]').forEach(btn=>btn.addEventListener('click',()=>setMemberRole(btn.dataset.demote,'member')));
  });
}

async function setMemberRole(username,newRole){
  
  const myLvl=(ROLES[me.role]||ROLES.member).level;
  const newLvl=(ROLES[newRole]||ROLES.member).level;
  if(me.role!=='owner'&&newLvl>=myLvl){toast("Can't assign a role equal to or above your own",'error');loadRoleMgr();return;}
  
  const curSnap=await db.ref('servers/'+G.srvId+'/members/'+username+'/role').once('value');
  const curRole=curSnap.val()||'member';
  const curLvl=(ROLES[curRole]||ROLES.member).level;
  if(me.role!=='owner'&&curLvl>=myLvl){toast("Can't change role of someone at or above your level",'error');loadRoleMgr();return;}
  if(username===me.username){toast("Can't change your own role",'error');loadRoleMgr();return;}
  await db.ref('servers/'+G.srvId+'/members/'+username+'/role').set(newRole);
  await logAudit('role_change',{target:username,role:newRole});
  toast(username+' is now '+(ROLES[newRole]?.name||newRole),'success');
  loadRoleMgr();
}

async function loadBanList(){
  const el=document.getElementById('banListEl');if(!el)return;
  const snap=await db.ref('servers/'+G.srvId+'/bans').once('value');
  const bans=snap.val()||{};
  if(!Object.keys(bans).length){el.innerHTML='<span style="font-size:12px;color:var(--muted)">No bans</span>';return;}
  let h='';
  Object.entries(bans).forEach(([u,d])=>{
    h+=`<div class="banned-row"><div style="flex:1"><div style="font-size:12px;font-weight:700">${esc(u)}</div><div style="font-size:10px;color:var(--muted);font-family:var(--mono)">${esc(d.reason||'No reason')} · by ${esc(d.by)}</div></div><button class="btn-ghost" data-unban="${eattr(u)}" style="font-size:11px;padding:4px 10px">Unban</button></div>`;
  });
  el.innerHTML=h;
  el.querySelectorAll('[data-unban]').forEach(b=>b.addEventListener('click',async()=>{
    await db.ref('servers/'+G.srvId+'/bans/'+b.dataset.unban).remove();
    await logAudit('member_unban',{target:b.dataset.unban});
    toast(b.dataset.unban+' unbanned','success');loadBanList();
  }));
}

function _templateChannels(tpl){
  const base={categories:{'cat-info':{id:'cat-info',name:'Info',position:-1},'cat-gen':{id:'cat-gen',name:'General',position:0}},channels:{}};
  const mkCh=(id,name,topic,cat,pos,extra)=>Object.assign({id,name,topic,type:'text',categoryId:cat,position:pos},extra||{});
  
  base.channels['rules']=mkCh('rules','rules','Server rules — read before posting','cat-info',0,{readOnly:true});
  base.channels['welcome']=mkCh('welcome','welcome','Welcome new members!','cat-info',1,{readOnly:true});
  if(tpl==='gaming'){
    base.categories['cat-games']={id:'cat-games',name:'Games',position:1};
    base.channels['general']=mkCh('general','general','General chat','cat-gen',0);
    base.channels['lfg']=mkCh('lfg','lfg','Looking for group','cat-games',0);
    base.channels['clips']=mkCh('clips','clips','Share epic moments','cat-games',1);
    base.channels['recommendations']=mkCh('recommendations','recommendations','Game recs','cat-games',2);
  }else if(tpl==='study'){
    base.categories['cat-study']={id:'cat-study',name:'Study',position:1};
    base.channels['general']=mkCh('general','general','General chat','cat-gen',0);
    base.channels['homework']=mkCh('homework','homework','Homework help','cat-study',0);
    base.channels['notes']=mkCh('notes','notes','Shared notes','cat-study',1);
    base.channels['study-groups']=mkCh('study-groups','study-groups','Find study buddies','cat-study',2);
  }else if(tpl==='creative'){
    base.categories['cat-make']={id:'cat-make',name:'Creations',position:1};
    base.channels['general']=mkCh('general','general','General chat','cat-gen',0);
    base.channels['art']=mkCh('art','art','Show your art','cat-make',0);
    base.channels['music']=mkCh('music','music','Share your music','cat-make',1);
    base.channels['writing']=mkCh('writing','writing','Share writing','cat-make',2);
    base.channels['feedback']=mkCh('feedback','feedback','Get feedback','cat-make',3);
  }else if(tpl==='friends'){
    base.categories['cat-gen'].name='Hangout';
    base.channels['general']=mkCh('general','general','General chat','cat-gen',0);
    base.channels['memes']=mkCh('memes','memes','Drop memes here','cat-gen',1);
    base.channels['pictures']=mkCh('pictures','pictures','Share pics','cat-gen',2);
    base.channels['plans']=mkCh('plans','plans','Plan hangouts','cat-gen',3);
  }else{
    base.channels['general']=mkCh('general','general','General discussion','cat-gen',0);
  }

  base.categories['cat-staff']={id:'cat-staff',name:'Staff',position:99,staffOnly:true};
  base.channels['staff-talks']={id:'staff-talks',name:'staff-talks',topic:'Staff-only chat — coordinate moderation here',type:'text',categoryId:'cat-staff',position:0,staffOnly:true};
  base.channels['logs']={id:'logs',name:'logs',topic:'Auto: edited & deleted message log (staff only)',type:'text',categoryId:'cat-staff',position:1,staffOnly:true,readOnly:true,isLog:true};
  base.channels['strike-logs']={id:'strike-logs',name:'strike-logs',topic:'PeakBot strike & warning history (staff only)',type:'text',categoryId:'cat-staff',position:2,staffOnly:true,readOnly:true,isLog:true};
  return base;
}

async function _seedRulesAndWelcome(srvId,tpl){
  const tplKey=RULES_TEMPLATES[tpl]?tpl:'basic';
  const rules=RULES_TEMPLATES[tplKey];
  const now=Date.now();
  
  try{
    const rSnap=await db.ref('messages/'+srvId+'/rules').limitToFirst(1).once('value');
    if(!rSnap.exists()){
      for(let i=0;i<rules.length;i++){
        await db.ref('messages/'+srvId+'/rules').push({username:'PeakBot',uid:'system',displayName:'PeakBot',avatarUrl:'',userRole:'system',text:rules[i],ts:now+i,replyTo:null,edited:false,pinned:i===0});
      }
    }
  }catch(e){console.warn('seed rules failed',e);}
  
  try{
    const wSnap=await db.ref('messages/'+srvId+'/welcome').limitToFirst(1).once('value');
    if(!wSnap.exists()){
      await db.ref('messages/'+srvId+'/welcome').push({username:'PeakBot',uid:'system',displayName:'PeakBot',avatarUrl:'',userRole:'system',text:'👋 **Welcome!** New members will be greeted here. Server admins can customize the welcome message in **Server Settings → Welcome**.',ts:now,replyTo:null,edited:false,pinned:true});
    }
  }catch(e){console.warn('seed welcome failed',e);}
  
  try{
    const annChSnap=await db.ref('servers/'+srvId+'/channels/announcements').once('value');
    if(annChSnap.exists()){
      const aSnap=await db.ref('messages/'+srvId+'/announcements').limitToFirst(1).once('value');
      if(!aSnap.exists()&&Array.isArray(ANN_TEMPLATE)){
        for(let i=0;i<ANN_TEMPLATE.length;i++){
          await db.ref('messages/'+srvId+'/announcements').push({username:'PeakBot',uid:'system',displayName:'PeakBot',avatarUrl:'',userRole:'system',text:ANN_TEMPLATE[i],ts:now+i,replyTo:null,edited:false,pinned:i===0});
        }
      }
    }
  }catch(e){console.warn('seed announcements failed',e);}
}

async function _postWelcome(srvId,joiner){
  const s=(await db.ref('servers/'+srvId).once('value')).val()||{};
  if(!s.welcomeMessage)return;
  const chId=s.welcomeChannel||'general';
  const txt=s.welcomeMessage.replace(/\{user\}/g,'@'+joiner);
  await db.ref('messages/'+srvId+'/'+chId).push({username:'PeakBot',uid:'system',displayName:'PeakBot',avatarUrl:'',userRole:'system',text:txt,ts:Date.now(),replyTo:null,edited:false,pinned:false});
}

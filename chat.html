          if(v&&v.srvId){
            const sd=await db.ref('servers/'+v.srvId).once('value');
            if(sd.exists()){found=v.srvId;foundData=sd.val();}
          }
        }
      }catch(e){console.warn('[invite] index lookup',e);}
      if(!found){
        const codeLow=codeRaw.toLowerCase();
        const snap=await db.ref('servers').once('value');
        snap.forEach(child=>{if(child.val()?.inviteCode?.toLowerCase()===codeLow){found=child.key;foundData=child.val();}});
      }
      if(!found){toast('Invalid code','error');return;}
      
      if(foundData.inviteCode){
        db.ref('serverInvites/'+foundData.inviteCode).set({
          srvId:found,name:foundData.name||'',owner:foundData.owner||'',
          createdAt:foundData.createdAt||Date.now(),
          iconUrl:foundData.iconUrl||'',iconEmoji:foundData.iconEmoji||''
        }).catch(()=>{});
      }
      if(foundData.locked){toast('This server is locked to new members','error');return;}
      
      const banCheck=await db.ref('servers/'+found+'/bans/'+me.username).once('value');
      if(banCheck.exists()){toast('You are banned from this server','error');return;}
      const already=await db.ref('servers/'+found+'/members/'+me.username).once('value');
      if(already.exists()){
        try{db.ref('userServers/'+me.username+'/'+found).set(true).catch(()=>{});}catch(e){}
        toast('Already in this server','info');closeModal();return;
      }

      const requiresApp=found!==QS_ID&&!!foundData.requireApplication;
      if(!requiresApp){
        await db.ref().update({
          ['servers/'+found+'/members/'+me.username]:{role:'member',joinedAt:Date.now()},
          ['userServers/'+me.username+'/'+found]:true
        });
        try{await db.ref('audit/'+found).push({action:'member_join',by:me.username,ts:Date.now(),target:me.username});}catch(e){}
        _postWelcome(found,me.username).catch(()=>{});
        toast('Joined '+(foundData.name||'server')+'!','success');closeModal();
        await loadMyServers();buildRail();joinServer(found);
        return;
      }
      
      const existing=await db.ref('serverApplications/'+me.username+'/'+found).once('value');
      if(existing.exists()){
        const exV=existing.val()||{};
        if(exV.status==='pending'){toast('You already have a pending application for this server','info');closeModal();return;}
        if(exV.status==='rejected'){toast('Your application was rejected — contact the owner directly','error');closeModal();return;}
      }

      const questions=Array.isArray(foundData.appQuestions)?foundData.appQuestions:[];
      const answers={};
      if(questions.length){

        const qHtml=questions.map((q,i)=>`<label class="modal-label">${esc(q)}</label><textarea class="modal-inp" id="appQ${i}" rows="2" maxlength="500"></textarea>`).join('');
        let resolved=false;
        await new Promise(res=>{
          openModal({wide:true,html:`<div class="modal-title">Application Questions</div><div class="modal-sub">${esc(foundData.name||'This server')} asks you to answer these before joining.</div>${qHtml}`,
            footer:[
              {label:'Submit Application',cls:'btn-sub',fn:()=>{
                questions.forEach((q,i)=>{
                  const v=(document.getElementById('appQ'+i)?.value||'').trim();
                  if(v)answers['q'+i]={question:q,answer:v};
                });
                resolved=true;res();
              }},
              {label:'Cancel',cls:'btn-ghost',fn:()=>{resolved=true;closeModal();res();}}
            ]
          });
        });
        if(!resolved||(questions.some((q,i)=>!answers['q'+i]))){
          toast('Please answer all questions','error');return;
        }
      }
      
      const ownerName=foundData.owner||'';
      const updates={};
      updates['serverApplications/'+me.username+'/'+found]={
        srvId:found,serverName:foundData.name||'',
        by:me.username,byDisplay:me.displayName||me.username,byAvatar:me.avatarUrl||'',
        note,answers,ts:Date.now(),status:'pending'
      };
      
      updates['servers/'+found+'/pendingApps/'+me.username]={
        username:me.username,displayName:me.displayName||me.username,avatarUrl:me.avatarUrl||'',
        note,ts:Date.now()
      };
      try{
        await db.ref().update(updates);
        
        if(ownerName){
          try{await db.ref('notifications/'+ownerName).push({
            type:'server-application',from:me.username,fromDisplay:me.displayName||me.username,
            srvId:found,serverName:foundData.name||'',note,ts:Date.now()
          });}catch(e){}
        }
        toast('Application sent — the server owner will decide','success');
        closeModal();
      }catch(e){
        console.error('apply failed',e);
        toast('Application failed: '+(e.message||'unknown'),'error');
      }
    }},{label:'Cancel',cls:'btn-ghost',fn:closeModal}]
  });
  setTimeout(()=>document.getElementById('joinCodeInp')?.focus(),80);
}

async function approveServerApplication(srvId,username){
  if(!hasPerm('manageServer')){toast('No permission','error');return;}
  try{
    const apSnap=await db.ref('servers/'+srvId+'/pendingApps/'+username).once('value');
    if(!apSnap.exists()){toast('Application not found','error');return;}
    const srvSnap=await db.ref('servers/'+srvId).once('value');
    const srvName=(srvSnap.val()||{}).name||'';
    const updates={};
    updates['servers/'+srvId+'/members/'+username]={role:'member',joinedAt:Date.now()};
    updates['userServers/'+username+'/'+srvId]=true;
    updates['servers/'+srvId+'/pendingApps/'+username]=null;
    updates['serverApplications/'+username+'/'+srvId]={status:'approved',decidedBy:me.username,decidedAt:Date.now(),srvId,serverName:srvName};
    await db.ref().update(updates);
    try{await db.ref('audit/'+srvId).push({action:'member_join_approved',by:me.username,ts:Date.now(),target:username});}catch(e){}
    try{await db.ref('notifications/'+username).push({type:'server-application-update',srvId,serverName:srvName,status:'approved',ts:Date.now(),text:'Accepted into '+srvName});}catch(e){}
    _postWelcome(srvId,username).catch(()=>{});
    toast('Accepted @'+username,'success');
  }catch(e){toast('Approve failed: '+(e.message||'unknown'),'error');}
}
async function rejectServerApplication(srvId,username){
  if(!hasPerm('manageServer')){toast('No permission','error');return;}
  try{
    const srvSnap=await db.ref('servers/'+srvId).once('value');
    const srvName=(srvSnap.val()||{}).name||'';
    const updates={};
    updates['servers/'+srvId+'/pendingApps/'+username]=null;
    updates['serverApplications/'+username+'/'+srvId]={status:'rejected',decidedBy:me.username,decidedAt:Date.now(),srvId,serverName:srvName};
    await db.ref().update(updates);
    try{await db.ref('notifications/'+username).push({type:'server-application-update',srvId,serverName:srvName,status:'rejected',ts:Date.now(),text:'Rejected from '+srvName});}catch(e){}
    toast('Rejected @'+username,'info');
  }catch(e){toast('Reject failed: '+(e.message||'unknown'),'error');}
}

function _sanitizeChName(raw){
  let s=String(raw||'').trim();
  
  s=s.replace(/[A-Z]/g,c=>c.toLowerCase());
  
  s=s.replace(/\s+/g,'-');

  s=s.split('').filter(c=>{const k=c.charCodeAt(0);return k>=32 && c!=='.' && c!=='#' && c!=='$' && c!=='[' && c!==']' && c!=='/';}).join('');

  s=s.replace(/[`'"~!@%^&*()=+{}|;:<>?,\\]/g,'');
  return s;
}
async function doCreateCh(){
  const raw=document.getElementById('nChName').value.trim();
  if(!raw||raw.length<2){toast('Name must be 2+ chars','error');return;}
  const name=_sanitizeChName(raw);
  if(!name||name.length<1){toast('Name must contain at least one letter, number, or emoji','error');return;}
  const id='ch-'+Date.now();
  const catId=document.getElementById('nChCat').value;
  const type=(document.getElementById('nChType')?.value)||'text';
  const ro=document.getElementById('nChRO').checked||type==='announcements';
  const pos=srvData.channels.filter(c=>c.categoryId===catId).length;
  const data={
    id,name,topic:document.getElementById('nChTopic').value.trim(),
    type,categoryId:catId,position:pos,
    minRole:'member',readOnly:ro
  };
  
  if(type==='counting'){data.countingState={current:0,lastUser:''};}
  
  if(type==='wordle'){data.wordleState={dayKey:_wordleDayKey(),word:_wordleWord(),guesses:{}};}
  await db.ref('servers/'+G.srvId+'/channels/'+id).set(data);
  await logAudit('channel_create',{target:'#'+name,type});
  toast('#'+name+' created!','success');closeModal();joinCh(id);
}

  const ch=srvData.channels.find(c=>c.id===chId);if(!ch)return;
  openModal({html:`<div class="modal-title">Edit #${esc(ch.name)}</div>

    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px"><label class="modal-label" style="margin:0">Read Only (admins only)</label><label class="toggle"><input type="checkbox" id="eCro" ${ch.readOnly?'checked':''}/><span class="toggle-slider"></span></label></div>`,
    footer:[{label:'Save',cls:'btn-sub',fn:()=>doEditCh(chId)},{label:'Delete',cls:'btn-danger',fn:()=>deleteCh(chId)},{label:'Cancel',cls:'btn-ghost',fn:closeModal}]

async function doEditCh(chId){
  const name=_sanitizeChName(document.getElementById('eCn').value);
  if(!name){toast('Name required','error');return;}
  const prev=srvData.channels.find(c=>c.id===chId);
  const topic=document.getElementById('eCt').value.trim();
  const readOnly=document.getElementById('eCro').checked;
  await db.ref('servers/'+G.srvId+'/channels/'+chId).update({name,topic,readOnly});
  
  const changed=[];
  if(prev){
    if(prev.name!==name)changed.push('name');
    if((prev.topic||'')!==topic)changed.push('topic');
    if(!!prev.readOnly!==!!readOnly)changed.push('readOnly');
  }
  await logAudit('channel_edit',{target:'#'+name,fields:changed.join(',')||'metadata'});
  toast('Channel updated!','success');closeModal();
}

async function deleteCh(chId){
  if(chId==='general'){toast("Can't delete #general",'error');return;}
  const ch=srvData.channels.find(c=>c.id===chId);

  const ok=await uiConfirm('Delete #'+(ch?.name||chId)+'? This permanently removes the channel and all its messages. This CANNOT be undone.',{title:'Delete Channel',okLabel:'Delete',danger:true});
  if(!ok)return;
  await db.ref('servers/'+G.srvId+'/channels/'+chId).remove();
  await db.ref('messages/'+G.srvId+'/'+chId).remove();
  await logAudit('channel_delete',{target:'#'+(ch?.name||chId)});
  toast('Channel deleted','success');closeModal();
  if(G.channel===chId){const f=srvData.channels.find(c=>c.id!==chId&&c.type==='text');if(f)joinCh(f.id);}
}

async function _ensureLogsCh(srvId){
  try{
    if(!srvId)return;
    const updates={};
    const cr=db.ref('servers/'+srvId+'/categories/cat-staff');
    const cs=await cr.once('value');
    if(!cs.exists()){updates['servers/'+srvId+'/categories/cat-staff']={id:'cat-staff',name:'Staff',position:99,staffOnly:true};}
    const lr=db.ref('servers/'+srvId+'/channels/logs');
    const ls=await lr.once('value');
    if(!ls.exists()){updates['servers/'+srvId+'/channels/logs']={id:'logs',name:'logs',topic:'Auto: edited & deleted message log (staff only)',type:'text',categoryId:'cat-staff',position:1,staffOnly:true,readOnly:true,isLog:true};}
    const sr=db.ref('servers/'+srvId+'/channels/staff-talks');
    const ss=await sr.once('value');
    if(!ss.exists()){updates['servers/'+srvId+'/channels/staff-talks']={id:'staff-talks',name:'staff-talks',topic:'Staff-only chat — coordinate moderation here',type:'text',categoryId:'cat-staff',position:0,staffOnly:true};}
    
    const sk=db.ref('servers/'+srvId+'/channels/strike-logs');
    const sks=await sk.once('value');
    if(!sks.exists()){updates['servers/'+srvId+'/channels/strike-logs']={id:'strike-logs',name:'strike-logs',topic:'PeakBot strike & warning history (staff only)',type:'text',categoryId:'cat-staff',position:2,staffOnly:true,readOnly:true,isLog:true};}
    if(Object.keys(updates).length)await db.ref().update(updates);
  }catch(e){}
}

const DEFAULT_STRIKE_LADDER=[
  {strike:1,action:'timeout',durationSec:300,label:'5-minute timeout'},
  {strike:2,action:'timeout',durationSec:1800,label:'30-minute timeout'},
  {strike:3,action:'timeout',durationSec:86400,label:'1-day timeout'},
  {strike:4,action:'ban',label:'Permanent ban'}
];

const DEFAULT_TRIGGER_WORDS=['nigger','niqqer','nigga','niqqa','faggot','tranny','dyke','spic','kike','chink','retard'];
const DEFAULT_WARNING_WORDS=['stupid','dumb','idiot','shut up','kys'];

async function _getAutomodConfig(srvId){
  try{
    const s=await db.ref('servers/'+srvId+'/automodConfig').once('value');
    const v=s.val()||{};
    return {
      enabled:v.enabled!==false,
      ladder:Array.isArray(v.ladder)&&v.ladder.length?v.ladder:DEFAULT_STRIKE_LADDER,
      triggers:Array.isArray(v.triggers)?v.triggers:DEFAULT_TRIGGER_WORDS,
      warningWords:Array.isArray(v.warningWords)?v.warningWords:DEFAULT_WARNING_WORDS,
      strikeLogChannel:v.strikeLogChannel||'strike-logs'
    };
  }catch(e){return {enabled:true,ladder:DEFAULT_STRIKE_LADDER,triggers:DEFAULT_TRIGGER_WORDS,warningWords:DEFAULT_WARNING_WORDS,strikeLogChannel:'strike-logs'};}
}

async function _strikeBotMsg(srvId,channelId,text,extra){
  try{
    await _ensureLogsCh(srvId); 
    const payload={
      username:'PeakBot',uid:'system',displayName:'PeakBot',avatarUrl:'',
      userRole:'system',ts:Date.now(),text,system:true,...(extra||{})
    };
    await db.ref('messages/'+srvId+'/'+channelId).push(payload);
  }catch(e){console.warn('[strike] bot msg failed',e);}
}

async function _applyStrikePunishment(srvId,username,rule){
  if(!rule||!rule.action)return;
  if(rule.action==='timeout'){
    const dur=Math.max(30,Math.min(2592000,rule.durationSec||300));
    const until=Date.now()+(dur*1000);
    await db.ref('servers/'+srvId+'/timeouts/'+username).set({until,by:'PeakBot',reason:'Auto-strike','ts':Date.now()});
  }else if(rule.action==='ban'){
    
    const updates={};
    updates['servers/'+srvId+'/bans/'+username]={reason:'Auto-strike (max strikes reached)',by:'PeakBot',ts:Date.now()};
    updates['servers/'+srvId+'/members/'+username]=null;
    updates['userServers/'+username+'/'+srvId]=null;
    await db.ref().update(updates);
  }else if(rule.action==='kick'){
    
    const updates={};
    updates['servers/'+srvId+'/members/'+username]=null;
    updates['userServers/'+username+'/'+srvId]=null;
    await db.ref().update(updates);
  }
}

async function addStrike(srvId,username,reason,opts){
  if(!srvId||!username)return;
  
  const cfg=await _getAutomodConfig(srvId);
  const stRef=db.ref('servers/'+srvId+'/strikes/'+username);
  let cur={count:0,warningCount:0,history:[]};
  try{const s=await stRef.once('value');if(s.exists())cur={...cur,...(s.val()||{})};}catch(e){}
  const next=(cur.count||0)+1;
  const rule=cfg.ladder.find(r=>r.strike===next)||cfg.ladder[cfg.ladder.length-1];
  const entry={
    type:'strike',
    n:next,
    reason:reason||'No reason given',
    by:(opts&&opts.by)||me.username||'PeakBot',
    ts:Date.now(),
    action:rule?rule.action:'none',
    durationSec:rule?rule.durationSec||0:0
  };
  
  const history=Array.isArray(cur.history)?cur.history:[];
  history.push(entry);
  if(history.length>200)history.shift(); 
  await stRef.set({count:next,warningCount:cur.warningCount||0,history,lastStrikeTs:Date.now()});
  
  if(rule)await _applyStrikePunishment(srvId,username,rule);
  
  const punishLabel=rule?(rule.label||rule.action):'no further action';
  const dn=((window._userProfiles||{})[username]||{}).displayName||username;
  await _strikeBotMsg(srvId,cfg.strikeLogChannel||'strike-logs',
    `⚠️ **Strike #${next}** for **${dn}** (@${username})\n> Reason: ${reason||'No reason given'}\n> Punishment: **${punishLabel}**`,
    {strikeAction:'add',targetUser:username,strikeNum:next}
  );
  
  try{await db.ref('notifications/'+username).push({type:'strike',server:srvId,by:entry.by,reason,ts:Date.now(),text:`Strike ${next}: ${punishLabel} — ${reason||''}`});}catch(e){}
  
  try{logAudit('strike_add',{target:username,strike:next,reason});}catch(e){}
}

async function addWarning(srvId,username,reason,opts){
  if(!srvId||!username)return;
  const cfg=await _getAutomodConfig(srvId);
  const stRef=db.ref('servers/'+srvId+'/strikes/'+username);
  let cur={count:0,warningCount:0,history:[]};
  try{const s=await stRef.once('value');if(s.exists())cur={...cur,...(s.val()||{})};}catch(e){}
  const nextW=(cur.warningCount||0)+1;
  const entry={
    type:'warning',n:nextW,reason:reason||'Minor infraction',
    by:(opts&&opts.by)||me.username||'PeakBot',ts:Date.now()
  };
  const history=Array.isArray(cur.history)?cur.history:[];
  history.push(entry);
  if(history.length>200)history.shift();
  await stRef.set({count:cur.count||0,warningCount:nextW,history,lastWarnTs:Date.now()});
  const dn=((window._userProfiles||{})[username]||{}).displayName||username;
  await _strikeBotMsg(srvId,cfg.strikeLogChannel||'strike-logs',
    `📒 **Warning** for **${dn}** (@${username}) — minor infraction\n> Reason: ${reason||'Minor infraction'}\n> Total warnings: **${nextW}**`,
    {strikeAction:'warn',targetUser:username,warnNum:nextW}
  );
  try{logAudit('warning_add',{target:username,warning:nextW,reason});}catch(e){}
}

async function removeStrike(srvId,username){
  if(!srvId||!username)return;
  const cfg=await _getAutomodConfig(srvId);
  const stRef=db.ref('servers/'+srvId+'/strikes/'+username);
  const s=await stRef.once('value');
  if(!s.exists()){toast('No strikes for this user','info');return;}
  const cur=s.val()||{};
  const newCount=Math.max(0,(cur.count||0)-1);
  const history=Array.isArray(cur.history)?cur.history:[];
  history.push({type:'strike-remove',ts:Date.now(),by:me.username,reason:'Forgiven by mod'});
  await stRef.update({count:newCount,history});
  const dn=((window._userProfiles||{})[username]||{}).displayName||username;
  await _strikeBotMsg(srvId,cfg.strikeLogChannel||'strike-logs',
    `✅ Strike removed from **${dn}** (@${username}) by **${me.displayName||me.username}** — now at **${newCount}** strike${newCount===1?'':'s'}`,
    {strikeAction:'remove',targetUser:username}
  );
}

async function loadAutomodCfg(){
  const root=document.getElementById('amCfgRoot');if(!root)return;
  const cfg=await _getAutomodConfig(G.srvId);
  const channelOpts=(srvData.channels||[]).filter(c=>c.type==='text'||c.isLog).map(c=>`<option value="${eattr(c.id)}" ${c.id===cfg.strikeLogChannel?'selected':''}>#${esc(c.name)}</option>`).join('');
  root.innerHTML=`
    <div class="perm-row"><div><div class="perm-lbl">Enable Automod</div><div class="perm-desc">When off, no auto-strikes or warnings are issued.</div></div><label class="toggle"><input type="checkbox" id="amEnabled" ${cfg.enabled?'checked':''}/><span class="toggle-slider"></span></label></div>
    <label class="modal-label" style="margin-top:14px">Strike Log Channel</label>
    <select class="modal-inp" id="amStrikeChannel" style="margin:0">${channelOpts||'<option>strike-logs</option>'}</select>
    <div style="font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:4px">PeakBot posts strike + warning announcements here.</div>

    <label class="modal-label" style="margin-top:18px">Trigger Words <span style="color:var(--muted);font-weight:400;font-size:10px">(comma-separated, lowercase — match strikes a user)</span></label>
    <textarea class="modal-inp" id="amTriggers" rows="3" placeholder="nigger, niqqer, faggot, ...">${esc(cfg.triggers.join(', '))}</textarea>

    <label class="modal-label" style="margin-top:14px">Warning Words <span style="color:var(--muted);font-weight:400;font-size:10px">(minor — recorded but no auto-punish)</span></label>
    <textarea class="modal-inp" id="amWarnings" rows="2" placeholder="stupid, dumb, ...">${esc(cfg.warningWords.join(', '))}</textarea>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:20px">
      <div style="font-family:var(--grotesk);font-size:15px;font-weight:800">Strike Ladder</div>
      <button class="btn-sub" id="amAddStep" style="padding:6px 12px;font-size:11px"><i class="fa-solid fa-plus"></i> Add Step</button>
    </div>
    <p style="font-size:11px;color:var(--muted);font-family:var(--mono);margin:4px 0 10px">What PeakBot does when a user reaches each strike count.</p>
    <div id="amLadderList" style="display:flex;flex-direction:column;gap:8px"></div>

    <div style="margin-top:18px;display:flex;gap:8px">
      <button class="btn-sub" id="amSaveBtn" style="padding:9px 18px;font-size:12px"><i class="fa-solid fa-floppy-disk"></i> Save Automod</button>
      <button class="btn-ghost" id="amResetBtn" style="padding:9px 18px;font-size:12px">Reset to Defaults</button>
    </div>`;
  
  const ladder=cfg.ladder.slice();
  const renderLadder=()=>{
    const box=document.getElementById('amLadderList');if(!box)return;
    box.innerHTML=ladder.map((rule,i)=>{
      return `<div style="display:flex;align-items:center;gap:8px;padding:10px;background:rgba(0,0,0,.3);border:1px solid rgba(156, 77, 204,.2);border-radius:10px">
        <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#ff4fd8,#8b5cf6);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff">${rule.strike}</div>
        <div style="flex:1;display:flex;flex-direction:column;gap:6px">
          <div style="display:flex;gap:8px;align-items:center">
            <select data-amla-action="${i}" class="modal-inp" style="margin:0;flex:1;padding:6px 10px;font-size:11px">
              <option value="timeout" ${rule.action==='timeout'?'selected':''}>Timeout</option>
              <option value="kick" ${rule.action==='kick'?'selected':''}>Kick</option>
              <option value="ban" ${rule.action==='ban'?'selected':''}>Ban</option>
            </select>
            <input data-amla-dur="${i}" type="number" min="30" max="2592000" class="modal-inp" placeholder="seconds" value="${rule.durationSec||0}" style="margin:0;flex:1;padding:6px 10px;font-size:11px;${rule.action!=='timeout'?'opacity:.4;pointer-events:none':''}"/>
          </div>
          <input data-amla-label="${i}" class="modal-inp" value="${esc(rule.label||'')}" placeholder="Label shown in strike log" style="margin:0;padding:6px 10px;font-size:11px"/>
        </div>
        <button class="btn-ghost" data-amla-rm="${i}" style="padding:6px 10px;font-size:11px;color:var(--rose)"><i class="fa-solid fa-trash"></i></button>
      </div>`;
    }).join('');
    box.querySelectorAll('[data-amla-action]').forEach(s=>s.onchange=e=>{ladder[+s.dataset.amlaAction].action=s.value;renderLadder();});
    box.querySelectorAll('[data-amla-dur]').forEach(s=>s.oninput=e=>{ladder[+s.dataset.amlaDur].durationSec=parseInt(s.value)||0;});
    box.querySelectorAll('[data-amla-label]').forEach(s=>s.oninput=e=>{ladder[+s.dataset.amlaLabel].label=s.value;});
    box.querySelectorAll('[data-amla-rm]').forEach(b=>b.onclick=()=>{ladder.splice(+b.dataset.amlaRm,1);ladder.forEach((r,i)=>r.strike=i+1);renderLadder();});
  };
  renderLadder();
  document.getElementById('amAddStep').onclick=()=>{
    ladder.push({strike:ladder.length+1,action:'timeout',durationSec:3600,label:'1-hour timeout'});
    renderLadder();
  };
  document.getElementById('amResetBtn').onclick=()=>{
    if(!confirm('Reset automod to defaults?'))return;
    db.ref('servers/'+G.srvId+'/automodConfig').remove().then(()=>{toast('Reset','success');loadAutomodCfg();});
  };
  document.getElementById('amSaveBtn').onclick=async()=>{
    const enabled=document.getElementById('amEnabled').checked;
    const strikeLogChannel=document.getElementById('amStrikeChannel').value;
    const triggers=document.getElementById('amTriggers').value.split(/[,\n]/).map(s=>s.trim().toLowerCase()).filter(Boolean);
    const warningWords=document.getElementById('amWarnings').value.split(/[,\n]/).map(s=>s.trim().toLowerCase()).filter(Boolean);
    
    ladder.forEach((r,i)=>{r.strike=i+1;});
    try{
      await db.ref('servers/'+G.srvId+'/automodConfig').set({enabled,strikeLogChannel,triggers,warningWords,ladder});
      toast('Automod saved','success');
    }catch(e){toast('Save failed: '+(e.message||'unknown'),'error');}
  };
}

function showStrikesFor(username){
  db.ref('servers/'+G.srvId+'/strikes/'+username).once('value').then(s=>{
    const d=s.val()||{count:0,warningCount:0,history:[]};
    const hist=Array.isArray(d.history)?d.history.slice().reverse():[];
    const dn=((window._userProfiles||{})[username]||{}).displayName||username;
    const _back=()=>{closeModal();showServerSettings();_setSettingsTab('ss-strikes');};
    openModal({wide:true,html:`
      <div class="modal-title">Strikes — ${esc(dn)}</div>
      <div class="modal-sub">${d.count||0} strike(s) · ${d.warningCount||0} warning(s)</div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="btn-sub" id="strAddSt" style="padding:8px 14px;font-size:11px"><i class="fa-solid fa-triangle-exclamation"></i> Add Strike</button>
        <button class="btn-ghost" id="strAddWn" style="padding:8px 14px;font-size:11px"><i class="fa-solid fa-flag"></i> Add Warning</button>
        ${(d.count||0)>0?`<button class="btn-ghost" id="strRmSt" style="padding:8px 14px;font-size:11px;color:#23d160">Forgive Last Strike</button>`:''}
      </div>
      <label class="modal-label" style="margin-top:18px">History</label>

async function automodCheckStrike(srvId,username,text){
  if(!srvId||!username||!text)return false;
  const cfg=await _getAutomodConfig(srvId);
  if(!cfg.enabled)return false;
  
  const compact=String(text).toLowerCase().replace(/[^a-z]/g,'');
  const hitTrigger=cfg.triggers.find(w=>w&&compact.includes(String(w).toLowerCase().replace(/[^a-z]/g,'')));
  if(hitTrigger){
    await addStrike(srvId,username,'Automod: used "'+hitTrigger+'"',{by:'PeakBot'});
    return true;
  }
  const hitWarn=cfg.warningWords.find(w=>w&&compact.includes(String(w).toLowerCase().replace(/[^a-z]/g,'')));
  if(hitWarn){
    await addWarning(srvId,username,'Automod: minor — "'+hitWarn+'"',{by:'PeakBot'});
    return false; 
  }
  return false;
}

function parseSearchQ(q){
  
  const filters={from:null,after:null,before:null,during:null,has:null,text:''};
  const tokens=q.match(/\S+/g)||[];
  const rest=[];
  for(const tk of tokens){
    const m=tk.match(/^(from|after|before|during|has):(.+)$/i);
    if(!m){rest.push(tk);continue;}
    const key=m[1].toLowerCase(),val=m[2];
    if(key==='from')filters.from=val.replace(/^@/,'').toLowerCase();
    else if(key==='has')filters.has=val.toLowerCase();
    else{
      const d=new Date(val);
      if(!isNaN(+d))filters[key]=d;
    }
  }
  filters.text=rest.join(' ').toLowerCase();
  return filters;
}

function doSearch(q){
  const res=document.getElementById('searchResults');if(!res)return;
  if(!q.trim()){res.style.display='none';return;}
  const f=parseSearchQ(q);
  const matches=allMsgs.filter(m=>{
    if(f.text&&!(m.text||'').toLowerCase().includes(f.text))return false;
    if(f.from&&(m.username||'').toLowerCase()!==f.from)return false;
    if(f.after&&m.ts<+f.after)return false;
    if(f.before&&m.ts>+f.before)return false;
    if(f.during){
      const d=new Date(m.ts);
      if(d.toDateString()!==f.during.toDateString())return false;
    }
    if(f.has==='image'&&m.attachmentType!=='image')return false;
    if(f.has==='link'&&!/https?:\/\//i.test(m.text||''))return false;
    return true;
  }).slice(-30);
  if(!matches.length){res.innerHTML='<div style="padding:10px;font-size:12px;color:var(--muted);font-family:var(--mono)">No results. Try: from:user, after:2024-01-01, during:2024-06-15, has:image</div>';res.style.display='block';return;}
  res.innerHTML=matches.map(m=>`<div class="search-result" data-key="${eattr(m.key)}"><div style="font-size:11px;font-weight:700;color:${hue(m.username)};font-family:var(--grotesk)">${esc(m.displayName||m.username)}</div><div style="font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc((m.text||'').slice(0,80))}</div><div style="font-size:9px;color:var(--muted);font-family:var(--mono)">${fmtTime(m.ts)}</div></div>`).join('');
  res.style.display='block';
  res.querySelectorAll('.search-result').forEach(r=>r.addEventListener('click',()=>{jumpTo(r.dataset.key);toggleSearch();}));
}

function buildEmojiGrid(list,targetId='msgInput'){
  const grid=document.getElementById('epGrid');if(!grid)return;
  grid.innerHTML='';
  list.forEach(e=>{
    const b=document.createElement('button');
    b.className='ep-btn';b.textContent=e;
    
    const code=Object.entries(EMOJI_SHORTCODES).find(([,v])=>v===e)?.[0];
    if(code)b.title=':'+code+':';
    b.onclick=()=>{
      const inp=document.getElementById(targetId);if(!inp)return;
      const s=inp.selectionStart||0,end=inp.selectionEnd||0;
      inp.value=inp.value.slice(0,s)+e+inp.value.slice(end);
      inp.selectionStart=inp.selectionEnd=s+e.length;
      inp.focus();document.getElementById('emojiPanel')?.classList.remove('on');
    };
    grid.appendChild(b);
  });
  const srch=document.getElementById('epSearch');
  if(srch){
    srch.oninput=()=>{
      const q=srch.value.toLowerCase().trim();
      if(!q){buildEmojiGrid(ALL_EMOJIS,targetId);return;}

      const matched=new Set();
      
      Object.entries(EMOJI_SHORTCODES).forEach(([k,v])=>{
        if(k.includes(q))matched.add(v);
      });

      const filtered=ALL_EMOJIS.filter(e=>matched.has(e));
      buildEmojiGrid(filtered.length?filtered:ALL_EMOJIS.slice(0,1),targetId);
    };
  }
}

function watchNotifs(){
  db.ref('notifications/'+me.username).on('child_added',async snap=>{
    const d=snap.val();if(!d)return;
    const fresh=Date.now()-d.ts<15000;
    if(d.type==='kick'){if(fresh)toast('Kicked from '+d.server,'error');snap.ref.remove();return;}
    if(d.type==='ban'){if(fresh)toast('Banned: '+(d.reason||'no reason'),'error');snap.ref.remove();return;}
    if(d.type==='timeout'){if(fresh)toast('Timed out: '+(d.reason||''),'error');snap.ref.remove();return;}
    
    const _dn=u=>((window._userProfiles||{})[u]||{}).displayName||u||'?';
    
    if(d.type==='application'){
      if(fresh&&me.username===OWNER){
        toast('📋 New application: '+(d.fromDisplay||d.from),'info');
      }
      snap.ref.remove();return;
    }
    
    if(d.type==='server-application'){
      if(fresh){
        toast('📩 '+(d.fromDisplay||d.from)+' wants to join '+(d.serverName||'a server'),'info');
      }
      snap.ref.remove();return;
    }
    if(d.type==='server-application-update'){
      if(fresh){
        const lbl=d.status==='approved'?'✅ Accepted into ':'❌ Rejected from ';
        toast(lbl+(d.serverName||'a server'),d.status==='approved'?'success':'info');
      }
      snap.ref.remove();return;
    }
    
    if(d.type==='user-suggestion'){
      if(fresh&&me.username===OWNER){
        toast('📥 New user suggestion from '+(d.fromDisplay||d.from)+': '+d.candidateName,'info');
      }
      snap.ref.remove();return;
    }
    if(d.type==='user-suggestion-update'){
      if(fresh){
        const lbl=d.status==='approved'?'✅ Approved':(d.status==='rejected'?'❌ Rejected':'Updated');
        toast(lbl+': '+d.text,d.status==='approved'?'success':'info');
      }
      snap.ref.remove();return;
    }
    if(d.type==='user-suggestion-msg'){
      if(fresh){
        toast('💬 '+(d.fromDisplay||d.from)+': '+(d.text||'').slice(0,80),'info');
      }
      snap.ref.remove();return;
    }

    if(d.type==='friend'||d.type==='friendReq'||d.type==='friendAccept'){
      snap.ref.remove();return;
    }
    if(d.type==='dm'||d.type==='dm-mention'){
      const isPing=d.type==='dm-mention';
      
      const viewing=(G.view==='dm'&&G.dmChannel===d.dmId);
      if(viewing&&!isPing){snap.ref.remove();return;}
      if(fresh){

        const known=dmChannels.some(x=>x.id===d.dmId);
        if(!known){
          await loadDmChannels();
          const dm=dmChannels.find(x=>x.id===d.dmId);
          if(dm)_bindDmListener(dm.id);
        }
        
        try{
          const cached=window._userProfiles&&window._userProfiles[d.from];
          if(d.from&&(!cached||!cached.displayName||cached.avatarUrl===undefined)){
            _fetchProfile(d.from,()=>{try{renderDmList();renderDmNotif();buildRail();}catch(e){}});
          }
        }catch(e){}
        
        if(!viewing){
          renderDmNotif({username:d.from,text:d.text,ts:d.ts},d.dmId);
        }
        if(isPing){
          
          showPingPopup({
            from:d.from,fromAvatar:d.fromAvatar||'',
            server:d.isGroup?(d.dmName||'Group DM'):'Direct Message',
            channel:d.isGroup?(d.dmName||'group'):(d.fromDisplay||d.from),
            text:d.text||'',
            ts:d.ts,
            pingType:d.pingType||'user',
            isDM:true,
            dmId:d.dmId
          });
          toast('🔔 '+(d.fromDisplay||d.from||'?')+' pinged you in DM','info');
        }else{
          toast('💬 '+(d.fromDisplay||d.from||'?')+': '+(d.text||'').slice(0,40),'info');
        }
      }
      snap.ref.remove();return;
    }
    
    if(d.type==='mention'){
      if(fresh){
        showPingPopup(d);
        toast('🔔 '+(d.from||'?')+' pinged you in #'+(d.channel||'?'),'info');
      }
      snap.ref.remove();return;
    }
    if(fresh)toast('@you from '+(d.from||'?')+': '+(d.text||'').slice(0,40)+'…','info');
    snap.ref.remove();
  });
  
  db.ref('dmChannels').on('child_added',async snap=>{
    const d=snap.val()||{};
    if(!d.participants||!d.participants.includes(me.username))return;
    if(dmChannels.some(x=>x.id===snap.key))return;
    await loadDmChannels();
    _bindDmListener(snap.key);
    
    try{
      const others=(d.participants||[]).filter(p=>p!==me.username);
      others.forEach(o=>{
        if(!o)return;
        const cached=window._userProfiles&&window._userProfiles[o];
        if(!cached||!cached.displayName||cached.avatarUrl===undefined){
          _fetchProfile(o,()=>{try{renderDmList();buildRail();updateRailUnreadAv&&updateRailUnreadAv();}catch(e){}});
        }
      });
    }catch(e){}
    if(G.view==='dm')renderDmList();
    buildRail();
  });
  db.ref('dmChannels').on('child_changed',async snap=>{
    const d=snap.val()||{};
    if(!d.participants||!d.participants.includes(me.username))return;
    await loadDmChannels();
    if(!_dmListeners[snap.key])_bindDmListener(snap.key);
    
    try{
      const others=(d.participants||[]).filter(p=>p!==me.username);
      others.forEach(o=>{
        if(!o)return;
        const cached=window._userProfiles&&window._userProfiles[o];
        if(!cached||!cached.displayName||cached.avatarUrl===undefined){
          _fetchProfile(o,()=>{try{renderDmList();buildRail();}catch(e){}});
        }
      });
    }catch(e){}
    if(G.view==='dm')renderDmList();
  });
}

    footer:[{label:'Take Guided Tour',cls:'btn-sub',fn:()=>{closeModal();startTutorial(false);}},{label:'Close',cls:'btn-ghost',fn:closeModal}]
  });
  const tagColors={Messages:'#00f2ff',Pings:'#fbbf24',Servers:'#8b5cf6',Channels:'#00d4aa',Roles:'#ff4fd8',Profile:'#60a5fa',DMs:'#23d160',Polls:'#fbbf24',Moderation:'#ef4444',Tips:'#9ca3af'};
  const paint=(q='')=>{
    const root=document.getElementById('helpResults');if(!root)return;

      if(!ql)return true;

    });
    if(!matches.length){

      return;
    }
    
    const byTag={};matches.forEach(h=>{(byTag[h.tag]=byTag[h.tag]||[]).push(h);});
    root.innerHTML=Object.entries(byTag).map(([tag,arr])=>{
      const tc=tagColors[tag]||'#00f2ff';

function fmtText(raw){
  if(!raw)return'';
  const blocks=[];let s=String(raw);
  s=s.replace(/```([\s\S]*?)```/g,(_,code)=>{const i=blocks.length;blocks.push(`<pre><code>${esc(code)}</code></pre>`);return`\x00B${i}\x00`;});
  s=s.replace(/`([^`\n]+)`/g,(_,code)=>{const i=blocks.length;blocks.push(`<code>${esc(code)}</code>`);return`\x00B${i}\x00`;});

  s=s.replace(/:([a-z0-9_+\-]{2,30}):/gi,(m,k)=>{
    const e=EMOJI_SHORTCODES[k.toLowerCase()];
    return e?e:m;
  });
  s=esc(s);
  s=s.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
  s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/\*(.+?)\*/g,'<em>$1</em>');
  s=s.replace(/~~(.+?)~~/g,'<s>$1</s>');
  s=s.replace(/__(.+?)__/g,'<u>$1</u>');
  
  const srvRoles=((typeof srvData!=='undefined'&&srvData&&srvData.customRoles)||[]).slice().sort((a,b)=>(b.name||'').length-(a.name||'').length);
  srvRoles.forEach(role=>{
    if(!role||!role.name)return;
    const col=role.color||'#00f2ff';
    const escName=esc(role.name);
    
    const reSafe=role.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    
    const re=new RegExp('@'+reSafe.replace(/ /g,'(?:\\s|&nbsp;)')+'(?![a-zA-Z0-9_])','gi');
    s=s.replace(re,`<span class="mention-role" data-ping="role" data-roleid="${esc(role.id)}" style="color:${esc(col)};background:${esc(col)}22">@${escName}</span>`);
  });
  
  s=s.replace(/@([a-zA-Z0-9_\-]+)/g,(full,u)=>{
    const low=u.toLowerCase();
    if(low==='everyone')return`<span class="mention-everyone" data-ping="everyone">@everyone</span>`;
    if(low==='here')return`<span class="mention-here" data-ping="here">@here</span>`;
    
    const role=srvRoles.find(r=>r.name&&r.name.toLowerCase()===low);
    if(role){const col=role.color||'#00f2ff';return`<span class="mention-role" data-ping="role" data-roleid="${esc(role.id)}" style="color:${esc(col)};background:${esc(col)}22">@${esc(role.name)}</span>`;}
    return`<span class="mention" data-ping="user" data-user="${esc(u)}">@${esc(u)}</span>`;
  });

  const srvChans=((typeof srvData!=='undefined'&&srvData&&Array.isArray(srvData.channels))?srvData.channels:[]);
  s=s.replace(/#([a-zA-Z0-9_\-]+)/g,(full,c)=>{
    const low=c.toLowerCase();
    const match=srvChans.find(ch=>(ch.name||'').toLowerCase()===low||(ch.id||'').toLowerCase()===low);
    if(match){
      return`<span class="mention-channel" data-ping="channel" data-channel="${esc(match.id)}" style="color:#00f2ff;background:rgba(179, 136, 255,.15);padding:1px 5px;border-radius:4px;cursor:pointer;font-weight:600">#${esc(match.name||match.id)}</span>`;
    }
    return full;
  });
  s=s.replace(/(https?:\/\/[^\s&lt;&quot;']+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  s=s.replace(/\n/g,'<br>');
  s=s.replace(/\x00B(\d+)\x00/g,(_,i)=>blocks[+i]);
  return s;
}

function _uiOverlay(innerHtml,opts={}){
  const wrap=document.createElement('div');
  wrap.style.cssText='position:fixed;inset:0;z-index:12500;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;animation:fadeIn .14s ease';
  const box=document.createElement('div');
  box.style.cssText='width:min(420px,92vw);background:linear-gradient(180deg,rgba(12,10,30,.98),rgba(4,3,14,.98));border:1px solid rgba(179, 136, 255,.3);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 0 40px rgba(179, 136, 255,.22)';
  box.innerHTML=innerHtml;
  wrap.appendChild(box);
  document.body.appendChild(wrap);
  return {wrap,box,close:()=>{try{wrap.remove();}catch(e){}}};
}
function uiConfirm(msg,opts={}){
  return new Promise(resolve=>{
    const title=opts.title||'Confirm';
    const ok=opts.okLabel||'Confirm';
    const cancel=opts.cancelLabel||'Cancel';
    const danger=opts.danger?'btn-danger':'btn-sub';
    const {wrap,box,close}=_uiOverlay(`
      <div style="font-family:var(--grotesk);font-weight:800;font-size:16px">${esc(title)}</div>
      <div style="font-size:13px;line-height:1.5;color:#d4d4e0">${esc(msg)}</div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
        <button type="button" class="btn-ghost" id="uiCancelBtn">${esc(cancel)}</button>
        <button type="button" class="${danger}" id="uiOkBtn">${esc(ok)}<lt;/button>
      </div>`);
    const done=v=>{close();document.removeEventListener('keydown',keyH);resolve(v);};
    box.querySelector('#uiOkBtn').onclick=()=>done(true);
    box.querySelector('#uiCancelBtn').onclick=()=>done(false);
    wrap.addEventListener('click',e=>{if(e.target===wrap)done(false);});
    function keyH(e){if(e.key==='Escape')done(false);else if(e.key==='Enter')done(true);}
    document.addEventListener('keydown',keyH);
    setTimeout(()=>box.querySelector('#uiOkBtn').focus(),50);
  });
}
function uiPrompt(msg,defaultVal='',opts={}){
  return new Promise(resolve=>{
    const title=opts.title||'Input';
    const {wrap,box,close}=_uiOverlay(`
      <div style="font-family:var(--grotesk);font-weight:800;font-size:16px">${esc(title)}</div>
      <div style="font-size:13px;line-height:1.5;color:#d4d4e0">${esc(msg)}</div>
      <input class="modal-inp" id="uiPromptInp" value="${esc(defaultVal||'')}" placeholder="${esc(opts.placeholder||'')}"/>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
        <button type="button" class="btn-ghost" id="uiCancelBtn">Cancel</button>
        <button type="button" class="btn-sub" id="uiOkBtn">OK</button>
      </div>`);
    const inp=box.querySelector('#uiPromptInp');
    const done=v=>{close();document.removeEventListener('keydown',keyH);resolve(v);};
    box.querySelector('#uiOkBtn').onclick=()=>done(inp.value);
    box.querySelector('#uiCancelBtn').onclick=()=>done(null);
    wrap.addEventListener('click',e=>{if(e.target===wrap)done(null);});
    function keyH(e){if(e.key==='Escape')done(null);else if(e.key==='Enter'&&document.activeElement===inp)done(inp.value);}
    document.addEventListener('keydown',keyH);
    setTimeout(()=>{inp.focus();inp.select();},60);
  });
}
function uiAlert(msg,opts={}){
  return new Promise(resolve=>{
    const title=opts.title||'Notice';

function toast(msg,type='info'){

  const icons={info:'fa-circle-info',success:'fa-circle-check',error:'fa-circle-exclamation',warning:'fa-triangle-exclamation'};
  const cols={info:'var(--cyan)',success:'var(--teal)',error:'var(--rose)',warning:'var(--gold)'};
  el.innerHTML=`<i class="fa-solid ${icons[type]||icons.info}" style="color:${cols[type]||cols.info};font-size:13px;flex-shrink:0;text-shadow:0 0 8px ${cols[type]||cols.info}"></i><span>${esc(msg)}</span>`;

  setTimeout(()=>{el.classList.add('bye');setTimeout(()=>el.remove(),200);},3500);
}

let _unread={srv:{},dm:{}};        
let _unreadPing={srv:{},dm:{}};    
let _unreadReady=false;            
let _lastRead={};                   
let _dmNotifBound=false;
let _dmListeners={};                

function _msgPingsMe(v){
  if(!v||!v.text||!me.username)return false;
  const txt=String(v.text);
  const myU=me.username.toLowerCase();
  const myD=(me.displayName||'').toLowerCase();
  
  if(/@(everyone|here)\b/i.test(txt))return true;
  const re=/@([a-z0-9_\-]+)/gi;
  let m;while((m=re.exec(txt))){
    const n=m[1].toLowerCase();
    if(n===myU||(myD&&n===myD))return true;
  }
  return false;
}

function _isCountableUnread(v){
  if(!v||(v.ts||0)===0)return false;
  if(v.username===me.username)return false;

  if(v.isLog||v.logType)return false;
  
  if(v.uid==='system'||v.username==='PeakBot'||v.userRole==='system'||v.isChangelogMirror){
    return _msgPingsMe(v);
  }
  return true;
}

async function initUnread(){
  
  const s=await db.ref('lastRead/'+me.username).once('value');
  const rawLR=s.val();
  _lastRead=rawLR||{srv:{},dm:{}};
  if(!_lastRead.srv)_lastRead.srv={};
  if(!_lastRead.dm)_lastRead.dm={};
  
  _unread={srv:{},dm:{}};
  _unreadPing={srv:{},dm:{}};
  const now=Date.now();
  const baselineUpdates={};
  const firstEverLogin=!rawLR;

  for(const srv of myServers){
    _unread.srv[srv.id]={};
    _unreadPing.srv[srv.id]={};
    const srvSnap=await db.ref('messages/'+srv.id).once('value');
    srvSnap.forEach(ch=>{
      const chId=ch.key;
      const lrMap=_lastRead.srv[srv.id]||{};
      const hasLR=Object.prototype.hasOwnProperty.call(lrMap,chId);
      if(!hasLR){
        
        _lastRead.srv[srv.id]=_lastRead.srv[srv.id]||{};
        _lastRead.srv[srv.id][chId]=now;
        baselineUpdates['lastRead/'+me.username+'/srv/'+srv.id+'/'+chId]=now;
        return;
      }
      const lr=lrMap[chId]||0;
      let cnt=0,pings=0;
      ch.forEach(m=>{
        const v=m.val()||{};
        if((v.ts||0)<=lr)return;
        if(!_isCountableUnread(v))return;
        cnt++;
        if(_msgPingsMe(v))pings++;
      });
      if(cnt)_unread.srv[srv.id][chId]=cnt;
      if(pings)_unreadPing.srv[srv.id][chId]=pings;
    });
  }
  
  const validDmIds=new Set(dmChannels.map(d=>d.id));
  for(const dm of dmChannels){
    const hasLR=Object.prototype.hasOwnProperty.call(_lastRead.dm||{},dm.id);
    if(!hasLR){
      
      _lastRead.dm=_lastRead.dm||{};
      _lastRead.dm[dm.id]=now;
      baselineUpdates['lastRead/'+me.username+'/dm/'+dm.id]=now;
      continue;
    }
    const lr=_lastRead.dm[dm.id]||0;
    const ms=await db.ref('dmMessages/'+dm.id).once('value');
    let cnt=0,pings=0;
    ms.forEach(m=>{
      const v=m.val()||{};
      if((v.ts||0)<=lr)return;
      if(!_isCountableUnread(v))return;
      cnt++;
      if(_msgPingsMe(v))pings++;
    });
    if(cnt)_unread.dm[dm.id]=cnt;
    if(pings)_unreadPing.dm[dm.id]=pings;
  }
  
  for(const k in _unread.dm){if(!validDmIds.has(k))delete _unread.dm[k];}
  for(const k in _unreadPing.dm){if(!validDmIds.has(k))delete _unreadPing.dm[k];}
  _unreadReady=true;
  
  if(Object.keys(baselineUpdates).length){
    db.ref().update(baselineUpdates).catch(e=>console.warn('baseline lastRead',e));
  }
  buildRail();
  if(G.view==='server')buildSide();
  renderDmNotif();
  if(G.view==='dm')renderDmList();
  
  _bindWatchStart=Date.now();
  for(const dm of dmChannels){_bindDmListener(dm.id);}
  for(const srv of myServers){_bindSrvUnreadListener(srv.id);}

  if(!window._dmAutoBindBound){
    window._dmAutoBindBound=true;
    db.ref('userDms/'+me.username).on('child_added',async snap=>{
      const dmId=snap.key;if(!dmId)return;
      if(_dmListeners[dmId])return;
      let isNew=false;
      try{
        const ch=await db.ref('dmChannels/'+dmId).once('value');
        if(!ch.exists())return;
        const d=ch.val();
        if(!dmChannels.find(x=>x.id===dmId)){
          dmChannels.push({id:dmId,...d});
          isNew=true;

          if(!Object.prototype.hasOwnProperty.call(_lastRead.dm||{},dmId)){
            _lastRead.dm=_lastRead.dm||{};_lastRead.dm[dmId]=Date.now();
            db.ref('lastRead/'+me.username+'/dm/'+dmId).set(Date.now()).catch(()=>{});
          }
        }
      }catch(e){console.warn('[dm] auto-bind fetch',e);}
      _bindDmListener(dmId);
      try{renderDmNotif();}catch(e){}
      try{if(G.view==='dm')renderDmList();}catch(e){}
      try{buildRail();}catch(e){}
    });
  }
}

let _bindWatchStart=0;

function _bindDmListener(dmId){
  if(_dmListeners[dmId])return;
  const ref=db.ref('dmMessages/'+dmId);

  const localLR=(_lastRead.dm||{})[dmId]||0;
  const cb=ref.on('child_added',snap=>{
    const v=snap.val()||{};
    if(!v.ts)return;
    if(v.ts<=localLR)return; 
    if(v.username===me.username)return;

    const dmObj=dmChannels.find(d=>d.id===dmId);
    if(dmObj){
      dmObj.lastMsgTs=Math.max(dmObj.lastMsgTs||0,v.ts||0);
      dmObj.lastMsgFrom=v.username||'';
    }
    const lr=(_lastRead.dm||{})[dmId]||0;
    if(v.ts<=lr)return;
    if(G.view==='dm'&&G.dmChannel===dmId){markDmRead(dmId,v.ts);return;}
    if(window._dmActiveId===dmId)return;

    if(!_isCountableUnread(v))return;
    _unread.dm[dmId]=(_unread.dm[dmId]||0)+1;
    if(_msgPingsMe(v))_unreadPing.dm[dmId]=(_unreadPing.dm[dmId]||0)+1;
    renderDmNotif(v,dmId);
    if(G.view==='dm')renderDmList();
    buildRail();
  });
  _dmListeners[dmId]={ref,cb};
}

function _bindSrvUnreadListener(srvId){
  const ref=db.ref('messages/'+srvId);
  ref.on('child_added',chSnap=>{
    const chId=chSnap.key;
    const chRef=db.ref('messages/'+srvId+'/'+chId);
    chRef.on('child_added',s=>{
      const v=s.val()||{};
      if(!v.ts||v.ts<_bindWatchStart)return;   
      if(v.username===me.username)return;
      const lr=(_lastRead.srv[srvId]||{})[chId]||0;
      if(v.ts<=lr)return;
      if(G.view==='server'&&G.srvId===srvId&&G.channel===chId){markChRead(srvId,chId,v.ts);return;}
      
      if(!_isCountableUnread(v))return;
      _unread.srv[srvId]=_unread.srv[srvId]||{};
      _unread.srv[srvId][chId]=(_unread.srv[srvId][chId]||0)+1;
      if(_msgPingsMe(v)){
        _unreadPing.srv[srvId]=_unreadPing.srv[srvId]||{};
        _unreadPing.srv[srvId][chId]=(_unreadPing.srv[srvId][chId]||0)+1;
      }
      if(G.view==='server'&&G.srvId===srvId)buildSide();
      buildRail();
    });
  });
}

async function markChRead(srvId,chId,ts){
  
  ts=Math.max(ts||0,Date.now())+1;
  _lastRead.srv=_lastRead.srv||{};_lastRead.srv[srvId]=_lastRead.srv[srvId]||{};
  _lastRead.srv[srvId][chId]=ts;
  _unread.srv[srvId]=_unread.srv[srvId]||{};delete _unread.srv[srvId][chId];
  _unreadPing.srv[srvId]=_unreadPing.srv[srvId]||{};delete _unreadPing.srv[srvId][chId];
  try{await db.ref('lastRead/'+me.username+'/srv/'+srvId+'/'+chId).set(ts);}catch(e){}
  if(G.view==='server'&&G.srvId===srvId)buildSide();
  buildRail();
}
async function markDmRead(dmId,ts){
  ts=Math.max(ts||0,Date.now())+1;
  _lastRead.dm=_lastRead.dm||{};_lastRead.dm[dmId]=ts;
  delete _unread.dm[dmId];
  delete _unreadPing.dm[dmId];

  if(window._dmNotifDismissed&&window._dmNotifDismissed.id===dmId){window._dmNotifDismissed=null;}

  try{
    const box=document.getElementById('dmNotif');
    if(box){box.style.display='none';box.innerHTML='';}
    if(window._dmNotifHideTimer){clearTimeout(window._dmNotifHideTimer);window._dmNotifHideTimer=null;}
  }catch(e){}
  try{await db.ref('lastRead/'+me.username+'/dm/'+dmId).set(ts);}catch(e){}
  renderDmNotif();
  if(G.view==='dm')renderDmList();
  buildRail();
}

function dmHasUnread(dm){
  if(!dm||!dm.id)return false;
  
  if(G.view==='dm'&&G.dmChannel===dm.id)return false;
  if(window._dmActiveId===dm.id)return false;
  const lr=(_lastRead&&_lastRead.dm&&_lastRead.dm[dm.id])||0;
  const last=dm.lastMsgTs||dm.createdAt||0;
  if(last<=lr)return false;

  if(dm.lastMsgFrom&&dm.lastMsgFrom===me.username)return false;
  return true;
}

function dmUnreadDisplayCount(dm){
  if(!dm)return 0;
  const cnt=(_unread.dm&&_unread.dm[dm.id])||0;
  if(dmHasUnread(dm))return Math.max(1,cnt);
  return 0;
}
function dmHasPing(dm){
  if(!dm||!dm.id)return false;
  if(!dmHasUnread(dm))return false;
  return ((_unreadPing.dm||{})[dm.id]||0)>0;
}

function srvUnreadTotal(srvId){
  const m=_unread.srv[srvId]||{};let t=0;for(const k in m)t+=m[k];return t;
}
function srvPingTotal(srvId){
  const m=_unreadPing.srv[srvId]||{};let t=0;for(const k in m)t+=m[k];return t;
}

function dmUnreadTotal(){
  if(!_unreadReady)return 0;
  let t=0;
  if(Array.isArray(dmChannels)){
    for(const dm of dmChannels){
      if(dmHasUnread(dm)){
        t+=Math.max(1,(_unread.dm&&_unread.dm[dm.id])||0);
      }
    }
  }
  return t;
}

function renderDmNotif(latestMsg,dmId){
  const total=dmUnreadTotal();
  const box=document.getElementById('dmNotif');if(!box)return;
  try{updateDmTopLeft();updateRailUnreadAv();}catch(e){}

  if(!total||G.view==='dm'){
    if(window._dmNotifHideTimer){clearTimeout(window._dmNotifHideTimer);window._dmNotifHideTimer=null;}
    box.style.display='none';box.innerHTML='';return;
  }

  if(dmId&&window._dmNotifDismissed&&window._dmNotifDismissed.id===dmId){
    window._dmNotifDismissed=null;
  }

  let best=null,bestTs=0,bestCnt=0;
  if(dmId){
    const passed=dmChannels.find(d=>d.id===dmId);
    if(passed&&dmHasUnread(passed)){
      best=dmId;
      bestTs=passed.lastMsgTs||0;
      bestCnt=(_unread.dm&&_unread.dm[dmId])||1;
    }
  }
  if(!best){
    for(const d of dmChannels){
      if(!dmHasUnread(d))continue;
      const ts=d.lastMsgTs||d.createdAt||0;
      if(ts>=bestTs){best=d.id;bestTs=ts;bestCnt=(_unread.dm&&_unread.dm[d.id])||1;}
    }
  }
  if(!best){box.style.display='none';return;}
  const dm=dmChannels.find(d=>d.id===best);
  if(!dm){box.style.display='none';return;}

  if(window._dmNotifDismissed&&window._dmNotifDismissed.id===best&&window._dmNotifDismissed.cnt>=bestCnt&&!dmId){
    box.style.display='none';return;
  }
  
  let senderUser=null;
  if(latestMsg&&latestMsg.username&&latestMsg.username!==me.username)senderUser=latestMsg.username;
  else senderUser=(dm.participants||[]).find(p=>p!==me.username);
  const _prof=(window._userProfiles&&window._userProfiles[senderUser])||{};
  const displayName=_prof.displayName||senderUser||'Unknown';
  const _avUrl=_prof.avatarUrl||(window._userAvCache||{})[senderUser]||'';
  
  const dmCount=Math.max(1,(_unread.dm&&_unread.dm[best])||0);
  const subLabel=total>dmCount
    ? `${dmCount} new message${dmCount===1?'':'s'} from ${displayName} · ${total-dmCount} more elsewhere`
    : `${dmCount} new message${dmCount===1?'':'s'} — click to open`;
  box.innerHTML=`<div class="dm-notif-av">${avHtml(senderUser||displayName,_avUrl,26)}</div>
    <div class="dm-notif-txt">
      <div class="dm-notif-label"><i class="fa-solid fa-envelope" style="margin-right:3px;font-size:7px"></i>NEW DM</div>
      <div class="dm-notif-user">${esc(displayName)}</div>
      <div class="dm-notif-cnt">${esc(subLabel)}</div>
    </div>
    <button class="dm-notif-close" title="Dismiss"><i class="fa-solid fa-xmark"></i></button>`;
  
  if(senderUser&&(!_prof.displayName||_prof.avatarUrl===undefined)){
    _fetchProfile(senderUser,()=>{try{renderDmNotif(latestMsg,dmId);}catch(e){}});
  }
  box.style.display='flex';

  if(window._dmNotifHideTimer){clearTimeout(window._dmNotifHideTimer);}
  window._dmNotifHideTimer=setTimeout(()=>{
    try{
      const cur=document.getElementById('dmNotif');
      if(cur)cur.style.display='none';
    }catch(e){}
  },7000);
  box.onclick=e=>{
    if(e.target.closest('.dm-notif-close')){
      e.stopPropagation();
      box.style.display='none';
      
      window._dmNotifDismissed={id:best,cnt:bestCnt};
      if(window._dmNotifHideTimer){clearTimeout(window._dmNotifHideTimer);window._dmNotifHideTimer=null;}
      return;
    }

    if(window._dmNotifHideTimer){clearTimeout(window._dmNotifHideTimer);window._dmNotifHideTimer=null;}
    box.style.display='none';
    if(G.view==='server'&&G.srvId)G.lastSrvId=G.srvId;
    showDMScreen();openDM(best);
  };
}

function updateRailUnreadAv(){
  
  const el=document.getElementById('railUnreadAv');
  if(el){el.classList.remove('on');el.style.display='none';}

  if(window._railBuilding)return;
  if(window._railRefreshTimer)return;
  window._railRefreshTimer=setTimeout(()=>{
    window._railRefreshTimer=null;
    try{
      window._railBuilding=true;
      buildRail();
    }catch(e){console.warn('rail rebuild',e);}
    finally{window._railBuilding=false;}
  },80);
}

function updateDmTopLeft(){
  const el=document.getElementById('dmTopLeft');
  if(el){el.classList.remove('on');el.style.display='none';el.innerHTML='';}
}

function showPingPopup(d){
  const bg=document.getElementById('pingPopupBg');
  const box=document.getElementById('pingPopup');
  if(!bg||!box)return;
  const who=d.from||'Someone';
  const _whoProf=(window._userProfiles&&window._userProfiles[who])||{};
  const whoDisplay=_whoProf.displayName||who;
  const where=d.isDM
    ? (d.isGroup||d.server==='Group DM'?`Group DM · ${d.channel||''}`:`Direct Message · @${who}`)
    : (d.server?`${d.server} · #${d.channel||'?'}`:(d.channel?'#'+d.channel:''));
  const pingTypeLabel={
    everyone:'@EVERYONE MENTION',
    here:'@HERE MENTION',
    role:'ROLE MENTION',
    user:d.isDM?'DM MENTION':'DIRECT MENTION'
  }[d.pingType||'user']||(d.isDM?'DM MENTION':'MENTION');
  const _liveAv=d.fromAvatar||_whoProf.avatarUrl||'';
  const avatarImg=avHtml(who,_liveAv,54);
  box.innerHTML=`
    <div class="ping-pop-title">\u26a1 YOU WERE PINGED</div>
    <div class="ping-pop-sub">${esc(pingTypeLabel)}</div>
    <div class="ping-pop-sender">
      ${avatarImg}
      <div>
        <div class="ping-pop-who">${esc(whoDisplay)}</div>
        <div class="ping-pop-where">${esc(where||'Direct')}</div>
      </div>
    </div>
    <div class="ping-pop-msg">${fmtText(d.text||'(no preview)')}</div>
    <div class="ping-pop-actions">
      <button class="btn-ghost" id="pingPopDismiss">Dismiss</button>
      <button class="btn-sub" id="pingPopJump">${d.isDM?'Open DM':'Jump to Message'}</button>
    </div>`;
  bg.classList.add('on');
  const close=()=>{bg.classList.remove('on');};
  box.querySelector('#pingPopDismiss').onclick=close;
  box.querySelector('#pingPopJump').onclick=async()=>{
    close();
    try{
      if(d.isDM&&d.dmId){
        if(G.view==='server'&&G.srvId)G.lastSrvId=G.srvId;
        showDMScreen();openDM(d.dmId);
        return;
      }
      if(d.srvId&&d.channel){
        if(G.srvId!==d.srvId){await joinServer(d.srvId);}
        if(typeof joinCh==='function')joinCh(d.channel);
      }
    }catch(e){console.error('jump failed',e);}
  };
  
  setTimeout(()=>{if(bg.classList.contains('on'))close();},7000);
  
}

auth.onAuthStateChanged(async user=>{
  if(user&&!booted&&!me.username){
    const email=user.email||'';
    if(!email.endsWith('@peakchat.app')){auth.signOut();return;}
    
    try{
      const cached=JSON.parse(localStorage.getItem('pc_session')||'{}');
      if(cached.uid===user.uid&&cached.username){
        
        const ok=await db.ref('users/'+cached.username).once('value');
        if(ok.exists()){me.username=cached.username;boot();return;}
      }
    }catch(e){}
    
    let found=null;
    try{
      const idx=await db.ref('uidIndex/'+user.uid).once('value');
      if(idx.exists())found=idx.val();
    }catch(e){}
    if(!found){
      try{
        const snap=await db.ref('users').once('value');
        snap.forEach(c=>{if(uToEmail(c.key)===email)found=c.key;});
      }catch(e){console.error('user scan failed',e);}
    }
    if(found){
      try{localStorage.setItem('pc_session',JSON.stringify({uid:user.uid,username:found}));}catch(e){}
      
      try{db.ref('uidIndex/'+user.uid).set(found);}catch(e){}
      me.username=found;boot();
    }else{
      console.warn('No user profile found for uid',user.uid,'— signing out');
      auth.signOut();
    }
  }else if(!user){
    try{localStorage.removeItem('pc_session');}catch(e){}

    try{if(typeof _teardownLive==='function')_teardownLive();}catch(e){}
    try{
      if(window._globalBanListeners){
        Object.values(window._globalBanListeners).forEach(L=>{try{L.ref.off('value',L.cb);}catch(e){}});
        window._globalBanListeners={};
      }
      if(window._userServersWatcher){try{window._userServersWatcher.ref.off('value',window._userServersWatcher.cb);}catch(e){}window._userServersWatcher=null;}
      if(window._banListener){try{window._banListener.ref.off('value',window._banListener.cb);}catch(e){}window._banListener=null;}
      if(window._timeoutListener){try{window._timeoutListener.ref.off('value',window._timeoutListener.cb);}catch(e){}window._timeoutListener=null;}
    }catch(e){}
    booted=false; 
  }
});

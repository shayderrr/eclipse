let _mentionState={open:false,items:[],idx:0,start:-1,end:-1,input:null};
function _closeMentionBox(){
  _mentionState.open=false;_mentionState.items=[];_mentionState.idx=0;
  const el=document.getElementById('mentionBox');
  if(el){el.classList.remove('on');el.dataset.itemCount='';el.innerHTML='';}
}
function updateMentionBox(inp){
  if(!inp){_closeMentionBox();return;}
  const val=inp.value||'';
  const pos=inp.selectionStart||0;
  
  if(val.startsWith('/')&&!val.includes(' ')){
    const q=val.slice(1).toLowerCase();
    const cmds=(typeof SLASH_COMMANDS!=='undefined'?SLASH_COMMANDS:[]).filter(c=>
      !q||c.name.startsWith(q)
    ).filter(c=>!c.perm||hasPerm(c.perm));
    if(!cmds.length){_closeMentionBox();return;}
    _mentionState.open=true;
    _mentionState.items=cmds.map(c=>({type:'slash',name:c.name,desc:c.desc}));
    _mentionState.idx=Math.min(_mentionState.idx,cmds.length-1);
    if(_mentionState.idx<0)_mentionState.idx=0;
    _mentionState.start=0;_mentionState.end=pos;_mentionState.input=inp;
    _renderMentionBox(true);
    _positionMentionBox(inp);
    return;
  }

  let colonStart=-1;
  for(let i=pos-1;i>=0;i--){
    const c=val[i];
    if(c===':'){colonStart=i;break;}
    if(!/[a-z0-9_+\-]/i.test(c))break;
    if(i<pos-30)break;
  }
  if(colonStart>=0&&pos-colonStart>=2){
    
    const prev=colonStart===0?' ':val[colonStart-1];
    if(/[\s\(\[\,.]/.test(prev)){
      const q=val.slice(colonStart+1,pos).toLowerCase();
      
      if(q.length>=1&&q.length<=24&&!/:/.test(q)){
        const matches=Object.entries(EMOJI_SHORTCODES)
          .filter(([k])=>k.startsWith(q))
          .slice(0,8);
        if(matches.length){
          _mentionState.open=true;
          _mentionState.items=matches.map(([k,v])=>({type:'emoji',name:k,emoji:v}));
          _mentionState.idx=Math.min(_mentionState.idx,matches.length-1);
          if(_mentionState.idx<0)_mentionState.idx=0;
          _mentionState.start=colonStart;_mentionState.end=pos;_mentionState.input=inp;
          _renderMentionBox(true);
          _positionMentionBox(inp);
          return;
        }
      }
    }
  }
  
  let start=-1;
  for(let i=pos-1;i>=0;i--){
    const c=val[i];
    if(c==='@'){start=i;break;}
    if(c==='\n'||c===' '&&i<pos-1&&val[i-1]===' ')break; 
    if(i<pos-30)break; 
  }
  if(start<0){_closeMentionBox();return;}
  
  if(start>0){
    const prev=val[start-1];
    if(!/[\s\(\[\,]/.test(prev)){_closeMentionBox();return;}
  }
  const q=val.slice(start+1,pos).toLowerCase();
  
  if(q.length>30){_closeMentionBox();return;}
  
  const items=[];
  
  if('everyone'.startsWith(q))items.push({type:'special',name:'everyone',desc:'Notify all members',color:'#ff4fd8'});
  if('here'.startsWith(q))items.push({type:'special',name:'here',desc:'Notify online members',color:'#ffc832'});
  
  const roles=(srvData&&srvData.customRoles)||[];
  roles.forEach(r=>{
    if(!r||!r.name||r.mentionable===false)return;
    if(r.name.toLowerCase().includes(q))items.push({type:'role',name:r.name,id:r.id,color:r.color||'#00f2ff',desc:'Custom role'});
  });

  const mems=(srvData&&srvData.members)||{};
  Object.keys(mems).forEach(u=>{
    if(u===me.username)return;
    const prof=(window._userProfiles||{})[u]||{};
    const dn=(prof.displayName||u).toLowerCase();
    const ul=u.toLowerCase();
    if(!q||ul.includes(q)||dn.includes(q))items.push({type:'user',name:u,desc:'@'+u});
  });

  const profCache=window._userProfiles||{};
  Object.keys(profCache).forEach(u=>{
    if(u===me.username)return;
    if(items.some(x=>x.type==='user'&&x.name===u))return;
    const prof=profCache[u]||{};
    const dn=(prof.displayName||u).toLowerCase();
    const ul=u.toLowerCase();
    if(q&&(ul.includes(q)||dn.includes(q)))items.push({type:'user',name:u,desc:'@'+u});
  });
  if(!items.length){_closeMentionBox();return;}
  _mentionState.open=true;

  _mentionState.items=items.slice(0,30);
  _mentionState.idx=Math.min(_mentionState.idx,_mentionState.items.length-1);
  if(_mentionState.idx<0)_mentionState.idx=0;
  _mentionState.start=start;
  _mentionState.end=pos;
  _mentionState.input=inp;
  _renderMentionBox();
  _positionMentionBox(inp);
}
function _positionMentionBox(inp){
  const el=document.getElementById('mentionBox');if(!el)return;
  const r=inp.getBoundingClientRect();
  const h=Math.min(260,el.offsetHeight||260);
  const top=Math.max(12,r.top-h-6);
  el.style.left=r.left+'px';
  el.style.top=top+'px';
  el.style.width=Math.min(360,Math.max(260,r.width*0.6))+'px';
}
function _renderMentionBox(slashMode){
  const el=document.getElementById('mentionBox');if(!el)return;
  const items=_mentionState.items;
  const isSlash=slashMode||items.some(x=>x.type==='slash');
  const isEmoji=items.some(x=>x.type==='emoji');
  const hdr=isEmoji?'<div class="mh-header">EMOJI</div>':(isSlash?'<div class="mh-header">SLASH COMMANDS</div>':(items.some(x=>x.type==='special')?'<div class="mh-header">SUGGESTIONS</div>':''));
  const needsBuild=el.dataset.itemCount!==String(items.length)||!el.firstElementChild;
  if(needsBuild){
    el.innerHTML=hdr+items.map((it,i)=>{
      const active=i===_mentionState.idx?' active':'';
      let ic='';
      if(it.type==='emoji')ic=`<div class="mh-cmd" style="font-size:18px;background:transparent;border:none">${it.emoji}</div>`;
      else if(it.type==='slash')ic=`<div class="mh-cmd"><i class="fa-solid fa-slash"></i></div>`;
      else if(it.type==='user')ic=`<div class="mh-av">${avHtml(it.name,(window._userProfiles&&window._userProfiles[it.name]&&window._userProfiles[it.name].avatarUrl)||'',24)}</div>`;
      else if(it.type==='role')ic=`<div class="mh-dot" style="background:${esc(it.color)};box-shadow:0 0 8px ${esc(it.color)}"></div>`;
      else ic=`<div class="mh-dot" style="background:${esc(it.color)};box-shadow:0 0 8px ${esc(it.color)}"></div>`;
      const nmColor=it.type==='role'?`color:${esc(it.color)}`:(it.type==='slash'?'color:var(--cyan)':(it.type==='emoji'?'color:var(--txt)':''));
      const prefix=it.type==='slash'?'/':(it.type==='emoji'?':':'@');
      const suffix=it.type==='emoji'?':':'';
      const showName=it.type==='user'?((window._userProfiles&&window._userProfiles[it.name]&&window._userProfiles[it.name].displayName)||it.name):it.name;
      return `<div class="mh-item${active}" data-mh-idx="${i}">${ic}<div class="mh-nm" style="${nmColor}">${prefix}${esc(showName)}${suffix}</div><div class="mh-sub">${esc(it.desc||'')}</div></div>`;
    }).join('');
    el.dataset.itemCount=String(items.length);
    el.querySelectorAll('[data-mh-idx]').forEach(r=>{
      
      r.addEventListener('mouseover',()=>{
        const i=+r.dataset.mhIdx;
        if(_mentionState.idx===i)return;
        _mentionState.idx=i;
        el.querySelectorAll('.mh-item').forEach(x=>x.classList.remove('active'));
        r.classList.add('active');
      });
      
      const pick=e=>{
        e.preventDefault();e.stopPropagation();
        _mentionState.idx=+r.dataset.mhIdx;
        _applyMentionPick(_mentionState.input);
      };
      r.addEventListener('pointerdown',pick);
      r.addEventListener('mousedown',pick);
      r.addEventListener('touchstart',pick,{passive:false});
    });
  }else{
    
    el.querySelectorAll('.mh-item').forEach((x,i)=>x.classList.toggle('active',i===_mentionState.idx));
  }
  el.classList.add('on');
}
function _applyMentionPick(inp){
  if(!inp||!_mentionState.open)return;
  const it=_mentionState.items[_mentionState.idx];if(!it){_closeMentionBox();return;}
  const before=inp.value.slice(0,_mentionState.start);
  const after=inp.value.slice(_mentionState.end);
  let insert;
  if(it.type==='emoji'){

    insert=it.emoji+' ';
  }else{
    const prefix=it.type==='slash'?'/':'@';
    insert=prefix+it.name+' ';
  }
  inp.value=before+insert+after;
  const newPos=before.length+insert.length;
  inp.setSelectionRange(newPos,newPos);
  _closeMentionBox();
  inp.focus();
  grow(inp);
}

function isStaff(){

  const r=(me.role||'member').toLowerCase();
  return r==='owner'||r==='admin'||r==='officer';
}

function buildSide(){
  if(G.view!=='server')return;
  const sn=document.getElementById('srvHdName');if(sn)sn.textContent=srvData.name;
  const scroll=document.getElementById('sideScroll');if(!scroll)return;
  scroll.innerHTML='';
  const staff=isStaff();
  const hiddenCatIds=new Set((srvData.categories||[]).filter(c=>c.staffOnly&&!staff).map(c=>c.id));
  const catMap={};
  
  const sortedCats=(srvData.categories||[]).slice().sort((a,b)=>(a.position||0)-(b.position||0))
    .filter(c=>!hiddenCatIds.has(c.id));
  sortedCats.forEach(c=>{catMap[c.id]=[];});
  const uncatd=[];
  srvData.channels.forEach(ch=>{
    if(ch.staffOnly&&!staff)return;                       
    if(ch.categoryId&&hiddenCatIds.has(ch.categoryId))return; 
    if(ch.categoryId&&catMap[ch.categoryId])catMap[ch.categoryId].push(ch);
    else uncatd.push(ch);
  });
  
  Object.keys(catMap).forEach(k=>catMap[k].sort((a,b)=>(a.position||0)-(b.position||0)));
  uncatd.sort((a,b)=>(a.position||0)-(b.position||0));
  const canMgr=hasPerm('manageChannels');
  sortedCats.forEach(cat=>{
    const chs=catMap[cat.id]||[];
    const catEl=document.createElement('div');
    catEl.className='cat-row';
    catEl.dataset.catid=cat.id;
    catEl.innerHTML=`<span class="cat-name">${esc(cat.name)}</span>${canMgr?`<button class="cat-add" data-catid="${eattr(cat.id)}" title="New channel"><i class="fa-solid fa-plus"></i></button>`:''}`;
    if(canMgr){
      catEl.querySelector('.cat-add')?.addEventListener('click',e=>{e.stopPropagation();showCreateCh(cat.id);});
      catEl.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();showCatCtx(e,cat);});
      
      catEl.draggable=true;
      catEl.addEventListener('dragstart',e=>{
        e.dataTransfer.effectAllowed='move';
        e.dataTransfer.setData('text/plain','cat:'+cat.id);
        catEl.classList.add('dragging');
      });
      catEl.addEventListener('dragend',()=>catEl.classList.remove('dragging'));
      catEl.addEventListener('dragover',e=>{
        const d=e.dataTransfer.types.includes('text/plain');
        if(!d)return;
        e.preventDefault();e.dataTransfer.dropEffect='move';
        catEl.classList.add('drag-over');
      });
      catEl.addEventListener('dragleave',()=>catEl.classList.remove('drag-over'));
      catEl.addEventListener('drop',async e=>{
        e.preventDefault();catEl.classList.remove('drag-over');
        const raw=e.dataTransfer.getData('text/plain');
        if(!raw)return;
        if(raw.startsWith('cat:')){
          const srcCatId=raw.slice(4);
          if(srcCatId===cat.id)return;
          await handleCatDrop(srcCatId,cat.id);
        }else{
          
          if(raw===cat.id)return;
          await handleChDropToCat(raw,cat.id);
        }
      });
    }
    scroll.appendChild(catEl);
    chs.forEach(ch=>renderChRow(ch,scroll));
  });
  uncatd.forEach(ch=>renderChRow(ch,scroll));
  
  scroll.oncontextmenu=e=>{
    if(e.target.closest('.ch-row')||e.target.closest('.cat-row'))return;
    e.preventDefault();
    if(!canMgr){toast('No permission to manage channels','error');return;}
    const items=[
      {label:'Create Channel',icon:'fa-plus',fn:()=>showCreateCh()},
      {label:'Create Category',icon:'fa-folder-plus',fn:showCreateCat},
      {sep:true},
      {label:'Invite People',icon:'fa-user-plus',fn:showInvite}
    ];
    if(hasPerm('manageServer'))items.push({label:'Server Settings',icon:'fa-gear',fn:showServerSettings});
    showCtxItems(e.clientX,e.clientY,items);
  };
}

async function handleCatDrop(srcId,tgtId){
  const cats=(srvData.categories||[]).slice().sort((a,b)=>(a.position||0)-(b.position||0));
  const srcIdx=cats.findIndex(c=>c.id===srcId);
  const tgtIdx=cats.findIndex(c=>c.id===tgtId);
  if(srcIdx<0||tgtIdx<0)return;
  const[src]=cats.splice(srcIdx,1);
  cats.splice(tgtIdx,0,src);
  const batch={};
  cats.forEach((c,i)=>{batch['servers/'+G.srvId+'/categories/'+c.id+'/position']=i;});
  try{await db.ref().update(batch);toast('Category moved','success');}
  catch(e){toast('Move failed: '+(e.message||e.code),'error');}
}

async function handleChDropToCat(chId,catId){
  const batch={};
  batch['servers/'+G.srvId+'/channels/'+chId+'/categoryId']=catId;
  
  const peers=srvData.channels.filter(c=>(c.categoryId||'')===catId&&c.id!==chId);
  batch['servers/'+G.srvId+'/channels/'+chId+'/position']=peers.length;
  try{await db.ref().update(batch);toast('Channel moved to category','success');}
  catch(e){toast('Move failed: '+(e.message||e.code),'error');}
}

function renderChRow(ch,parent){
  const myLvl=(ROLES[me.role]||ROLES.member).level;
  const minLvl=(ROLES[ch.minRole||'member']||ROLES.member).level;
  if(myLvl<minLvl)return;
  const row=document.createElement('div');
  row.className='ch-row'+(ch.id===G.channel?' on':'');
  const ico='fa-hashtag';
  const canMgr=hasPerm('manageChannels');
  const unread=((_unread.srv[G.srvId]||{})[ch.id]||0);
  const pingCnt=((_unreadPing.srv[G.srvId]||{})[ch.id]||0);
  
  let badge='';
  if(pingCnt){
    badge=`<span class="unread-badge" style="margin-right:4px" title="${pingCnt} mention${pingCnt===1?'':'s'}">${pingCnt>99?'99+':pingCnt}</span>`;
  }else if(unread){
    badge=`<span class="unread-dot-sm" style="margin-right:6px" title="${unread} new message${unread===1?'':'s'}"></span>`;
  }
  row.innerHTML=`<i class="fa-solid ${ico} ch-ico"></i><span class="ch-nm">${esc(ch.name)}</span>${badge}${canMgr?`<div class="ch-acts"><button class="ch-act-btn" data-chid="${eattr(ch.id)}" title="Edit"><i class="fa-solid fa-gear"></i></button></div>`:''}`;
  if(unread&&!row.classList.contains('on')){row.style.fontWeight='700';row.style.color='var(--text)';row.classList.add('ch-row-unread');}
  if(canMgr)row.querySelector('.ch-act-btn')?.addEventListener('click',e=>{e.stopPropagation();editChannel(ch.id);});
  row.addEventListener('contextmenu',e=>{e.preventDefault();showChCtx(e,ch);});
  row.onclick=()=>joinCh(ch.id);
  // Drag-and-drop reordering (admins only)
  if(canMgr){
    row.draggable=true;
    row.dataset.chid=ch.id;
    row.dataset.catid=ch.categoryId||'';
    row.addEventListener('dragstart',e=>{
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',ch.id);
      row.classList.add('dragging');
    });
    row.addEventListener('dragend',()=>row.classList.remove('dragging'));
    row.addEventListener('dragover',e=>{
      e.preventDefault();e.dataTransfer.dropEffect='move';
      row.classList.add('drag-over');
    });
    row.addEventListener('dragleave',()=>row.classList.remove('drag-over'));
    row.addEventListener('drop',async e=>{
      e.preventDefault();
      row.classList.remove('drag-over');
      const srcId=e.dataTransfer.getData('text/plain');
      if(!srcId||srcId===ch.id)return;
      await handleChDrop(srcId,ch.id);
    });
  }
  parent.appendChild(row);
}

async function handleChDrop(srcId,tgtId){
  const src=srvData.channels.find(c=>c.id===srcId);
  const tgt=srvData.channels.find(c=>c.id===tgtId);
  if(!src||!tgt)return;
  
  const catId=tgt.categoryId||'';
  const peers=srvData.channels.filter(c=>(c.categoryId||'')===catId&&c.id!==srcId).sort((a,b)=>(a.position||0)-(b.position||0));
  const tgtIdx=peers.findIndex(c=>c.id===tgtId);
  peers.splice(tgtIdx,0,src);
  const batch={};
  peers.forEach((c,i)=>{
    batch['servers/'+G.srvId+'/channels/'+c.id+'/position']=i;
    if((c.categoryId||'')!==catId)batch['servers/'+G.srvId+'/channels/'+c.id+'/categoryId']=catId;
  });
  try{await db.ref().update(batch);toast('Channel moved','success');}
  catch(e){toast('Move failed: '+(e.message||e.code),'error');}
}

let _chListenerRefs=[]; 
let _lastDayStr='';
function _detachChListeners(){
  _chListenerRefs.forEach(x=>{try{x.ref.off(x.event,x.cb);}catch(e){}});
  _chListenerRefs=[];
}
function joinCh(id){
  if(G.view!=='server')return;
  const chCheck=srvData.channels.find(c=>c.id===id);
  const catCheck=chCheck&&chCheck.categoryId?(srvData.categories||[]).find(c=>c.id===chCheck.categoryId):null;
  if((chCheck&&chCheck.staffOnly)||(catCheck&&catCheck.staffOnly)){
    if(!isStaff()){
      toast("That channel is staff-only",'error');
      const pub=srvData.channels.find(c=>!c.staffOnly&&!((srvData.categories||[]).find(cc=>cc.id===c.categoryId&&cc.staffOnly)));
      if(pub)id=pub.id; else return;
    }
  }
  
  _detachChListeners();
  delete listeners[G.channel];
  G.channel=id;G.reply=null;lastMsg={uid:'',ts:0};_lastDayStr='';
  cancelReply();
  
  if(G.srvId){try{const m=JSON.parse(localStorage.getItem('qc_lastSrvCh')||'{}');m[G.srvId]=id;localStorage.setItem('qc_lastSrvCh',JSON.stringify(m));}catch(e){}}
  
  if(G.srvId)markChRead(G.srvId,id,Date.now());
  const ch=srvData.channels.find(c=>c.id===id)||{id,name:id,topic:'',type:'text'};
  const topName=document.getElementById('topName');if(!topName)return;
  topName.textContent=ch.name;
  const topTopic=document.getElementById('topTopic');if(topTopic)topTopic.textContent=ch.topic||'';
  const topIcon=document.getElementById('topIcon');if(topIcon)topIcon.className='fa-solid fa-hashtag tb-icon';
  const msgInput=document.getElementById('msgInput');
  if(msgInput){
    const ro=ch.readOnly&&!hasPerm('manageMessages');
    msgInput.disabled=ro;
    
    let ph='Message #'+ch.name;
    if(ch.type==='wordle')ph='Type a 5-letter word and hit Enter to guess';
    else if(ch.type==='counting')ph='Send the next number to continue counting';
    else if(ch.type==='suggestions'){ph='Suggestions — use "New Suggestion" button above';msgInput.disabled=true;}
    else if(ch.type==='role-suggest'){ph='Role requests — use "Request a Role" button above';msgInput.disabled=true;}
    else if(ch.type==='reaction-roles'){ph='Reaction-roles channel — click a button above';msgInput.disabled=true;}
    else if(ch.type==='user-suggestions'){ph='User-suggestions channel — use the buttons above';msgInput.disabled=true;}
    else if(ch.type==='truth-or-dare'){ph='Use the Truth / Dare buttons above';msgInput.disabled=true;}
    else if(ch.type==='poll-of-the-day'){ph='Poll of the Day — vote on the latest poll above';msgInput.disabled=true;}
    else if(ch.type==='question-of-the-day'){ph='Question of the Day — open the thread to answer';msgInput.disabled=true;}
    msgInput.placeholder=ro?'This channel is read-only':ph;
    
    if((ch.type==='wordle'||ch.type==='counting')&&!ro){setTimeout(()=>{try{msgInput.focus();}catch(e){}},80);}
  }
  updateSlowBar();
  buildSide();
  
  const feed=document.getElementById('msgs');if(!feed)return;
  feed.innerHTML='';lastMsg={uid:'',ts:0};_lastDayStr='';allMsgs=[];
  const col=hue(ch.name);
  const wb=document.createElement('div');wb.className='welcome-block';
  wb.innerHTML=`<div class="welcome-icon" style="background:${col}22;border:1px solid ${col}44"><i class="fa-solid fa-hashtag" style="color:${col};font-size:24px;text-shadow:0 0 12px ${col}"></i></div><div class="welcome-h">${esc(ch.name)}</div><div class="welcome-p">${esc(ch.topic||'Welcome to #'+ch.name+'!')}</div>`;
  feed.appendChild(wb);
  
  if(ch.type==='wordle'){_renderWordleBoard(ch,feed);}
  if(ch.type==='counting'){_renderCountingPanel(ch,feed);}
  if(ch.type==='reaction-roles'){_renderReactionRolesPanel(ch,feed);}
  if(ch.type==='user-suggestions'){_renderUserSuggestionsChannel(ch,feed);}
  if(ch.type==='suggestions'){_renderChannelBoard(ch,feed,'feature');}
  if(ch.type==='role-suggest'){_renderChannelBoard(ch,feed,'role');}
  if(ch.type==='truth-or-dare'){_renderTruthOrDarePanel(ch,feed);}
  if(ch.type==='poll-of-the-day'){_renderPotdPanel(ch,feed);}
  if(ch.type==='question-of-the-day'){_renderQotdPanel(ch,feed);}
  
  const msgRef=db.ref(mpath(id));
  const typingRef=db.ref('typing/'+G.srvId+'/'+id);
  msgRef.limitToLast(100).once('value',snap=>{
    
    if(G.channel!==id)return;
    const arr=[];snap.forEach(c=>arr.push({key:c.key,...c.val()}));
    arr.forEach(m=>{allMsgs.push(m);pushMsg(m,false);});
    scrollDown();
    const cutoff=arr.length?arr[arr.length-1].ts:Date.now();
    const seen=new Set(arr.map(m=>m.key));
    
    const liveQ=msgRef.orderByChild('ts').startAt(cutoff+1);
    const addedCb=liveQ.on('child_added',s2=>{
      if(seen.has(s2.key))return;seen.add(s2.key);
      const m={key:s2.key,...s2.val()};allMsgs.push(m);pushMsg(m,true);
    });
    _chListenerRefs.push({ref:liveQ,event:'child_added',cb:addedCb});
    listeners[id]=addedCb;
  });
  const remCb=msgRef.on('child_removed',s=>{document.getElementById('m-'+s.key)?.remove();allMsgs=allMsgs.filter(m=>m.key!==s.key);});
  _chListenerRefs.push({ref:msgRef,event:'child_removed',cb:remCb});
  const chgCb=msgRef.on('child_changed',s=>{
    const v=s.val()||{};
    const m={key:s.key,...v};
    
    const i=allMsgs.findIndex(x=>x.key===s.key);
    if(i>=0)allMsgs[i]={...allMsgs[i],...v,key:s.key};
    const el=document.getElementById('m-'+s.key);
    if(el){
      
      if(v.type==='poll'&&v.poll){
        _patchMsgPoll(el,m);
      }else{
        const t=el.querySelector('.msg-txt');
        if(t){t.innerHTML=fmtText(v.text||'')+(v.edited?'<span class="msg-edited">(edited)</span>':'');}
        const eb=el.querySelector('.act-btn[data-action="edit"]');
        if(eb)eb.dataset.txt=v.text||'';
      }
      
      _patchMsgReactions(el,m);
      
      try{
        const body=el.querySelector('.msg-body');
        if(body){
          const oldBadge=body.querySelector('.msg-thread-badge');
          const tc=v.threadCount||0;
          if(tc>0||v.threadOpen){
            const html=`<i class="fa-solid fa-comments" style="font-size:10px"></i>${tc>0?`${tc} ${tc===1?'reply':'replies'} in thread`:'Reply in thread'}<i class="fa-solid fa-chevron-right" style="font-size:9px;opacity:.5"></i>`;
            if(oldBadge){oldBadge.innerHTML=html;}
            else{
              const nb=document.createElement('div');
              nb.className='msg-thread-badge';
              nb.dataset.threadOpen=s.key;
              nb.style.cssText='margin-top:6px;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;background:rgba(179, 136, 255,.1);border:1px solid rgba(179, 136, 255,.3);border-radius:8px;font-size:11px;font-family:var(--mono);color:var(--purple);cursor:pointer';
              nb.innerHTML=html;
              body.appendChild(nb);
            }
          }else if(oldBadge){oldBadge.remove();}
        }
      }catch(e){}
    }
  });
  _chListenerRefs.push({ref:msgRef,event:'child_changed',cb:chgCb});
  const typCb=typingRef.on('value',snap=>{
    const d=snap.val()||{};const now=Date.now();
    const others=Object.keys(d).filter(u=>u!==me.username&&now-d[u].ts<4000);
    const bar=document.getElementById('typingRow');if(!bar)return;
    if(!others.length){bar.innerHTML='';return;}
    bar.innerHTML=`<div class="t-dots"><span></span><span></span><span></span></div>${others.map(u=>`<strong>${esc(u)}</strong>`).join(', ')} ${others.length===1?'is':'are'} typing…`;
  });
  _chListenerRefs.push({ref:typingRef,event:'value',cb:typCb});
}

// ─── MESSAGES ───
function pushMsg(m,animate){
  const feed=document.getElementById('msgs');if(!feed||m.banned)return;
  if((me.blocked||[]).includes(m.username))return;
  
  if(m.key&&document.getElementById('m-'+m.key))return;
  
  if(m.isLog){
    const ds=dayStr(m.ts);
    if(ds!==_lastDayStr){
      const sep=document.createElement('div');sep.className='date-sep';sep.dataset.d=ds;
      sep.innerHTML=`<span>${ds}</span>`;feed.appendChild(sep);
      _lastDayStr=ds;
      lastMsg={uid:'',ts:0};
    }
    const lcol=m.logType==='delete'?'var(--red)':(m.logType==='edit'?'var(--gold)':'var(--cyan)');
    const lic=m.logType==='delete'?'fa-trash-can':(m.logType==='edit'?'fa-pen':'fa-clipboard-list');
    const row=document.createElement('div');
    row.className='msg-row head log-row'+(animate?' fade-in':'');
    row.id='m-'+m.key;
    row.style.cssText='border-left:3px solid '+lcol+';background:linear-gradient(90deg,'+lcol.replace('var(--','rgba(').replace(')',',.06)')+',transparent);padding:8px 12px;margin:4px 0;border-radius:4px';
    row.innerHTML=`<div style="display:flex;gap:10px;align-items:flex-start"><div style="width:32px;height:32px;border-radius:50%;background:${lcol}22;border:1px solid ${lcol}66;display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="fa-solid ${lic}" style="color:${lcol};font-size:12px"></i></div><div style="flex:1;min-width:0"><div style="display:flex;gap:8px;align-items:center;margin-bottom:2px"><span style="font-size:11px;font-weight:700;color:${lcol};text-transform:uppercase;letter-spacing:1px;font-family:var(--mono)">AUDIT LOG</span><span class="msg-ts">${fmtTimeFull(m.ts)}</span></div><div class="msg-txt" style="font-size:13px;line-height:1.5;color:#cfd8de">${fmtText(m.text||'')}</div></div></div>`;
    feed.appendChild(row);
    return;
  }

  const col=roleColorFor(m.username||'?');
  const ds=dayStr(m.ts);

  if(ds!==_lastDayStr){
    const sep=document.createElement('div');sep.className='date-sep';sep.dataset.d=ds;
    sep.innerHTML=`<span>${ds}</span>`;feed.appendChild(sep);
    _lastDayStr=ds;
    lastMsg={uid:'',ts:0};
  }
  
  const sameAuthor=(m.username||m.uid)===(lastMsg.uid)&&(m.ts-lastMsg.ts)<420000&&!m.replyTo&&!m.forwarded;
  const grouped=sameAuthor;
  const row=document.createElement('div');
  row.className='msg-row'+(!grouped?' head':'')+(animate?' fade-in':'');
  row.id='m-'+m.key;
  const mine=m.username===me.username;
  const canDel=mine||hasPerm('manageMessages');
  const canPin=hasPerm('manageMessages');
  row.addEventListener('contextmenu',e=>{e.preventDefault();showMsgCtx(e,m,mine,canDel,canPin);});
  const rData=ROLES[m.userRole||'member']||ROLES.member;
  const badge=isPCOwner(m.username)?`<span class="msg-rbadge" style="background:rgba(179,136,255,.18);color:#b388ff;border:1px solid rgba(179,136,255,.45)"><i class="fa-solid fa-crown" style="font-size:8px;margin-right:3px"></i>PC-Owner</span>`:(m.userRole&&m.userRole!=='member'?`<span class="msg-rbadge" style="background:${rData.color}22;color:${rData.color};border:1px solid ${rData.color}44">${rData.name}</span>`:'');

const SLASH_COMMANDS=[
  {name:'help',desc:'List available commands',perm:null},
  {name:'purge',desc:'Delete last N messages from current channel (/purge 10)',perm:'manageMessages'},
  {name:'clear',desc:'Alias for /purge',perm:'manageMessages'},
  {name:'ban',desc:'Ban a user (/ban @user reason)',perm:'banMembers'},
  {name:'unban',desc:'Unban a user (/unban username)',perm:'banMembers'},
  {name:'kick',desc:'Kick a user (/kick @user reason)',perm:'kickMembers'},
  {name:'mute',desc:'Timeout 10m (/mute @user)',perm:'timeoutMembers'},
  {name:'unmute',desc:'Remove timeout (/unmute @user)',perm:'timeoutMembers'},
  {name:'timeout',desc:'Timeout N seconds (/timeout @user 600 reason)',perm:'timeoutMembers'},
  {name:'slowmode',desc:'Set slowmode in seconds (/slowmode 5)',perm:'manageServer'},
  {name:'nick',desc:'Change your display name (/nick NewName)',perm:null},
  {name:'status',desc:'Set your custom status (/status Working hard)',perm:null},
  {name:'me',desc:'Action message (/me waves)',perm:null},
  {name:'shrug',desc:'Insert a shrug',perm:null},
  {name:'ping',desc:'Test responsiveness',perm:null},
  {name:'poll',desc:'Create a poll (/poll Question? | opt1 | opt2 | opt3)',perm:null},
  {name:'deleteuser',desc:'Permanently delete a user account (owner only)',perm:'__ownerOnly'},
  {name:'deleteacc',desc:'Alias for /deleteuser',perm:'__ownerOnly'}
];

function _resolveUserArg(raw){
  if(!raw)return null;
  return raw.replace(/^@/,'').trim();
}

async function handleSlashCommand(rawText){
  const parts=rawText.slice(1).split(/\s+/);
  const cmd=(parts.shift()||'').toLowerCase();
  const rest=parts.join(' ');
  const known=SLASH_COMMANDS.find(c=>c.name===cmd);
  if(!known){toast('Unknown command: /'+cmd+'. Type /help.','error');return true;}
  
  if(known.perm==='__ownerOnly'){
    if(me.username!==OWNER){toast('Only the platform owner can run /'+cmd,'error');return true;}
  }else if(known.perm&&!hasPerm(known.perm)){toast('You lack permission for /'+cmd,'error');return true;}
  try{
    switch(cmd){
      case 'help':{
        let h='<div class="modal-title">Slash Commands</div><div class="modal-sub">Type these at the start of a message.</div><div style="max-height:340px;overflow-y:auto;margin-top:10px">';
        SLASH_COMMANDS.forEach(c=>{
          h+=`<div style="padding:6px 8px;border-bottom:1px solid rgba(179, 136, 255,.08);font-family:var(--mono);font-size:12px"><span style="color:var(--cyan)">/${c.name}</span> <span style="color:var(--muted);margin-left:6px">${esc(c.desc)}</span></div>`;
        });
        h+='</div>';
        openModal({html:h,footer:[{label:'Close',cls:'btn-ghost',fn:closeModal}]});
        return true;
      }
      case 'ping':{toast('pong \u26a1 '+(Date.now()%1000)+'ms','success');return true;}
      case 'poll':{

        if(!rest||!rest.includes('|')){showCreatePollModal();return true;}
        const segs=rest.split('|').map(s=>s.trim()).filter(s=>s.length);
        if(segs.length<3){toast('Usage: /poll Question? | option 1 | option 2','error');return true;}
        const q=segs.shift();
        if(segs.length>10){toast('Max 10 options','error');return true;}
        if(new Set(segs.map(s=>s.toLowerCase())).size!==segs.length){toast('Options must be unique','error');return true;}
        const now=Date.now();
        const poll={
          question:q,
          options:segs.map((t,i)=>({id:'o'+i+'_'+Math.random().toString(36).slice(2,6),text:t})),
          multi:false,anonymous:false,closed:false,createdAt:now
        };
        const payload={
          username:me.username,displayName:me.displayName||me.username,uid:me.uid,
          avatarUrl:me.avatarUrl||'',userRole:me.role,
          text:'',ts:now,replyTo:null,edited:false,
          type:'poll',poll
        };
        try{await db.ref('messages/'+G.srvId+'/'+G.channel).push(payload);toast('Poll posted','success');}
        catch(e){toast('Failed: '+(e.message||e.code||'error'),'error');}
        return true;
      }
      case 'deleteuser':
      case 'deleteacc':{
        const target=_resolveUserArg(rest.split(/\s+/)[0]);
        if(!target){toast('Usage: /deleteuser <username>','error');return true;}
        if(target.toLowerCase()===OWNER.toLowerCase()){toast("Can't delete the platform owner",'error');return true;}
        if(target.toLowerCase()===me.username.toLowerCase()){toast("Can't delete yourself",'error');return true;}
        await purgePlatformUser(target);
        return true;
      }
      case 'shrug':{
        const inp=document.getElementById('msgInput');
        if(inp){inp.value='\u00af\\_(\u30c4)_/\u00af';sendMsg();}
        return true;
      }
      case 'me':{
        if(!rest){toast('Usage: /me does something','error');return true;}
        const payload={username:me.username,displayName:me.displayName,uid:me.uid,avatarUrl:me.avatarUrl||'',userRole:me.role,text:'*'+me.displayName+' '+rest+'*',ts:Date.now(),action:true};
        await db.ref(mpath(G.channel)).push(payload);
        return true;
      }
      case 'nick':{
        if(!rest){toast('Usage: /nick NewName','error');return true;}
        me.displayName=rest.slice(0,32);
        await db.ref('users/'+me.username+'/displayName').set(me.displayName);
        toast('Display name updated','success');
        return true;
      }
      case 'status':{
        me.customStatus=rest.slice(0,80);
        await db.ref('users/'+me.username+'/customStatus').set(me.customStatus);
        toast(rest?('Status: '+rest):'Status cleared','success');
        return true;
      }
      case 'purge':
      case 'clear':{
        const n=Math.max(1,Math.min(100,parseInt(rest)||10));
        const snap=await db.ref(mpath(G.channel)).limitToLast(n).once('value');
        const updates={};
        snap.forEach(s=>{updates[s.key]=null;});
        await db.ref(mpath(G.channel)).update(updates);
        toast('Purged '+Object.keys(updates).length+' messages','success');
        return true;
      }
      case 'slowmode':{
        const s=Math.max(0,Math.min(21600,parseInt(rest)||0));
        await db.ref('servers/'+G.srvId+'/slowMode').set(s);
        srvData.slowMode=s;
        toast(s?('Slowmode: '+s+'s'):'Slowmode off','success');
        return true;
      }
      case 'kick':{
        const [userArg,...reasonParts]=parts;
        const u=_resolveUserArg(userArg);
        if(!u){toast('Usage: /kick @user reason','error');return true;}
        if(typeof kickMember==='function')await kickMember(u,reasonParts.join(' '));
        else toast('Kick unavailable','error');
        return true;
      }
      case 'ban':{
        const [userArg,...reasonParts]=parts;
        const u=_resolveUserArg(userArg);
        if(!u){toast('Usage: /ban @user reason','error');return true;}
        if(typeof banMember==='function')await banMember(u,reasonParts.join(' ')||'No reason');
        else toast('Ban unavailable','error');
        return true;
      }
      case 'unban':{
        const u=_resolveUserArg(parts[0]);
        if(!u){toast('Usage: /unban username','error');return true;}
        await db.ref('servers/'+G.srvId+'/bans/'+u).remove();
        toast('Unbanned '+u,'success');
        return true;
      }
      case 'mute':{
        const u=_resolveUserArg(parts[0]);
        if(!u){toast('Usage: /mute @user','error');return true;}
        if(typeof timeoutMember==='function')await timeoutMember(u,600,'Muted via /mute');
        return true;
      }
      case 'unmute':{
        const u=_resolveUserArg(parts[0]);
        if(!u){toast('Usage: /unmute @user','error');return true;}
        await db.ref('servers/'+G.srvId+'/timeouts/'+u).remove();
        toast('Unmuted '+u,'success');
        return true;
      }
      case 'timeout':{
        const u=_resolveUserArg(parts[0]);
        const sec=parseInt(parts[1])||300;
        const reason=parts.slice(2).join(' ');
        if(!u){toast('Usage: /timeout @user 600 reason','error');return true;}
        if(typeof timeoutMember==='function')await timeoutMember(u,sec,reason||'');
        return true;
      }
    }
  }catch(e){
    console.error('slash',e);
    toast('Command failed: '+(e.message||e),'error');
  }
  return true;
}

const WORDLE_WORDS=['apple','crane','grape','flame','plant','spice','crisp','globe','shine','quest','blaze','frost','dream','ocean','tiger','swift','prism','noble','royal','spear','peach','cliff','smoke','brick','glory','vivid','flock','crown','grasp','clout','prize','spell','knife','draft','flesh','torch','witch','blink','pulse','realm','craft','glide','steam','myrtle','quirk','grove','thumb','blame','glint','solid','vague','pride','clamp','fancy','chase','reach','bound','plumb','quick','knack','blame'];
function _wordleDayKey(){const d=new Date();return d.getUTCFullYear()+'-'+(d.getUTCMonth()+1)+'-'+d.getUTCDate();}
function _wordleWord(){const k=_wordleDayKey();let h=0;for(let i=0;i<k.length;i++)h=((h<<5)-h+k.charCodeAt(i))|0;return WORDLE_WORDS[Math.abs(h)%WORDLE_WORDS.length];}

async function _handleCountingMessage(ch,txt){
  if(!txt)return false;
  const trimmed=String(txt).trim();
  const n=parseInt(trimmed,10);
  if(isNaN(n)||!/^-?\d+$/.test(trimmed)){
    toast('Counting channel: send only numbers','info');
    return true;
  }
  if(n<=0){
    toast('Numbers must be positive','info');
    return true;
  }
  const stPath='servers/'+G.srvId+'/channels/'+ch.id+'/countingState';
  let st;
  try{
    const stSnap=await db.ref(stPath).once('value');
    st=stSnap.val()||{current:0,lastUser:''};
  }catch(e){
    console.error('[counting] state read failed',e);
    toast('Counting unavailable: '+(e.message||e.code||'error'),'error');
    return true;
  }

  const _pushMsg=async(text,extra,reaction)=>{
    const payload={username:me.username,displayName:me.displayName,uid:me.uid,avatarUrl:me.avatarUrl||'',userRole:me.role,ts:Date.now(),edited:false,text,...(extra||{})};
    let ref;
    try{
      ref=await db.ref(mpath(ch.id)).push(payload);
    }catch(e){
      console.error('[counting] message push failed',e);
      toast('Send failed: '+(e.message||e.code||'error'),'error');
      return null;
    }
    if(reaction&&ref){
      try{

        await db.ref(mpath(ch.id)+'/'+ref.key+'/reactions/'+encodeURIComponent(reaction)+'/PeakBot').set(true);
      }catch(e){console.warn('[counting] reaction set failed',e);}
    }
    return ref;
  };
  const _setState=async(current,lastUser,highScore)=>{
    try{
      const upd={current,lastUser};
      if(typeof highScore==='number')upd.highScore=highScore;
      await db.ref(stPath).update(upd);
    }catch(e){console.warn('[counting] state set failed',e);}
  };
  const _bumpLeaderboard=async(user,delta)=>{
    if(!user||!delta)return;
    const lbRef=db.ref('countingLeaderboard/'+G.srvId+'/'+ch.id+'/'+user);
    try{
      await lbRef.transaction(c=>(c||0)+delta);
    }catch(e){console.warn('[counting] LB bump failed',e);}
  };

  if(n===1){
    if(st.current===1&&st.lastUser===me.username){
      await _setState(0,'');
      await _pushMsg('1 — ❌ you can\'t count twice in a row!',{countingFail:true},'❌');
      toast('Reset! Wait for someone else.','error');
      return true;
    }
    const text=st.current>1?`🔄 1 — counter reset by ${me.displayName||me.username}`:'1';
    await _setState(1,me.username);
    await _pushMsg(text,{countingOk:true},'✅');
    return true;
  }
  
  if(st.current>0&&st.lastUser===me.username){
    await _setState(0,'');
    await _pushMsg(`${n} — ❌ you can't count twice in a row! Resetting back to 1.`,{countingFail:true},'❌');
    toast('Reset! You counted twice in a row.','error');
    return true;
  }
  
  const expected=(st.current||0)+1;
  if(n===expected){
    const newHigh=Math.max(st.highScore||0,n);
    await _setState(n,me.username,newHigh);
    
    _bumpLeaderboard(me.username,1);
    await _pushMsg(String(n),{countingOk:true},'✅');
    if(n>(st.highScore||0)){
      
      try{
        await db.ref(mpath(ch.id)).push({
          username:'PeakBot',displayName:'PeakBot',uid:'system',avatarUrl:'',userRole:'system',
          ts:Date.now()+1,text:`🏆 **New high score!** ${n} — set by **@${me.username}**`,system:true
        });
      }catch(e){}
    }
    if(n%100===0)toast(`🎉 Reached ${n}!`,'success');
    if(n%50===0&&n%100!==0){
      try{
        await db.ref(mpath(ch.id)).push({
          username:'PeakBot',displayName:'PeakBot',uid:'system',avatarUrl:'',userRole:'system',
          ts:Date.now()+1,text:`🎉 **${n}!** Keep going!`,system:true
        });
      }catch(e){}
    }
  }else{
    await _setState(0,'',st.highScore||0);
    await _pushMsg(`${n} — ❌ wrong! Expected ${expected}. Resetting to 1.`,{countingFail:true},'❌');
    toast(`Wrong! Expected ${expected}. Reset to 1.`,'error');
  }
  return true;
}
async function _handleWordleMessage(ch,txt){
  if(!txt)return false;
  const guess=txt.trim().toLowerCase();
  if(guess.length!==5||!/^[a-z]{5}$/.test(guess)){
    toast('Wordle: enter exactly 5 letters','info');return true;
  }
  const stRef=db.ref('servers/'+G.srvId+'/channels/'+ch.id+'/wordleState');
  const stSnap=await stRef.once('value');
  let st=stSnap.val();
  const today=_wordleDayKey();
  if(!st||st.dayKey!==today){st={dayKey:today,word:_wordleWord(),guesses:{}};await stRef.set(st);}
  const my=st.guesses?.[me.username]||{tries:[],solved:false};
  if(my.solved){toast('You already solved today\'s Wordle!','info');return true;}
  if((my.tries||[]).length>=6){toast('Out of tries — wait for tomorrow','error');return true;}
  
  const word=st.word;
  const result=[];
  for(let i=0;i<5;i++){
    if(guess[i]===word[i])result.push('🟩');
    else if(word.includes(guess[i]))result.push('🟨');
    else result.push('⬛');
  }
  my.tries=(my.tries||[]).concat([guess]);
  if(guess===word)my.solved=true;
  await stRef.child('guesses/'+me.username).set(my);

  if(my.solved){
    const newStreak=await _bumpWordleStreak(today);
    toast(`🎉 Solved in ${my.tries.length}! Streak: ${newStreak} 🔥`,'success');
  }else if(my.tries.length>=6){
    await _breakWordleStreak();
    toast(`❌ Out of tries — word was ${word.toUpperCase()}`,'error');
  }
  
  try{const ch2=srvData.channels.find(c=>c.id===G.channel);if(ch2&&ch2.type==='wordle')_renderWordleBoard(ch2);}catch(e){}
  return true;
}

function _wordleYesterdayKey(){
  const d=new Date();d.setDate(d.getDate()-1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
async function _bumpWordleStreak(todayKey){
  
  try{
    const ref=db.ref('users/'+me.username);
    const snap=await ref.once('value');
    const u=snap.val()||{};
    const last=u.wordleLastSolved||'';
    const cur=u.wordleStreak||0;
    let next;
    if(last===todayKey){next=cur||1;}                          
    else if(last===_wordleYesterdayKey())next=cur+1;
    else next=1;
    const best=Math.max(u.wordleBestStreak||0,next);
    await ref.update({wordleStreak:next,wordleBestStreak:best,wordleLastSolved:todayKey,wordleSolvedCount:(u.wordleSolvedCount||0)+(last===todayKey?0:1)});
    return next;
  }catch(e){console.warn('streak bump',e);return 1;}
}
async function _breakWordleStreak(){

  try{
    const ref=db.ref('users/'+me.username);
    await ref.update({wordleLastPlayed:_wordleDayKey()});
  }catch(e){}
}
async function _getMyWordleStreak(){
  try{
    const snap=await db.ref('users/'+me.username).once('value');
    const u=snap.val()||{};
    const last=u.wordleLastSolved||'';
    const today=_wordleDayKey();
    const yest=_wordleYesterdayKey();
    
    if(last===today||last===yest)return {cur:u.wordleStreak||0,best:u.wordleBestStreak||0,solvedToday:last===today};
    return {cur:0,best:u.wordleBestStreak||0,solvedToday:false};
  }catch(e){return{cur:0,best:0,solvedToday:false};}
}

async function _renderWordleBoard(ch,feedEl){
  const feed=feedEl||document.getElementById('msgs');if(!feed)return;
  
  feed.querySelectorAll('.wordle-ui').forEach(x=>x.remove());
  const stRef=db.ref('servers/'+G.srvId+'/channels/'+ch.id+'/wordleState');
  const stSnap=await stRef.once('value');
  let st=stSnap.val();
  const today=_wordleDayKey();
  if(!st||st.dayKey!==today){st={dayKey:today,word:_wordleWord(),guesses:{}};await stRef.set(st);}
  const my=(st.guesses&&st.guesses[me.username])||{tries:[],solved:false};
  const word=st.word;
  
  const wrap=document.createElement('div');
  wrap.className='wordle-ui';
  wrap.style.cssText='max-width:420px;margin:18px auto;padding:18px;background:linear-gradient(135deg,rgba(179, 136, 255,.05),rgba(140,90,255,.05));border:1px solid rgba(179, 136, 255,.25);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.4)';
  const tries=my.tries||[];
  const solved=!!my.solved;
  const remaining=6-tries.length;
  const finished=solved||tries.length>=6;
  
  const letterStatus={};
  tries.forEach(g=>{
    for(let i=0;i<5;i++){
      const ch2=g[i];
      let s='absent';
      if(word[i]===ch2)s='correct';
      else if(word.includes(ch2))s='present';
      const cur=letterStatus[ch2];
      if(!cur||(cur==='absent')||(cur==='present'&&s==='correct'))letterStatus[ch2]=s;
    }
  });
  const colorOf=s=>s==='correct'?'#16a34a':s==='present'?'#ca8a04':s==='absent'?'#374151':'transparent';
  const borderOf=s=>s==='correct'?'#16a34a':s==='present'?'#ca8a04':s==='absent'?'#1f2937':'rgba(179, 136, 255,.25)';
  
  const streak=await _getMyWordleStreak();
  const streakLine=streak.cur>0
    ? `<span style="color:#ff8c00">🔥 ${streak.cur}-day streak</span> · <span style="color:var(--muted)">best ${streak.best}</span>`
    : `<span style="color:var(--muted)">No active streak · best ${streak.best||0}</span>`;
  let h=`<div style="text-align:center;margin-bottom:14px"><div style="font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:2px">DAILY WORDLE · ${esc(today)}</div><div style="font-size:18px;font-weight:800;letter-spacing:4px;margin-top:4px;background:linear-gradient(90deg,var(--cyan),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent">PEAK·WORDLE</div><div style="font-family:var(--mono);font-size:10px;margin-top:6px">${streakLine}</div><div style="font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:3px">PRIVATE \u00b7 your tries are not posted to chat</div></div>`;
  
  h+=`<div style="display:grid;grid-template-rows:repeat(6,1fr);gap:6px;margin-bottom:16px">`;
  for(let r=0;r<6;r++){
    h+=`<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px">`;
    const g=tries[r]||'';
    for(let i=0;i<5;i++){
      const ltr=g[i]||'';
      let s='';
      if(g){if(word[i]===g[i])s='correct';else if(word.includes(g[i]))s='present';else s='absent';}
      const bg=colorOf(s);const bd=borderOf(s);
      h+=`<div style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:${bg==='transparent'?'rgba(10,7,22,.4)':bg};border:2px solid ${bd};border-radius:6px;font-size:22px;font-weight:800;color:#fff;text-transform:uppercase;font-family:var(--mono)">${esc(ltr)}</div>`;
    }
    h+=`</div>`;
  }
  h+=`</div>`;
  
  if(solved)h+=`<div style="text-align:center;color:#16a34a;font-weight:700;margin-bottom:10px">✅ Solved in ${tries.length} ${tries.length===1?'try':'tries'}!</div>`;
  else if(tries.length>=6)h+=`<div style="text-align:center;color:#ef4444;font-weight:700;margin-bottom:10px">❌ Out of tries! Word was <strong style="font-family:var(--mono);letter-spacing:2px">${esc(word.toUpperCase())}</strong></div>`;
  else h+=`<div style="text-align:center;color:var(--muted);font-family:var(--mono);font-size:11px;margin-bottom:10px">${remaining} ${remaining===1?'try':'tries'} left</div>`;

  if(!finished){
    h+=`<div id="wordleTypeRow" style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px;max-width:280px;margin-left:auto;margin-right:auto">
      ${[0,1,2,3,4].map(i=>`<input maxlength="1" data-wcell="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text" style="aspect-ratio:1;text-align:center;background:rgba(10,7,22,.6);border:2px solid rgba(179, 136, 255,.35);border-radius:6px;font-size:24px;font-weight:800;color:#fff;text-transform:uppercase;font-family:var(--mono);outline:none;width:100%;padding:0;caret-color:var(--cyan)"/>`).join('')}
    </div>
    <div style="text-align:center;margin-bottom:10px">
      <button id="wordleSubmit" class="btn-sub" style="padding:8px 22px;font-size:12px"><i class="fa-solid fa-paper-plane"></i> Guess</button>
    </div>`;
  }
  
  const rows=['qwertyuiop','asdfghjkl','zxcvbnm'];
  h+=`<div style="display:flex;flex-direction:column;gap:4px;align-items:center">`;
  rows.forEach((row,ri)=>{
    h+=`<div style="display:flex;gap:4px;justify-content:center">`;
    [...row].forEach(ltr=>{
      const s=letterStatus[ltr]||'';
      const bg=s?colorOf(s):'rgba(179, 136, 255,.08)';
      const bd=s?borderOf(s):'rgba(179, 136, 255,.2)';
      h+=`<div data-wkey="${esc(ltr)}" style="min-width:28px;padding:8px 6px;background:${bg};border:1px solid ${bd};border-radius:5px;color:#fff;font-weight:700;font-family:var(--mono);font-size:12px;text-transform:uppercase;cursor:pointer;user-select:none">${esc(ltr)}</div>`;
    });
    h+=`</div>`;
  });
  h+=`</div>`;

  const lbInner=_buildWordleLeaderboard(st.guesses||{},word);
  if(lbInner){
    h+=`<div data-wordle-lb style="margin-top:14px;padding-top:12px;border-top:1px solid rgba(179, 136, 255,.1)">${lbInner}</div>`;
  }else{
    h+=`<div data-wordle-lb style="display:none"></div>`;
  }
  wrap.innerHTML=h;
  feed.appendChild(wrap);
  
  const cells=wrap.querySelectorAll('[data-wcell]');
  const submitGuess=()=>{
    const guess=Array.from(cells).map(c=>c.value.trim().toLowerCase()).join('');
    if(guess.length!==5){toast('Need 5 letters','info');return;}
    if(!/^[a-z]{5}$/.test(guess)){toast('Letters only','error');return;}
    _handleWordleMessage(ch,guess).then(()=>{
      
      cells.forEach(c=>{c.value='';});
      cells[0]?.focus();
    });
  };
  cells.forEach((c,i)=>{
    c.addEventListener('input',e=>{
      
      const v=e.target.value.replace(/[^a-zA-Z]/g,'').slice(-1);
      e.target.value=v.toUpperCase();
      if(v&&i<4)cells[i+1].focus();
    });
    c.addEventListener('keydown',e=>{
      if(e.key==='Backspace'&&!c.value&&i>0){cells[i-1].focus();}
      else if(e.key==='Enter'){e.preventDefault();submitGuess();}
      else if(e.key==='ArrowLeft'&&i>0){cells[i-1].focus();}
      else if(e.key==='ArrowRight'&&i<4){cells[i+1].focus();}
    });
    
    c.addEventListener('paste',e=>{
      const t=(e.clipboardData||window.clipboardData).getData('text');
      if(!t)return;
      const clean=t.replace(/[^a-zA-Z]/g,'').slice(0,5);
      if(clean.length>=2){
        e.preventDefault();
        for(let k=0;k<clean.length&&k+i<5;k++){cells[k+i].value=clean[k].toUpperCase();}
        const last=Math.min(i+clean.length,5)-1;
        cells[last]?.focus();
      }
    });
  });
  document.getElementById('wordleSubmit')?.addEventListener('click',submitGuess);
  
  if(!finished){const first=Array.from(cells).find(c=>!c.value);(first||cells[0])?.focus();}
  
  wrap.querySelectorAll('[data-wkey]').forEach(el=>{
    el.addEventListener('click',()=>{
      if(finished)return;
      const empty=Array.from(cells).find(c=>!c.value);
      if(empty){empty.value=el.dataset.wkey.toUpperCase();empty.dispatchEvent(new Event('input'));}
    });
  });

  const lb=wrap.querySelector('[data-wordle-lb]');
  if(lb){
    let lastHash=lb.dataset.hash||'';
    const liveCb=stRef.on('value',snap=>{
      const v=snap.val();if(!v||v.dayKey!==today)return;
      
      const focused=document.activeElement;
      if(focused&&focused.matches&&focused.matches('[data-wcell]'))return;
      const guesses=v.guesses||{};
      const hash=Object.keys(guesses).map(u=>u+':'+(guesses[u]&&guesses[u].tries||[]).length+':'+(guesses[u]&&guesses[u].solved?1:0)).sort().join('|');
      if(hash===lastHash)return;
      lastHash=hash;
      try{
        const html=_buildWordleLeaderboard(guesses,v.word);
        lb.innerHTML=html;
        
        lb.style.display=html?'':'none';
        if(html){lb.style.marginTop='14px';lb.style.paddingTop='12px';lb.style.borderTop='1px solid rgba(179, 136, 255,.1)';}
      }catch(e){console.warn('[wordle] lb refresh',e);}
    });
    _chListenerRefs.push({ref:stRef,event:'value',cb:liveCb});
  }
}

function _buildWordleLeaderboard(guesses,word){
  const others=Object.entries(guesses||{}).filter(([u])=>u!==me.username);
  if(!others.length)return '';
  others.sort((a,b)=>{
    const A=a[1]||{},B=b[1]||{};
    const aDone=A.solved?1:(((A.tries||[]).length>=6)?-1:0);
    const bDone=B.solved?1:(((B.tries||[]).length>=6)?-1:0);
    if(aDone!==bDone)return bDone-aDone;
    return ((A.tries||[]).length)-((B.tries||[]).length);
  });
  let h=`<div style="font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:8px">Today's players · ${others.length}</div>
    <div style="display:flex;flex-direction:column;gap:6px;max-height:160px;overflow-y:auto">`;
  others.forEach(([u,d])=>{
    const t=(d&&d.tries)||[];
    const dn=((window._userProfiles||{})[u]||{}).displayName||u;
    let stat,colorTag;
    if(d&&d.solved){stat=`✅ Solved in ${t.length} ${t.length===1?'try':'tries'}`;colorTag='#23d160';}
    else if(t.length>=6){stat=`❌ Out of tries`;colorTag='#ef4444';}
    else{stat=`🟡 ${t.length}/6`;colorTag='#fbbf24';}
    let emojiGrid='';
    if(d&&(d.solved||t.length>=6)&&word){
      emojiGrid=t.map(g=>{
        let row='';
        for(let i=0;i<5;i++){
          if(g[i]===word[i])row+='🟩';
          else if(word.includes(g[i]))row+='🟨';
          else row+='⬛';
        }
        return row;
      }).join(' ');
    }
    h+=`<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;background:rgba(10,7,22,.5);border:1px solid rgba(255,255,255,.05);border-radius:6px">
      <div style="width:24px;height:24px;flex-shrink:0">${avHtml(u,((window._userProfiles||{})[u]||{}).avatarUrl||'',24)}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(dn)}</div>
        <div style="font-size:10px;color:${colorTag};font-family:var(--mono)">${stat}${emojiGrid?' · '+emojiGrid:''}</div>
      </div>
    </div>`;
  });
  h+=`</div>`;
  return h;
}

          <div style="width:32px;height:32px;flex-shrink:0">${avHtml(s.by,s.byAvatar||'',32)}</div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap">
              <span style="font-family:var(--grotesk);font-weight:800;font-size:15px">${esc(s.title||'')}</span>
              <span style="font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:1.5px;padding:2px 7px;border-radius:999px;background:${stCol}22;color:${stCol};border:1px solid ${stCol}55">${stLbl}</span>

          </div>
        </div>

      _showChannelBoardDetail(ch,kind,b.dataset.chbopen,L);
    });
    listBox.querySelectorAll('[data-chbvote]').forEach(b=>b.onclick=async e=>{
      e.stopPropagation();
      const id=b.dataset.chbvote;
      const ref=db.ref('channelBoards/'+G.srvId+'/'+ch.id+'/'+id+'/upvotes/'+me.username);
      try{const s=await ref.once('value');if(s.exists())await ref.remove();else await ref.set(true);}
      catch(err){toast('Vote failed','error');}
    });
  };
  try{const s=await boardRef.once('value');render(s.val());}catch(e){render(null);}
  const cb=boardRef.on('value',sn=>render(sn.val()));
  _chListenerRefs.push({ref:boardRef,event:'value',cb});
}

function _showChannelBoardSubmit(ch,kind,L){
  openModal({html:`
    <div class="modal-title"><i class="fa-solid ${kind==='role'?'fa-user-tag':'fa-lightbulb'}" style="color:var(--cyan)"></i> ${L.cta}</div>
    <div class="modal-sub">Submit your ${kind==='role'?'role request':'suggestion'}. Admins will review and chat with you on it.</div>

    <input class="modal-inp" id="chbTitle" maxlength="80" placeholder="${esc(L.placeholder)}" autocomplete="off"/>
    <label class="modal-label">Details <span style="color:var(--muted);font-weight:400;font-size:10px">(optional)</span></label>
    <textarea class="modal-inp" id="chbBody" rows="3" maxlength="500" placeholder="Anything else admins should know" style="resize:vertical;min-height:60px"></textarea>`,
    footer:[
      {label:'Submit',cls:'btn-sub',fn:async()=>{
        const title=(document.getElementById('chbTitle').value||'').trim().slice(0,80);
        const body=(document.getElementById('chbBody').value||'').trim().slice(0,500);

        if(_isBadName(title)||_isBadName(body)){toast('Please rephrase','error');return;}
        const id='b-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
        try{
          await db.ref('channelBoards/'+G.srvId+'/'+ch.id+'/'+id).set({
            by:me.username,byDisplay:me.displayName||me.username,byAvatar:me.avatarUrl||'',

          });

        }catch(e){toast('Submit failed: '+(e.message||'unknown'),'error');}
      }},
      {label:'Cancel',cls:'btn-ghost',fn:closeModal}

async function _showChannelBoardDetail(ch,kind,sugId,L){
  const isAdmin=hasPerm('manageServer')||hasPerm('manageRoles');

  try{const r=await db.ref('channelBoards/'+G.srvId+'/'+ch.id+'/'+sugId).once('value');s={id:sugId,...(r.val()||{})};}catch(e){}
  if(!s.by){toast('Not found','error');return;}
  const stLbl={pending:'⏳ Pending',approved:'✅ Approved',rejected:'❌ Rejected'}[s.status||'pending'];
  const stColor={pending:'#fbbf24',approved:'#23d160',rejected:'#ef4444'}[s.status||'pending'];
  openModal({wide:true,html:`
    <div class="modal-title"><i class="fa-solid ${kind==='role'?'fa-user-tag':'fa-lightbulb'}" style="color:var(--cyan)"></i> ${esc(s.title||'')}</div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:4px">
      <div style="width:28px;height:28px">${avHtml(s.by,s.byAvatar||'',28)}</div>
      <div style="font-size:12px"><strong>${esc(s.byDisplay||s.by)}</strong> <span style="color:var(--muted);font-family:var(--mono);font-size:10px">${fmtTimeFull(s.ts||0)}</span></div>
      <div style="margin-left:auto;color:${stColor};font-weight:700;font-size:12px">${stLbl}</div>
    </div>
    ${s.body?`<div style="margin-top:14px;padding:12px;background:rgba(0,0,0,.3);border:1px solid rgba(179, 136, 255,.12);border-radius:10px;font-size:13px;color:#cdd0e0;line-height:1.55;white-space:pre-wrap">${fmtText(s.body)}</div>`:''}
    ${isAdmin&&s.status==='pending'?`<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn-sub" data-chbaction="approved" style="padding:8px 16px;font-size:12px;background:#23d160;color:#04030a"><i class="fa-solid fa-check"></i> Approve</button>
      <button class="btn-danger" data-chbaction="rejected" style="padding:8px 16px;font-size:12px"><i class="fa-solid fa-xmark"></i> Reject</button>
    </div>`:''}
    <label class="modal-label" style="margin-top:18px">Discussion</label>
    <div id="chbChat" style="display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto;padding:8px;background:rgba(0,0,0,.25);border-radius:8px;border:1px solid rgba(255,255,255,.05);min-height:80px"></div>
    <div style="display:flex;gap:6px;margin-top:8px">
      <input class="modal-inp" id="chbChatInp" placeholder="Say something..." maxlength="500" style="margin:0;flex:1"/>
      <button class="btn-sub" id="chbChatSend" style="padding:8px 14px;font-size:11px"><i class="fa-solid fa-paper-plane"></i></button>
    </div>`,
    footer:[{label:'Close',cls:'btn-ghost',fn:closeModal}]
  });
  document.querySelectorAll('[data-chbaction]').forEach(b=>b.onclick=async()=>{
    try{
      await db.ref('channelBoards/'+G.srvId+'/'+ch.id+'/'+sugId).update({status:b.dataset.chbaction,decidedBy:me.username,decidedAt:Date.now()});
      try{await db.ref('channelBoards/'+G.srvId+'/'+ch.id+'/'+sugId+'/messages').push({by:'__system',text:`Marked ${b.dataset.chbaction} by ${me.displayName||me.username}`,ts:Date.now()});}catch(e){}
      toast('Updated','success');
      closeModal();_showChannelBoardDetail(ch,kind,sugId,L);
    }catch(e){toast('Update failed','error');}
  });
  const chatBox=document.getElementById('chbChat');
  const msgsRef=db.ref('channelBoards/'+G.srvId+'/'+ch.id+'/'+sugId+'/messages');
  const renderChat=msgs=>{
    if(!chatBox)return;
    const arr=Object.entries(msgs||{}).map(([k,v])=>({k,...v})).sort((a,b)=>(a.ts||0)-(b.ts||0));
    if(!arr.length){chatBox.innerHTML='<div style="padding:14px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:11px">No messages yet.</div>';return;}
    chatBox.innerHTML=arr.map(m=>{
      if(m.by==='__system')return `<div style="text-align:center;color:var(--muted);font-family:var(--mono);font-size:10px;padding:4px 0">— ${esc(m.text)} —</div>`;
      const mine=m.by===me.username;
      const prof=(window._userProfiles||{})[m.by]||{};
      const dn=prof.displayName||m.by;
      return `<div style="display:flex;${mine?'justify-content:flex-end':''}">
        <div style="max-width:75%;padding:6px 10px;background:${mine?'rgba(179, 136, 255,.12)':'rgba(255,255,255,.05)'};border-radius:10px">
          <div style="font-size:10px;color:var(--muted);font-family:var(--mono);margin-bottom:2px">${esc(dn)} · ${fmtTime(m.ts||0)}</div>
          <div style="font-size:12.5px;color:#fff;white-space:pre-wrap;line-height:1.4">${fmtText(m.text||'')}</div>
        </div>
      </div>`;
    }).join('');
    chatBox.scrollTop=chatBox.scrollHeight;
  };
  try{const ms=await msgsRef.once('value');renderChat(ms.val());}catch(e){}
  const cb=msgsRef.on('value',sn=>renderChat(sn.val()));
  window._chbChatTeardown=()=>{try{msgsRef.off('value',cb);}catch(e){}};
  const sendChat=async()=>{
    const inp=document.getElementById('chbChatInp');
    const txt=(inp.value||'').trim().slice(0,500);
    if(!txt)return;
    inp.value='';
    try{await msgsRef.push({by:me.username,text:txt,ts:Date.now()});}
    catch(e){toast('Send failed','error');inp.value=txt;}
  };
  document.getElementById('chbChatSend').onclick=sendChat;
  document.getElementById('chbChatInp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}});
}

// Interactive panel: two big buttons. Each click pulls a deterministic
// random item from the bank and posts it as a PeakBot message.
async function _renderTruthOrDarePanel(ch,feedEl){
  const feed=feedEl||document.getElementById('msgs');if(!feed)return;
  feed.querySelectorAll('.tod-ui').forEach(x=>x.remove());
  const wrap=document.createElement('div');
  wrap.className='tod-ui';
  wrap.style.cssText='max-width:680px;margin:18px auto;padding:24px;background:linear-gradient(135deg,rgba(179, 136, 255,.08),rgba(156, 77, 204,.05));border:1px solid rgba(156, 77, 204,.3);border-radius:14px;text-align:center';
  wrap.innerHTML=`
    <div style="font-family:var(--grotesk);font-size:22px;font-weight:800;margin-bottom:8px;background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent">Truth or Dare</div>
    <div style="font-size:12px;color:var(--muted);font-family:var(--mono);margin-bottom:18px">Pick one. PeakBot will pull from a bank of ${TRUTH_BANK.length} truths and ${DARE_BANK.length} dares.</div>
    <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap">
      <button class="btn-sub" id="todTruth" style="padding:16px 36px;font-size:16px;font-family:var(--grotesk);font-weight:800;background:linear-gradient(135deg,rgba(179, 136, 255,.15),rgba(179, 136, 255,.05));border:2px solid var(--cyan);min-width:160px"><i class="fa-solid fa-lightbulb" style="margin-right:8px"></i>TRUTH</button>
      <button class="btn-sub" id="todDare" style="padding:16px 36px;font-size:16px;font-family:var(--grotesk);font-weight:800;background:linear-gradient(135deg,rgba(156, 77, 204,.15),rgba(156, 77, 204,.05));border:2px solid var(--pink);min-width:160px;color:var(--pink)"><i class="fa-solid fa-fire" style="margin-right:8px"></i>DARE</button>
    </div>`;
  feed.appendChild(wrap);
  const post=async(kind)=>{
    const bank=kind==='truth'?TRUTH_BANK:DARE_BANK;
    const idx=Math.floor(Math.random()*bank.length);
    const item=bank[idx];
    const emoji=kind==='truth'?'💡':'🔥';
    const label=kind==='truth'?'TRUTH':'DARE';
    const color=kind==='truth'?'#00f2ff':'#ff4fd8';
    const text=`${emoji} **${label}** for **@${me.username}** — ${item}`;
    try{
      await db.ref('messages/'+G.srvId+'/'+ch.id).push({
        username:'PeakBot',uid:'system',displayName:'PeakBot',
        avatarUrl:'',userRole:'system',
        text,ts:Date.now(),replyTo:null,edited:false,
        todKind:kind,todTarget:me.username
      });
    }catch(e){toast('Post failed: '+(e.message||'error'),'error');}
  };
  document.getElementById('todTruth').onclick=()=>post('truth');
  document.getElementById('todDare').onclick=()=>post('dare');
}

    const panels=Object.entries(snapVal||{}).map(([id,p])=>({id,...p})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    if(!panels.length){
      panelsBox.innerHTML=`<div style="padding:30px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:12px;border:1px dashed rgba(255,255,255,.1);border-radius:10px">No reaction-role panels yet.${canManage?' Click <strong style="color:var(--cyan)">New Panel</strong> to create one.':''}</div>`;

    const myMember=(srvData.members||{})[me.username]||{};
    const myCustomRoles=new Set(myMember.customRoles||[]);
    panelsBox.innerHTML=panels.map(p=>{
      const accent=p.color||'#00f2ff';
      const buttons=(p.buttons||[]).map((btn,i)=>{

        if(!role)return `<button class="btn-ghost" disabled style="padding:8px 14px;font-size:11px;opacity:.5">${esc(btn.label||'?')} (deleted role)</button>`;
        const have=myCustomRoles.has(role.id);
        return `<button data-rrclick="${eattr(p.id)}" data-rridx="${i}" style="padding:8px 14px;font-size:11px;font-weight:700;border:1px solid ${have?role.color:'rgba(255,255,255,.15)'};background:${have?role.color+'22':'rgba(0,0,0,.3)'};color:${have?role.color:'#fff'};border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:var(--grotesk);transition:all .15s"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${role.color};box-shadow:0 0 6px ${role.color}"></span>${esc(btn.label||role.name)}${have?' <i class="fa-solid fa-check" style="font-size:9px"></i>':''}</button>`;
      }).join('');
      return `<div style="padding:18px;background:rgba(10,7,22,.6);border:1px solid ${accent}33;border-left:4px solid ${accent};border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.3);position:relative">
        ${canManage?`<div style="position:absolute;top:10px;right:10px;display:flex;gap:4px"><button class="btn-ghost" data-rredit="${eattr(p.id)}" style="padding:4px 8px;font-size:10px"><i class="fa-solid fa-pen"></i></button><button class="btn-ghost" data-rrdel="${eattr(p.id)}" style="padding:4px 8px;font-size:10px;color:var(--rose)"><i class="fa-solid fa-trash"></i></button></div>`:''}
        <div style="font-family:var(--grotesk);font-size:16px;font-weight:800;color:${accent};margin-bottom:6px">${esc(p.title||'Pick a Role')}</div>
        ${p.description?`<div style="font-size:12.5px;line-height:1.5;color:#cdd0e0;margin-bottom:12px;white-space:pre-wrap">${fmtText(p.description)}</div>`:''}
        <div style="display:flex;flex-wrap:wrap;gap:8px">${buttons}</div>
      </div>`;
    }).join('');
    // Wire buttons
    panelsBox.querySelectorAll('[data-rrclick]').forEach(b=>b.onclick=async()=>{
      const panel=panels.find(x=>x.id===b.dataset.rrclick);
      if(!panel)return;
      const btnDef=(panel.buttons||[])[parseInt(b.dataset.rridx)];
      if(!btnDef)return;
      await _toggleReactionRole(btnDef.roleId);
    });
    if(canManage){
      panelsBox.querySelectorAll('[data-rredit]').forEach(b=>b.onclick=()=>{
        const p=panels.find(x=>x.id===b.dataset.rredit);
        if(p)showReactionRolePanelEditor(ch,p);
      });
      panelsBox.querySelectorAll('[data-rrdel]').forEach(b=>b.onclick=async()=>{
        if(!(await uiConfirm('Delete this reaction-role panel?',{title:'Delete Panel',okLabel:'Delete',danger:true})))return;
        try{await db.ref('servers/'+G.srvId+'/channels/'+ch.id+'/reactionPanels/'+b.dataset.rrdel).remove();toast('Panel deleted','success');}
        catch(e){toast('Delete failed','error');}
      });
    }
  };
  // Initial paint + live listener
  try{const s=await panelsRef.once('value');renderPanels(s.val());}catch(e){renderPanels(null);}
  const cb=panelsRef.on('value',s=>renderPanels(s.val()));
  _chListenerRefs.push({ref:panelsRef,event:'value',cb});
}

// Toggle a custom role on/off for the current user (used by reaction-roles).
async function _toggleReactionRole(roleId){
  if(!G.srvId||!roleId){return;}
  // Find the role definition — we won't grant roles members can't get
  const role=(srvData.customRoles||[]).find(r=>r.id===roleId);
  if(!role){toast('Role no longer exists','error');return;}
  const memRef=db.ref('servers/'+G.srvId+'/members/'+me.username+'/customRoles');
  try{
    const snap=await memRef.once('value');
    const cur=Array.isArray(snap.val())?snap.val():[];
    const have=cur.includes(roleId);
    const next=have?cur.filter(x=>x!==roleId):[...cur,roleId];
    await memRef.set(next);
    if(srvData.members&&srvData.members[me.username]){
      srvData.members[me.username].customRoles=next;
    }
    me._customRoleIds=next;
    toast(have?'Role removed':'Got the role: '+role.name,'success');
  }catch(e){console.error('reaction-role toggle failed',e);toast('Could not toggle role: '+(e.message||e.code||'error'),'error');}
}

async function sendMsg(){
  const inp=document.getElementById('msgInput');if(!inp)return;
  let txt=inp.value.trim();
  if(!txt&&!pendingFile)return;
  if(!G.channel||!hasPerm('sendMessages')){toast('Cannot send messages','error');return;}
  // ── TIMEOUT CHECK ── Always re-check the DB on every send so a timeout
  // applied while a user is connected actually takes effect immediately.
  if(G.srvId){
    try{
      const toSnap=await db.ref('servers/'+G.srvId+'/timeouts/'+me.username).once('value');
      if(toSnap.exists()){
        const t=toSnap.val()||{};
        const remMs=(t.until||0)-Date.now();
        if(remMs>0){
          const rem=Math.ceil(remMs/1000);
          const human=rem>=86400?Math.ceil(rem/86400)+'d':rem>=3600?Math.ceil(rem/3600)+'h':rem>=60?Math.ceil(rem/60)+'m':rem+'s';
          toast(`\u23f1\ufe0f You're timed out for ${human}${t.reason?' \u2014 '+t.reason:''}`,'error');
          inp.disabled=true;
          inp.placeholder=`Timed out for ${human}\u2026`;
          // Auto-reenable when the timeout expires
          clearTimeout(window._toReenableTimer);
          window._toReenableTimer=setTimeout(()=>{
            if(inp){inp.disabled=false;inp.placeholder='Message';}
            toast('Timeout expired','success');
          },remMs+200);
          return;
        }else{
          // Stale timeout entry — clean up so others (admin UIs) don't see ghosts
          db.ref('servers/'+G.srvId+'/timeouts/'+me.username).remove().catch(()=>{});
        }
      }
    }catch(e){console.warn('timeout check',e);}
  }
  
  const _curCh=(srvData&&Array.isArray(srvData.channels))?srvData.channels.find(c=>c.id===G.channel):null;
  if(_curCh&&(_curCh.readOnly||_curCh.isLog)&&!hasPerm('manageMessages')){toast('This channel is read-only','error');return;}
  
  if(_curCh&&_curCh.type==='counting'){
    const handled=await _handleCountingMessage(_curCh,txt);
    if(handled){
      inp.value='';inp.style.height='';

      requestAnimationFrame(()=>{const f=document.getElementById('msgs');if(f)f.scrollTop=f.scrollHeight;});
      setTimeout(()=>{const f=document.getElementById('msgs');if(f)f.scrollTop=f.scrollHeight;},250);
      return;
    }
  }
  
  if(_curCh&&_curCh.type==='wordle'){
    const handled=await _handleWordleMessage(_curCh,txt);
    if(handled){inp.value='';inp.style.height='';return;}
  }
  
  if(txt.startsWith('/')){
    const handled=await handleSlashCommand(txt);
    if(handled){inp.value='';inp.style.height='';cancelReply();stopTyping();return;}
  }
  const now=Date.now();
  const cd=(srvData.slowMode||0)*1000;
  if(cd>0&&!hasPerm('manageMessages')&&now-lastSent<cd){toast(`Slow mode: wait ${Math.ceil((cd-(now-lastSent))/1000)}s`,'info');return;}
  if(now-lastSent<500){toast('Slow down!','info');return;}
  if(_automodShouldBlock(txt))return;

  try{
    const struck=await automodCheckStrike(G.srvId,me.username,txt);
    if(struck){toast('Message blocked — strike issued','error');inp.value='';inp.style.height='';return;}
  }catch(e){console.warn('automodCheckStrike',e);}
  lastSent=now;
  txt=automod(txt);
  const payload={username:me.username,displayName:me.displayName,uid:me.uid,avatarUrl:me.avatarUrl||'',userRole:me.role,text:txt,ts:now,replyTo:G.reply||null,edited:false};
  if(pendingFile){
    try{
      if(pendingFile._isGif&&pendingFile._gifUrl){
        payload.attachmentUrl=pendingFile._gifUrl;
        payload.attachmentName='gif';
        payload.attachmentType='image';
      }else{

        const isImg=pendingFile.type&&pendingFile.type.startsWith('image/');
        let uploaded=false;
        if(pendingFile.size>300*1024){
          try{
            const ref=storage.ref('attachments/'+G.srvId+'/'+now+'_'+pendingFile.name);
            await ref.put(pendingFile);
            payload.attachmentUrl=await ref.getDownloadURL();
            payload.attachmentName=pendingFile.name;
            payload.attachmentType=isImg?'image':'file';
            uploaded=true;
          }catch(stErr){console.warn('[PC] Storage upload failed, falling back to data URL:',stErr.code||stErr.message);}
        }
        if(!uploaded){
          if(isImg){
            
            let durl;
            if(pendingFile.size>900*1024){
              durl=await _shrinkImage(pendingFile,800,0.82);
              if(durl.length>800000)durl=await _shrinkImage(pendingFile,560,0.72);
              if(durl.length>500000)durl=await _shrinkImage(pendingFile,400,0.6);
            }else{
              durl=await _fileToDataURL(pendingFile);
            }
            payload.attachmentUrl=durl;
            payload.attachmentName=pendingFile.name||'image';
            payload.attachmentType='image';
          }else{

            if(pendingFile.size>5*1024*1024){toast('File too large (max 5MB inline). Configure Firebase Storage for bigger files.','error');return;}
            const durl=await _fileToDataURL(pendingFile);
            payload.attachmentUrl=durl;
            payload.attachmentName=pendingFile.name||'file';
            payload.attachmentType='file';
            payload.attachmentMime=pendingFile.type||'application/octet-stream';
          }
        }
      }
    }catch(e){toast('Upload failed: '+(e.message||e),'error');return;}
    pendingFile=null;
    const fp=document.getElementById('filePreview');if(fp)fp.innerHTML='';
  }

  const srvRoles=(srvData.customRoles||[]);
  const lowTxt=txt.toLowerCase();
  const mentionedRoleIds=[];
  srvRoles.forEach(r=>{
    if(!r||!r.name)return;
    
    const escPat=r.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const re=new RegExp('@'+escPat+'(?![a-zA-Z0-9_])','i');
    if(re.test(txt))mentionedRoleIds.push(r.id);
  });
  
  const rawMatches=txt.match(/@([a-zA-Z0-9_\-]+)/g)||[];
  const rawNames=[...new Set(rawMatches.map(x=>x.slice(1)))];
  const wantsEveryone=rawNames.some(n=>n.toLowerCase()==='everyone');
  const wantsHere=rawNames.some(n=>n.toLowerCase()==='here');

  const canPingEveryone=hasPerm('mentionEveryone');
  if((wantsEveryone||wantsHere)&&!canPingEveryone){
    toast('Only admins can ping @everyone or @here','info');
  }
  
  if(wantsEveryone&&canPingEveryone)payload.pingEveryone=true;
  if(wantsHere&&canPingEveryone)payload.pingHere=true;
  if(mentionedRoleIds.length)payload.pingRoles=mentionedRoleIds;
  await db.ref(mpath(G.channel)).push(payload);
  
  const memberSnap=await db.ref('servers/'+G.srvId+'/members').once('value');
  const allMembers=Object.keys(memberSnap.val()||{}).filter(u=>u!==me.username);
  const presence=await db.ref('presence').once('value');
  const onlineSet=new Set(Object.keys(presence.val()||{}).filter(u=>(presence.val()[u]||{}).status==='online'));
  const notifTargets=new Set();

  if(wantsEveryone&&canPingEveryone){allMembers.forEach(u=>notifTargets.add(u));}
  if(wantsHere&&canPingEveryone){allMembers.filter(u=>onlineSet.has(u)).forEach(u=>notifTargets.add(u));}
  if(mentionedRoleIds.length){
    const mems=memberSnap.val()||{};
    Object.entries(mems).forEach(([u,d])=>{
      if(u===me.username)return;
      const userRoleIds=d.customRoles||[];
      if(mentionedRoleIds.some(rid=>userRoleIds.includes(rid)))notifTargets.add(u);
    });
  }
  
  const firstWordRoleSet=new Set(srvRoles.map(r=>(r.name||'').split(/\s+/)[0].toLowerCase()).filter(Boolean));
  const userMentions=rawNames.filter(n=>!['everyone','here'].includes(n.toLowerCase())&&!firstWordRoleSet.has(n.toLowerCase()));
  for(const u of userMentions){
    const s=await db.ref('users/'+u).once('value');
    if(s.exists()&&u!==me.username)notifTargets.add(u);
  }
  for(const u of notifTargets){
    db.ref('notifications/'+u).push({
      type:'mention',
      from:me.username,
      fromAvatar:me.avatarUrl||'',
      server:srvData.name,
      srvId:G.srvId,
      channel:G.channel,
      text:txt.slice(0,200),
      ts:now,
      pingType:wantsEveryone?'everyone':wantsHere?'here':(mentionedRoleIds.length?'role':'user')
    });
  }
  inp.value='';inp.style.height='';
  cancelReply();stopTyping();
}
